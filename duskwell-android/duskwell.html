// ---------------------------------------------------------------- The Rime Queen
// A floating sovereign of frost. She never touches the ground: fans of ice shards, falling icicles, rings of
// cold, a low sweep across the hall and (from the second wound on) columns of killing light.
class Queen extends Boss {
  constructor(d) { super(d, 72, 100, { key: 'queen', hp: 210, geo: 240, phases: [0.66, 0.33], blood: '#cfeeff' }); this.grav = false; this.last = ''; }
  get hoverY() { return this.floorY - 6 * TILE; }
  *chooseAttack() {
    yield* this.wait(this.phase === 1 ? 0.55 : this.phase === 2 ? 0.4 : 0.28);
    const opts = ['shards', 'icefall', 'ring'];
    if (this.phase >= 2) opts.push('sweep', 'beams');
    if (this.phase >= 3) opts.push('blink');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  fan(n, spread, speed) {
    const a = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx);
    for (let i = 0; i < n; i++) {
      const o = (i - (n - 1) / 2) * spread;
      G.projs.push(new Proj({ kind: 'shard', x: this.cx, y: this.cy, vx: Math.cos(a + o) * speed, vy: Math.sin(a + o) * speed, r: 7, dmg: 1, color: '#9fdcff', life: 3, rot: a + o, pal: ICE }));
    }
  }
  *shards() {
    const L = G.level;
    yield* this.flyTo(clamp(G.player.cx + pick([-1, 1]) * rand(170, 290), 4 * TILE, L.pw - 4 * TILE), this.hoverY, 380);
    const rounds = this.phase >= 3 ? 4 : this.phase >= 2 ? 3 : 2;
    for (let r = 0; r < rounds; r++) {
      this.facePlayer(); this.tele = 1; Sound.play('tele');
      yield* this.hover(0.45 * this.spd);
      this.tele = 0; Sound.play('shoot');
      this.fan(this.phase >= 2 ? 5 : 3, 0.26, 360);
      yield* this.hover(0.32);
    }
    yield* this.wait(0.25);
  }
  *icefall() {
    const L = G.level;
    yield* this.flyTo(L.pw / 2, this.hoverY - 50, 380);
    this.tele = 1; Sound.play('roar');
    const n = this.phase >= 3 ? 9 : this.phase >= 2 ? 7 : 5;
    for (let i = 0; i < n; i++) {
      spawnRock(clamp(G.player.cx + rand(-280, 280), 3 * TILE, L.pw - 3 * TILE), 0.85, ICE);
      yield* this.hover(0.2);
    }
    yield* this.hover(0.9);
    this.tele = 0;
  }
  *ring() {
    const L = G.level;
    yield* this.flyTo(clamp(L.pw / 2 + rand(-120, 120), 5 * TILE, L.pw - 5 * TILE), this.hoverY - 20, 360);
    this.tele = 1; Sound.play('tele');
    yield* this.hover(0.6 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const rings = this.phase >= 2 ? 2 : 1, n = this.phase >= 3 ? 14 : 10;
    for (let r = 0; r < rings; r++) {
      const off = r * Math.PI / n + (this.phase >= 3 ? this.t : 0);
      for (let i = 0; i < n; i++) {
        const a = off + i * Math.PI * 2 / n;
        G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.cy, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, r: 10, dmg: 1, color: '#bfe8ff', life: 3.2, pal: ICE }));
      }
      yield* this.hover(0.55);
    }
    yield* this.hover(0.4);
  }
  *sweep() {                                   // a low pass across the hall: jump it, then the cold bursts up behind her
    const L = G.level, side = this.cx < L.pw / 2 ? 1 : -1;
    yield* this.flyTo(side > 0 ? 4 * TILE : L.pw - 4 * TILE, this.floorY - 50, 420);
    this.face = side; this.tele = 1; Sound.play('tele');
    yield* this.hover(0.55 * this.spd);
    this.tele = 0; Sound.play('dash'); this.sweeping = true;
    let t = 2.2;
    while (t > 0 && ((side > 0 && this.cx < L.pw - 4 * TILE) || (side < 0 && this.cx > 4 * TILE))) {
      this.vx = side * (this.phase >= 3 ? 640 : 540); this.vy = 0; this.doMelee(-this.w / 2 - 8, 6, this.w + 16, this.h - 6, 1, 0.05);
      if (Math.random() < 0.5) G.burst(this.cx - side * 20, this.cy + rand(-20, 30), 1, { color: '#dff3ff', speed: 60, life: 0.4, size: 3 });
      t -= this.dt; yield;
    }
    this.sweeping = false; this.vx = 0; Sound.play('slam'); G.shake(6, 0.2);
    this.fan(5, 0.4, 340);
    yield* this.flyTo(this.cx, this.hoverY, 380);
  }
  *beams() {
    const L = G.level, n = 2 + this.phase;
    yield* this.flyTo(L.pw / 2, this.hoverY - 40, 380);
    this.tele = 1;
    for (let i = 0; i < n; i++) {
      spawnBeam(i % 2 === 0 ? G.player.cx : clamp(G.player.cx + rand(-240, 240), 3 * TILE, L.pw - 3 * TILE), 0.8, 0.3, 44, ICE);
      yield* this.hover(0.5);
    }
    yield* this.hover(0.9);
    this.tele = 0;
  }
  *blink() {
    const L = G.level;
    this.ghostly = true;
    for (let a = 1; a > 0; a -= 0.1) { this.alpha = a; yield; }
    this.alpha = 0; yield* this.wait(0.3);
    this.x = clamp(G.player.cx + pick([-1, 1]) * rand(140, 300), 4 * TILE, L.pw - 4 * TILE) - this.w / 2; this.y = this.hoverY - rand(0, 70);
    for (let a = 0; a < 1; a += 0.1) { this.alpha = a; yield; }
    this.alpha = 1; this.ghostly = false;
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.hover(0.35);
    this.tele = 0; Sound.play('shoot'); this.fan(7, 0.2, 400);
    yield* this.hover(0.3);
  }
}

// ---------------------------------------------------------------- Thunderhoof
// A bull of the high peaks, armoured in storm-cloud, the mid-boss of Stormcrest. It charges, stamps and gores, and
// once it is hurt enough it calls the lightning down. (Mid-bosses guard a way on; they leave geo, not a seal.)
class Thunderhoof extends Boss {
  constructor(d) { super(d, 132, 92, { key: 'thunderhoof', hp: 170, geo: 160, phases: [0.5], blood: '#cfe0ff' }); this.last = ''; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.7 : 0.45);
    const opts = ['charge', 'stomp', 'gore'];
    if (this.phase >= 2) opts.push('thunder');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  bolts(n) {
    const L = G.level;
    for (let i = 0; i < n; i++) spawnBeam(clamp(G.player.cx + (i === 0 ? 0 : rand(-260, 260)), 3 * TILE, L.pw - 3 * TILE), 0.85 + i * 0.12, 0.3, 44, BOLT);
  }
  *charge() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.6 * this.spd);
    this.tele = 0; this.charging = true;
    let t = 1.7;
    while (t > 0) {
      this.vx = this.face * (this.phase >= 2 ? 620 : 520); this.doMelee(-this.w / 2, 12, this.w, this.h - 12, 1, 0.05);
      if (Math.random() < 0.5) G.burst(this.cx - this.face * 50, this.y + this.h - 8, 1, { color: '#dfe9ff', speed: 100, life: 0.35, size: 3, vy: -40 });
      t -= this.dt; if (this.hitL || this.hitR) break; yield;
    }
    this.vx = 0; this.charging = false; Sound.play('slam'); G.shake(9, 0.3); this.stunned = true;
    this.bolts(this.phase >= 2 ? 3 : 2);
    yield* this.wait(1.2);
    this.stunned = false;
  }
  *stomp() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.7 * this.spd);
    this.tele = 0; this.doMelee(24, 14, 150, 80, 2, 0.25);
    Sound.play('slam'); G.shake(8, 0.3);
    for (const d of [-1, 1]) spawnShock(this.cx + d * 80, this.y + this.h, d, 430, '#dfe9ff');
    yield* this.wait(0.8 * this.spd);
  }
  *gore() {
    const lunges = this.phase >= 2 ? 2 : 1;
    for (let i = 0; i < lunges; i++) {
      this.facePlayer(); this.tele = 1; Sound.play('tele');
      yield* this.wait(0.4 * this.spd);
      this.tele = 0; Sound.play('dash');
      let t = 0.38;
      while (t > 0) { this.vx = this.face * 760; this.doMelee(-this.w / 2, 8, this.w + 20, this.h - 8, 1, 0.05); t -= this.dt; if (this.hitL || this.hitR) break; yield; }
      this.vx = 0;
      yield* this.wait(0.22);
    }
    yield* this.wait(0.5 * this.spd);
  }
  *thunder() {
    this.tele = 1; Sound.play('roar'); G.shake(5, 0.6);
    yield* this.wait(0.4);
    this.bolts(this.phase >= 2 ? 4 : 3);
    yield* this.wait(1.5);
    this.tele = 0;
  }
}

// ---------------------------------------------------------------- The Storm Roc
// A great bird that rules the summit. It strafes the hall dropping needles, swoops across it, dives, calls lightning
// in columns, and (from the first wound on) beats up a gale that shoves the hero along the floor.
class Roc extends Boss {
  constructor(d) { super(d, 124, 90, { key: 'roc', hp: 260, geo: 280, phases: [0.66, 0.33], blood: '#cfe0ff' }); this.grav = false; this.last = ''; this.galeZone = null; }
  get hoverY() { return this.floorY - 5.5 * TILE; }
  *chooseAttack() {
    yield* this.wait(this.phase === 1 ? 0.55 : this.phase === 2 ? 0.4 : 0.28);
    const opts = ['strafe', 'swoop', 'lightning'];
    if (this.phase >= 2) opts.push('dive', 'gale');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  needle(x, y, vx, vy) { G.projs.push(new Proj({ kind: 'needle', x, y, vx, vy, r: 8, dmg: 1, color: '#e8f0ff', life: 2.6 })); }
  *strafe() {                                    // fly the length of the hall, a rain of needles behind
    const L = G.level, side = this.cx < L.pw / 2 ? 1 : -1;
    yield* this.flyTo(side > 0 ? 4 * TILE : L.pw - 4 * TILE, this.hoverY - 30, 420);
    this.face = side; this.tele = 1; Sound.play('tele');
    yield* this.hover(0.5 * this.spd);
    this.tele = 0; Sound.play('shoot');
    let t = 3, n = 0;
    while (t > 0 && ((side > 0 && this.cx < L.pw - 4 * TILE) || (side < 0 && this.cx > 4 * TILE))) {
      this.vx = side * (this.phase >= 3 ? 400 : 320); this.vy = Math.sin(this.t * 6) * 20; this.face = side;
      if (++n % (this.phase >= 2 ? 9 : 13) === 0) { this.needle(this.cx, this.cy + 20, rand(-40, 40), 380); if (this.phase >= 2) this.needle(this.cx, this.cy + 20, (G.player.cx - this.cx) * 0.9, 330); }
      t -= this.dt; yield;
    }
    this.vx = this.vy = 0;
    yield* this.flyTo(L.pw / 2, this.hoverY, 380);
  }
  *swoop() {                                     // a diagonal pass across the hall, low over the floor
    const L = G.level, side = G.player.cx < L.pw / 2 ? -1 : 1;           // start on the far side from the hero
    yield* this.flyTo(side > 0 ? L.pw - 3 * TILE : 3 * TILE, this.hoverY - 70, 420);
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.hover(0.55 * this.spd);
    this.tele = 0; Sound.play('dash'); this.sweeping = true;
    const tx = clamp(2 * G.player.cx - this.cx, 3 * TILE, L.pw - 3 * TILE), ty = this.floorY - 56;
    const dx = tx - this.cx, dy = ty - this.cy, d = Math.hypot(dx, dy) || 1, sp = this.phase >= 3 ? 740 : 640;
    let t = 1.4;
    while (t > 0 && Math.hypot(tx - this.cx, ty - this.cy) > 40) {
      this.vx = dx / d * sp; this.vy = dy / d * sp; this.face = sign(dx) || this.face; this.doMelee(-this.w / 2, 4, this.w, this.h - 4, 1, 0.05);
      t -= this.dt; yield;
    }
    this.sweeping = false; this.vx = this.vy = 0; Sound.play('slam'); G.shake(6, 0.2);
    for (const dd of [-1, 1]) spawnShock(this.cx + dd * 30, this.floorY, dd, 380, '#dfe9ff');
    yield* this.flyTo(this.cx, this.hoverY, 380);
  }
  *lightning() {
    const L = G.level, n = 3 + this.phase;
    yield* this.flyTo(L.pw / 2, this.hoverY - 40, 380);
    this.tele = 1; Sound.play('roar');
    for (let i = 0; i < n; i++) {
      spawnBeam(i % 2 === 0 ? G.player.cx : clamp(G.player.cx + rand(-260, 260), 3 * TILE, L.pw - 3 * TILE), 0.85, 0.3, 44, BOLT);
      yield* this.hover(0.45);
    }
    yield* this.hover(0.9);
    this.tele = 0;
  }
  *dive() {
    const L = G.level;
    yield* this.flyTo(clamp(G.player.cx, 4 * TILE, L.pw - 4 * TILE), this.hoverY - 60, 440);
    this.tele = 1; Sound.play('tele');
    let t = 0.5 * this.spd;
    while (t > 0) { this.vx = clamp((G.player.cx - this.cx) * 4, -320, 320); this.vy = 0; t -= this.dt; yield; }
    this.tele = 0; Sound.play('dash'); this.sweeping = true;
    let tt = 1.1;
    while (tt > 0 && this.cy < this.floorY - 52) { this.vx = 0; this.vy = 760; this.doMelee(-this.w / 2, 4, this.w, this.h, 1, 0.05); tt -= this.dt; yield; }
    this.sweeping = false; this.vx = this.vy = 0; Sound.play('slam'); G.shake(9, 0.3);
    for (const dd of [-1, 1]) { spawnShock(this.cx + dd * 30, this.floorY, dd, 420, '#dfe9ff'); }
    yield* this.wait(0.35);
    yield* this.flyTo(this.cx, this.hoverY, 340);
  }
  *gale() {                                      // a crosswind across the whole hall, and needles to dodge while it shoves
    const L = G.level, dir = pick([-1, 1]);
    yield* this.flyTo(L.pw / 2, this.hoverY - 40, 380);
    this.tele = 1; Sound.play('roar');
    yield* this.hover(0.6);
    this.galeZone = { x: 0, y: 0, w: L.pw, h: L.ph, wx: dir * (this.phase >= 3 ? 190 : 150), wy: 0 };
    L.winds.push(this.galeZone);
    for (let i = 0; i < 6; i++) {
      this.needle(clamp(G.player.cx + rand(-90, 90), 3 * TILE, L.pw - 3 * TILE), this.cy, 0, 360);
      yield* this.hover(0.42);
    }
    this.endGale(); this.tele = 0;
  }
  endGale() { if (this.galeZone) { const L = G.level; L.winds = L.winds.filter(w => w !== this.galeZone); this.galeZone = null; } }
  shiftRoutine() { this.endGale(); return super.shiftRoutine(); }
  kill() { this.endGale(); super.kill(); }
}

// ---------------------------------------------------------------- The Glass Duelist
// The mid-boss of the Mirror Vault: a fencer of black glass. It lunges, strings blows together and, above all, guards:
// while the blade is up your strikes ring off it and it answers with a riposte. Wait out the guard, strike after.
class Duelist extends Boss {
  constructor(d) { super(d, 46, 90, { key: 'duelist', hp: 190, geo: 170, phases: [0.5], blood: '#d4ccff' }); this.last = ''; this.guarding = false; this.parried = false; }
  hurt(dmg, dir, how) {
    if (this.guarding && this.state === 'fight' && !this.invul && how !== 'burn') {            // the blade is up: it turns the blow aside
      this.parried = true; Sound.play('clank'); G.hitstop(0.04);
      G.burst(this.cx + this.face * 30, this.cy - 10, 10, { color: '#f4efff', speed: 240, life: 0.3, size: 2 });
      return false;                              // the player gains no soul from a parried blow
    }
    super.hurt(dmg, dir, how);
  }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.6 : 0.35);
    const opts = ['lunge', 'combo', 'guard'];
    if (this.phase >= 2) opts.push('shatter', 'rain');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  *step(dir, speed, t) { let x = t; while (x > 0) { this.vx = dir * speed; x -= this.dt; if (this.hitL || this.hitR) break; yield; } this.vx = 0; }
  *lunge() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.4 * this.spd);
    this.tele = 0; Sound.play('dash'); this.lunging = true;
    let t = 0.3;
    while (t > 0) { this.vx = this.face * 880; this.doMelee(10, 30, 120, 22, 1, 0.06); t -= this.dt; if (this.hitL || this.hitR) break; yield; }
    this.vx = 0; this.lunging = false;
    yield* this.wait(0.7 * this.spd);
  }
  *combo() {
    const n = this.phase >= 2 ? 4 : 3;
    for (let i = 0; i < n; i++) {
      this.facePlayer(); this.tele = 1; Sound.play('tele');
      yield* this.wait(0.26 * this.spd);
      this.tele = 0; Sound.play('slash'); this.slashing = i % 2 + 1;
      this.doMelee(6, i % 2 ? 40 : 14, 100, i % 2 ? 24 : 60, 1, 0.14);
      yield* this.step(this.face, 300, 0.14);
      yield* this.wait(0.12);
      this.slashing = 0;
    }
    yield* this.wait(0.7 * this.spd);
  }
  *guard() {                                    // blade up; a blow that lands on it is answered at once
    this.facePlayer(); this.guarding = true; this.parried = false; Sound.play('clank');
    let t = 1.5 * (this.phase >= 2 ? 0.85 : 1), answered = false;
    while (t > 0) {
      this.facePlayer(); this.vx = 0;
      if (this.parried) { answered = true; break; }
      t -= this.dt; yield;
    }
    this.guarding = false;
    if (answered) {                              // the riposte: fast, long, and not telegraphed enough, which is the lesson
      this.parried = false; this.facePlayer(); this.tele = 1;
      yield* this.wait(0.12);
      this.tele = 0; Sound.play('dash'); this.lunging = true;
      let x = 0.34; while (x > 0) { this.vx = this.face * 900; this.doMelee(10, 30, 130, 24, 2, 0.06); x -= this.dt; if (this.hitL || this.hitR) break; yield; }
      this.vx = 0; this.lunging = false;
      yield* this.wait(0.55);
    } else {                                     // nobody struck: it comes down in a slow overhead, wide open afterwards
      this.tele = 1; Sound.play('tele'); yield* this.wait(0.5); this.tele = 0; Sound.play('slam'); G.shake(5, 0.2);
      this.slashing = 2; this.doMelee(10, -10, 90, 100, 1, 0.2); yield* this.wait(0.2); this.slashing = 0;
      this.stunned = true; yield* this.wait(1.1); this.stunned = false;
    }
  }
  *shatter() {                                  // a back-step, a fan of glass, then straight at you
    this.facePlayer(); this.vy = -380; this.vx = -this.face * 340; this.onGround = false;
    yield; yield; yield* this.until(() => this.onGround, 1); this.vx = 0;
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.35 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const a = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx);
    for (let i = -2; i <= 2; i++) G.projs.push(new Proj({ kind: 'shard', x: this.cx + this.face * 30, y: this.cy - 10, vx: Math.cos(a + i * 0.2) * 420, vy: Math.sin(a + i * 0.2) * 420, r: 7, dmg: 1, color: '#c8b8ff', life: 2.4, rot: a + i * 0.2, pal: GLASS }));
    yield* this.wait(0.3);
    yield* this.lunge();
  }
  *rain() {
    const L = G.level; this.tele = 1; Sound.play('roar');
    for (let i = 0; i < 7; i++) { spawnRock(clamp(G.player.cx + rand(-300, 300), 3 * TILE, L.pw - 3 * TILE), 0.8, GLASS); yield* this.wait(0.2); }
    yield* this.wait(1.0); this.tele = 0;
  }
}

// ---------------------------------------------------------------- The Wanderer's Twin
// The dark reflection of the hero, the last secret of the Mirror Vault. It fights with your own tools: the nail, the
// dash, the double jump, the soul bolt, the Dusk Cry. Third phase: it steps through the mirror to strike from behind.
class Twin extends Boss {
  constructor(d) { super(d, 32, 58, { key: 'twin', hp: 330, geo: 400, phases: [0.66, 0.33], blood: '#d8c8ff' }); this.last = ''; this.dashing = false; this.slashing = 0; this.airborne = false; }
  hb() { return { x: this.x + 3, y: this.y + 2, w: this.w - 6, h: this.h - 2 }; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.55 : this.phase === 2 ? 0.38 : 0.26);
    const opts = ['rush', 'dashSlash', 'leap', 'bolt'];
    if (this.phase >= 2) opts.push('cry', 'echo');
    if (this.phase >= 3) opts.push('mirrorStep');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  *slash(up) {                                   // one swing of the nail
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.2 * this.spd);
    this.tele = 0; Sound.play('slash'); this.slashing = up ? 2 : 1;
    this.doMelee(up ? -20 : 4, up ? -36 : 6, up ? 50 : 96, up ? 70 : 54, 1, 0.14);
    yield* this.wait(0.2);
    this.slashing = 0;
  }
  *rush() {                                      // run in, two or three swings
    this.facePlayer(); let t = 1.4;
    while (t > 0 && Math.abs(G.player.cx - this.cx) > 70) { this.facePlayer(); this.vx = this.face * (this.phase >= 3 ? 420 : 360); t -= this.dt; yield; }
    this.vx = 0;
    const n = this.phase >= 2 ? 3 : 2;
    for (let i = 0; i < n; i++) { yield* this.slash(false); this.vx = this.face * 140; yield* this.wait(0.05); this.vx = 0; }
    yield* this.wait(0.4 * this.spd);
  }
  *dashSlash() {                                 // the Shadow Dash: through your side, a swing on the far side
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.38 * this.spd);
    this.tele = 0; Sound.play('dash'); this.dashing = true;
    const dir = this.face; let t = 0.24;
    while (t > 0) { this.vx = dir * 820; t -= this.dt; if (this.hitL || this.hitR) break; yield; }
    this.vx = 0; this.dashing = false;
    this.face = -dir; this.facePlayer();
    yield* this.slash(false);
    yield* this.wait(0.45 * this.spd);
  }
  *leap() {                                      // jump, a second jump in the air, then the Soul Dive
    this.facePlayer(); this.vy = -720; this.vx = clamp((G.player.cx - this.cx) * 0.8, -300, 300); this.onGround = false; this.airborne = true; Sound.play('jump');
    yield* this.wait(0.3);
    this.vy = -560; Sound.play('djump'); G.ring(this.cx, this.cy + 20, '#d8c8ff');
    yield* this.wait(0.22);
    this.tele = 1; this.vx = 0; this.vy = -60; yield* this.wait(0.18); this.tele = 0;
    this.diving = true; this.vy = 1000; this.vx = clamp((G.player.cx - this.cx) * 1.2, -260, 260);
    while (!this.onGround) { this.doMelee(-24, this.h - 20, 48, 46, 2, 0.05); yield; }
    this.diving = false; this.airborne = false; this.vx = 0; Sound.play('slam'); G.shake(8, 0.25);
    for (const d of [-1, 1]) spawnShock(this.cx + d * 30, this.y + this.h, d, 380, '#d8c8ff');
    yield* this.wait(0.6 * this.spd);
  }
  *bolt() {                                      // your own soul bolt, sent back
    this.facePlayer(); this.tele = 1; this.casting = true; Sound.play('tele');
    yield* this.wait(0.4 * this.spd);
    this.tele = 0; Sound.play('cast');
    const n = this.phase >= 2 ? 2 : 1;
    for (let i = 0; i < n; i++) {
      this.facePlayer();
      G.projs.push(new Proj({ kind: 'bolt', x: this.cx + this.face * 30, y: this.cy - 4 + i * 26, vx: this.face * 520, vy: 0, r: 12, dmg: 1, color: '#d8c8ff', life: 2.2, pierce: false }));
      yield* this.wait(0.25);
    }
    this.casting = false;
    yield* this.wait(0.5 * this.spd);
  }
  *cry() {                                       // the Dusk Cry: a column of violet light where you stand
    this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.wait(0.3);
    const L = G.level, n = this.phase >= 3 ? 3 : 2;
    for (let i = 0; i < n; i++) { spawnPillar(clamp(G.player.cx + (i ? rand(-200, 200) : 0), 3 * TILE, L.pw - 3 * TILE), this.floorY, 0.8, 0.45, 300, { fill: '#d8c8ff', fill2: '#ffffff', glow: '#c8b8ff', rgb: '200,185,255' }); yield* this.wait(0.3); }
    yield* this.wait(1.0); this.tele = 0; this.casting = false;
  }
  *echo() {                                      // three crescents of the Blade Echo, one above the other
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.45 * this.spd);
    this.tele = 0; Sound.play('slash'); this.slashing = 1;
    for (let i = 0; i < 3; i++) G.projs.push(new Proj({ kind: 'wave', x: this.cx + this.face * 34, y: this.y + 10 + i * 24, vx: this.face * 420, vy: 0, r: 15, dmg: 1, color: '#d8c8ff', life: 1.8, pierce: true }));
    yield* this.wait(0.25); this.slashing = 0;
    yield* this.wait(0.6 * this.spd);
  }
  *mirrorStep() {                                // out of the glass behind you
    const L = G.level;
    this.ghostly = true;
    for (let a = 1; a > 0; a -= 0.1) { this.alpha = a; yield; }
    this.alpha = 0; yield* this.wait(0.3);
    this.x = clamp(G.player.cx - G.player.face * 90, 3 * TILE, L.pw - 3 * TILE) - this.w / 2; this.y = this.floorY - this.h - 2; this.vy = 0;
    for (let a = 0; a < 1; a += 0.12) { this.alpha = a; yield; }
    this.alpha = 1; this.ghostly = false; this.facePlayer();
    yield* this.slash(false);
    yield* this.slash(true);
    yield* this.wait(0.45);
  }
}

const BOSS_TYPES = { duelist: Duelist, twin: Twin, thunderhoof: Thunderhoof, roc: Roc, queen: Queen, colossus: Colossus, guardian: Guardian, weaver: Weaver, wraith: Wraith, king: King, spore: Sporecap, drowned: Drowned, brood: Brood };

</script>
<script>
'use strict';
// The creatures of the Ossuary and the Lunar Observatory. Each brain is one switch over currentState, like the
// older enemies in entities.js: the Heap (rises, and rises again once), the Skull Bat (spits teeth), the Censer
// (a swinging thurible that breathes wisps), the Lensling (aims a ray), the Orrery (a core and three orbits) and
// the Lunar Hare (leaps; in low gravity it flies).

// projectile palettes of the two areas (see tintedProj in art_sprites.js)
const BONEP = { fill: '#efe6d0', fill2: '#ffffff', glow: '#d8f0d0', rgb: '230,225,200', base: '#6a5a44' };
const WISPP = { fill: '#bfe8d0', fill2: '#f0fff6', glow: '#9fe8c0', rgb: '160,232,192' };
const STARP = { fill: '#dfe6ff', fill2: '#ffffff', glow: '#b8c4ff', rgb: '200,210,255', base: '#2a3060' };

// the length a ray can travel from (x, y) along angle a before it meets a wall
function rayLength(x, y, a, max) {
  const L = G.level, dx = Math.cos(a), dy = Math.sin(a);
  for (let d = 0; d < max; d += 8) if (L.solidAtPx(x + dx * d, y + dy * d)) return d;
  return max;
}
// the part of a line of light that wounds: spawns a ray that warns for tele seconds, then burns for dur
function spawnRay(x, y, a, o) {
  o = o || {};
  G.projs.push(new Proj({ kind: 'ray', x, y, a, len: rayLength(x, y, a, o.len || 760), rw: o.rw || 16, tele: o.tele == null ? 0.5 : o.tele, dur: o.dur || 0.24, dmg: 1, life: 4, pierce: true, passWalls: true, color: o.color || '#cfe0ff', pal: o.pal }));
}

// ---------------------------------------------------------------- the Heap
class BoneHeap extends Enemy {
  constructor(d) {
    super(d, 34, 46); this.hp = 7; this.geo = 5; this.kb = 0.8; this.blood = '#efe6d0'; this.dmg = 0; this.revived = false;
    this.currentState = 'pile'; this.rise = 0;
  }
  hb() {
    const s = this.currentState, b = this.y + this.h;
    if (s === 'pile' || s === 'reform') return { x: this.x, y: b - 16, w: this.w, h: 16 };
    if (s === 'skull') return { x: this.x + 8, y: b - 18, w: 18, h: 18 };

  }
  body() {

  onHurt(dir, how) {
    const s = this.currentState;
    if (s === 'pile' || s === 'skull' || s === 'rising' || s === 'reform') { G.burst(this.cx, this.cy + 10, 6, { color: '#efe6d0', speed: 140, life: 0.3, size: 3 }); return; }

// ---------------------------------------------------------------- the Skull Bat
class SkullBat extends Flyer {
  constructor(d) { super(d); this.hp = 9; this.geo = 5; this.blood = '#efe6d0'; this.spit = rand(1, 2.2); this.glowR = 70; }
  update(dt) {
    this.tick(dt); this.spit -= dt;

        this.steer(p.cx + Math.sin(this.t * 1.1) * 150, p.cy - 112 + Math.sin(this.t * 3.2) * 12, 125, 380, dt);

        }
        break;
      case ST.RECOIL:
        this.vx *= 0.94; this.vy *= 0.94;
        if (this.stateT > 0.2) this.setState(ST.CHASE);
        break;

    this.physics(dt, false);
    if (this.hitL || this.hitR) this.vx = 0; if (this.hitU || this.onGround) this.vy = 0;

// ---------------------------------------------------------------- the Censer
// A thurible on a chain from the ceiling. It swings, glows when it has seen you, and breathes a ring of green wisps.
class Censer extends Enemy {

  }

    Sound.play('cast');

    for (let i = 0; i < n; i++) { const a = a0 + i * Math.PI * 2 / n; G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.cy, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, r: 8, dmg: 1, life: 2.6, color: '#9fe8c0', pal: WISPP })); }

}

// ---------------------------------------------------------------- the Lensling
class Lensling extends Enemy {
  constructor(d) { super(d, 36, 30); this.hp = 14; this.geo = 5; this.kb = 0.7; this.blood = '#e8d8ff'; this.glowR = 90; this.cool = rand(0.5, 1.4); this.aim = 0; }

    this.tick(dt); this.cool -= dt;

        if (this.cool <= 0 && this.seesPlayer(460)) { this.vx = 0; this.setState(ST.ANTICIPATION); Sound.play('tele'); }

        break;
      case ST.RECOIL:
        if (this.onGround) this.vx *= 0.85;

// ---------------------------------------------------------------- the Orrery
class Orrery extends Enemy {
  constructor(d) { super(d, 30, 30); this.hp = 22; this.geo = 8; this.kb = 0.5; this.blood = '#ffe9a0'; this.glowR = 130; this.ph = rand(0, 6); this.orbA = rand(0, 6); this.R = 46; }

        if (this.stateT > 0.2) this.setState(ST.CHASE);
        break;
    }
    this.physics(dt, false);
    if (this.hitL || this.hitR) this.vx = 0; if (this.hitU || this.onGround) this.vy = 0;
    if (!p.dead) for (let i = 0; i < 3; i++) { const o = this.orbPos(i); if (overlap(p.hurtbox(), { x: o.x - 8, y: o.y - 8, w: 16, h: 16 })) p.hurt(1, o.x); }

// ---------------------------------------------------------------- the Lunar Hare
class LunarHare extends Enemy {
  constructor(d) { super(d, 34, 30); this.hp = 12; this.geo = 4; this.blood = '#e0e8ff'; this.wait = rand(0.5, 1.5); }
  update(dt) {
    this.tick(dt);
    const p = G.player;
    switch (this.currentState) {
      case ST.IDLE:
        if (this.onGround) this.vx *= 0.8;
        if (this.onGround && this.stateT > this.wait && this.seesPlayer(420)) { this.face = p.cx > this.cx ? 1 : -1; this.setState(ST.ANTICIPATION); }
        break;
      case ST.ANTICIPATION:         // ears back, a crouch

      case ST.ATTACK:
        if (this.onGround && this.stateT > 0.12) { this.wait = rand(0.8, 1.5); this.setState(ST.IDLE); }
        break;
      case ST.RECOIL:
        if (this.onGround) this.vx *= 0.85;
        if (this.stateT > 0.2) this.setState(ST.IDLE);
        break;
    }
    const gz = G.level.gravAt(this.cx, this.cy);                                     // a hop in low gravity is a flight
    this.vy = Math.min(this.vy + GRAV * (gz ? gz.k : 1) * dt, MAXFALL * (gz ? 0.6 : 1));
    moveBody(this, dt, G.level);
    if (this.hitL || this.hitR) this.vx = 0;
  }
}

Object.assign(ENEMY_TYPES, { heap: BoneHeap, skullbat: SkullBat, censer: Censer, lensling: Lensling, orrery: Orrery, lunarhare: LunarHare });

<script>

FLYING.add('skullbat'); FLYING.add('orrery'); FLYING.add('censer');

const BONEC = '#e8dcc0';
// a long bone: a shaft with a knob at both ends; from (x0, y0) to (x1, y1)

  o = o || {}; const fl = o.flash, col = fl ? '#ffffff' : (o.col || BONEC), a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0);

// ---------------------------------------------------------------- the Heap
Art.enemy.heap = function (g, e, t) {

  };

<script>
'use strict';
// The four bosses of the Ossuary and the Lunar Observatory (see enemies_deep.js for their palettes and the ray):
// the Bonewright and the Marrow Tyrant below, the Stargazer and the Eclipse Regent above.

// ---------------------------------------------------------------- the Bonewright
// The mid-boss of the Ossuary: a tall sculptor of bone who builds what he fights with. He sweeps with a long arm,
// throws chisels, raises pillars of bone under your feet and, angered, assembles heaps that stand up to help him.
class Bonewright extends Boss {
  constructor(d) { super(d, 64, 118, { key: 'bonewright', hp: 200, geo: 190, phases: [0.5], blood: '#efe6d0' }); this.last = ''; this.slashing = 0; this.casting = false; this.lunging = false; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.7 : 0.45);
    const opts = ['sweep', 'chisels', 'pillars'];
    if (this.phase >= 2) opts.push('summon', 'leapSlam');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  *sweep() {                                     // a long arm swings low across the floor
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.62 * this.spd);
    this.tele = 0; Sound.play('slash'); this.slashing = 1;
    this.doMelee(18, 50, 170, 62, 1, 0.24);
    let t = 0.24; while (t > 0) { this.vx = this.face * 150; t -= this.dt; if (this.hitL || this.hitR) break; yield; }
    this.vx = 0; this.slashing = 0;
    yield* this.wait(0.65 * this.spd);
  }
  *chisels() {                                   // a fan of thrown chisels, then one aimed
    this.casting = true; this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.45 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const n = this.phase >= 2 ? 5 : 3, a = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx);
    for (let i = 0; i < n; i++) { const o = (i - (n - 1) / 2) * 0.22; G.projs.push(new Proj({ kind: 'shard', x: this.cx + this.face * 30, y: this.cy - 14, vx: Math.cos(a + o) * 400, vy: Math.sin(a + o) * 400, r: 7, dmg: 1, color: '#efe6d0', life: 2.4, rot: a + o, pal: BONEP })); }
    yield* this.wait(0.45);
    this.facePlayer(); Sound.play('shoot');
    G.projs.push(new Proj({ kind: 'shard', x: this.cx + this.face * 30, y: this.cy - 14, vx: this.face * 520, vy: 0, r: 8, dmg: 1, color: '#efe6d0', life: 2.4, rot: this.face > 0 ? 0 : Math.PI, pal: BONEP }));
    this.casting = false;
    yield* this.wait(0.6 * this.spd);
  }
  *pillars() {                                   // bone rises under where you stand, and either side of it
    const L = G.level; this.casting = true; this.tele = 1; Sound.play('roar');
    yield* this.wait(0.4);
    const n = this.phase >= 2 ? 4 : 3;
    for (let i = 0; i < n; i++) {
      const x = clamp(G.player.cx + (i === 0 ? 0 : (i % 2 ? 1 : -1) * (80 + 40 * Math.ceil(i / 2))), 3 * TILE, L.pw - 3 * TILE);
      spawnPillar(x, this.floorY, 0.75, 0.42, 230, BONEP);
      yield* this.wait(0.3);
    }
    yield* this.wait(0.9); this.tele = 0; this.casting = false;
  }
  *summon() {                                    // two heaps stand up from the floor
    const L = G.level; this.casting = true; this.tele = 1; Sound.play('roar');
    yield* this.wait(0.6);
    const alive = G.enemies.filter(e => e.kind === 'heap' && !e.dead).length;
    for (let i = alive; i < 2; i++) {
      const tx = clamp(Math.floor((i % 2 ? L.pw - 8 * TILE : 8 * TILE) / TILE), 4, L.w - 5), h = new BoneHeap({ x: tx, y: Math.floor(this.floorY / TILE) - 1 });
      h.kind = 'heap'; h.revived = true; h.setState('rising'); G.enemies.push(h);
      G.burst(h.cx, this.floorY - 10, 14, { color: '#efe6d0', speed: 200, life: 0.5, size: 3, vy: -80 });
    }
    yield* this.wait(0.9); this.tele = 0; this.casting = false;
  }
  *leapSlam() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.5 * this.spd);
    this.tele = 0; this.lunging = true;
    const T = 0.7; this.vy = -760; this.vx = clamp((G.player.cx - this.cx) / T, -440, 440); this.onGround = false;
    yield; yield; yield* this.until(() => this.onGround, 2);
    this.lunging = false; this.vx = 0; Sound.play('slam'); G.shake(9, 0.3);
    spawnShock(this.cx - 30, this.y + this.h, -1, 380, '#efe6d0'); spawnShock(this.cx + 30, this.y + this.h, 1, 380, '#efe6d0');
    for (let i = 0; i < 2; i++) spawnRock(clamp(G.player.cx + rand(-220, 220), 3 * TILE, G.level.pw - 3 * TILE), 0.7 + i * 0.12, BONEP);
    yield* this.wait(0.6 * this.spd);
  }
}

// ---------------------------------------------------------------- the Marrow Tyrant
// The last of the Ossuary: every bone of the dead gathered into one body with a crown of skulls and a glowing heart
// of marrow. It stamps, rains ribs, smashes with a fist, spits marrow that bursts, calls hands up from the floor
// and, wounded, rattles apart in rings of green light.
class Marrow extends Boss {
  constructor(d) { super(d, 128, 150, { key: 'marrow', hp: 380, geo: 450, phases: [0.66, 0.33], blood: '#efe6d0' }); this.last = ''; this.slashing = 0; this.casting = false; this.rattling = false; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.8 : this.phase === 2 ? 0.55 : 0.4);
    const opts = ['stomp', 'ribs', 'crush'];
    if (this.phase >= 2) opts.push('spit', 'hands');
    if (this.phase >= 3) opts.push('rattle');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  *stomp() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.8 * this.spd);
    this.tele = 0; Sound.play('slam'); G.shake(11, 0.4); this.slashing = 2;
    spawnShock(this.cx - 60, this.y + this.h, -1, 420, '#efe6d0'); spawnShock(this.cx + 60, this.y + this.h, 1, 420, '#efe6d0');
    this.doMelee(0, this.h - 60, 190, 60, 1, 0.2);
    if (this.phase >= 2) for (let i = 0; i < 3; i++) spawnRock(clamp(G.player.cx + rand(-240, 240), 3 * TILE, G.level.pw - 3 * TILE), 0.7 + i * 0.12, BONEP);
    yield* this.wait(0.3); this.slashing = 0;
    yield* this.wait(0.55 * this.spd);
  }
  *ribs() {                                      // a shower of ribs, from above the whole hall
    const L = G.level; this.casting = true; this.tele = 1; Sound.play('roar');
    const n = 5 + this.phase * 2;
    for (let i = 0; i < n; i++) { spawnRock(clamp(G.player.cx + rand(-300, 300), 3 * TILE, L.pw - 3 * TILE), 0.85, BONEP); yield* this.wait(0.2); }
    yield* this.wait(0.9); this.tele = 0; this.casting = false;
  }
  *crush() {                                     // the great fist, raised and brought down
    this.facePlayer(); this.tele = 1; Sound.play('tele'); this.slashing = 1;
    yield* this.wait(0.95 * this.spd);
    this.tele = 0; Sound.play('slam'); G.shake(10, 0.35); this.slashing = 2;
    this.doMelee(28, 10, 150, 130, 2, 0.28);
    spawnShock(this.cx + this.face * 120, this.y + this.h, this.face, 380, '#efe6d0');
    yield* this.wait(0.4); this.slashing = 0;
    yield* this.wait(0.7 * this.spd);
  }
  *spit() {                                      // three blobs of marrow, lobbed, that burst on landing
    this.facePlayer(); this.casting = true; this.tele = 1; Sound.play('tele');
    yield* this.wait(0.55 * this.spd);
    this.tele = 0;
    for (let i = 0; i < 3; i++) {
      this.facePlayer(); Sound.play('shoot');
      const sx = this.cx + this.face * 36, sy = this.y + 40, T = 0.95, g = 900, px = G.player.cx + rand(-60, 60);
      G.projs.push(new Proj({ kind: 'bomb', x: sx, y: sy, vx: (px - sx) / T, vy: (G.player.cy - sy - 0.5 * g * T * T) / T, grav: g, r: 11, dmg: 1, color: '#bfe8d0', life: 3, fuse: 1.6, blastR: 74 }));
      yield* this.wait(0.42);
    }
    this.casting = false;
    yield* this.wait(0.55 * this.spd);
  }
  *hands() {                                     // a wave of skeleton hands bursts from the floor toward you
    const L = G.level, dir = G.player.cx > this.cx ? 1 : -1; this.casting = true; this.tele = 1; Sound.play('roar');
    yield* this.wait(0.5);
    let x = this.cx + dir * 110;
    for (let i = 0; i < 9; i++) {
      if (x < 3 * TILE || x > L.pw - 3 * TILE) break;
      spawnPillar(x, this.floorY, 0.55, 0.36, 130, BONEP); x += dir * 76;
      yield* this.wait(0.13);
    }
    yield* this.wait(0.8); this.tele = 0; this.casting = false;
  }
  *rattle() {                                    // the body shakes apart, and rings of marrow-light leave the heart
    this.tele = 1; this.rattling = true; Sound.play('roar'); G.shake(8, 1.0);
    yield* this.wait(0.8);
    this.tele = 0; Sound.play('shoot');
    const rings = 3, n = 12;
    for (let r = 0; r < rings; r++) {
      const off = r * Math.PI / n + this.t;
      for (let i = 0; i < n; i++) { const a = off + i * Math.PI * 2 / n; G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.y + 62, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 9, dmg: 1, color: '#9fe8c0', life: 3.2, pal: WISPP })); }
      yield* this.wait(0.55);
    }
    this.rattling = false;
    yield* this.wait(0.7);
  }
}

// ---------------------------------------------------------------- the Stargazer
// The mid-boss of the Observatory: a robed astronomer who hangs in the air with a long brass telescope. He aims thin
// rays at you, calls down meteors, spins rings of stars and, angered, blinks across the hall and opens a field
// of weak gravity that lets you leap up to him.
class Stargazer extends Boss {
  constructor(d) { super(d, 56, 96, { key: 'stargazer', hp: 220, geo: 200, phases: [0.5], blood: '#dfe6ff' }); this.grav = false; this.last = ''; this.casting = false; this.aimA = 0; this.moonZone = null; }
  get hoverY() { return this.floorY - 4.2 * TILE; }
  *chooseAttack() {
    yield* this.wait(this.phase === 1 ? 0.55 : 0.38);
    const opts = ['rays', 'starfall', 'orbit'];
    if (this.phase >= 2) opts.push('blink', 'lowgrav');
    this.last = pick(opts.filter(o => o !== this.last));

  }
  scope() { return { x: this.cx + this.face * 34, y: this.cy - 8 }; }
  *aimRay(spread) {                              // lock the line, warn, fire
    this.facePlayer(); const s = this.scope(), a = Math.atan2(G.player.cy - s.y, G.player.cx - s.x); this.aimA = a; this.tele = 1; this.casting = true; Sound.play('tele');
    for (const o of spread) spawnRay(s.x, s.y, a + o, { tele: 0.7, dur: 0.26, rw: 16, pal: STARP });
    yield* this.hover(0.95 * this.spd);
    this.tele = 0;
  }
  *rays() {
    const L = G.level;
    yield* this.flyTo(clamp(G.player.cx + pick([-1, 1]) * rand(170, 300), 4 * TILE, L.pw - 4 * TILE), this.hoverY, 380);
    const rounds = this.phase >= 2 ? 3 : 2;
    for (let r = 0; r < rounds; r++) { yield* this.aimRay(this.phase >= 2 ? [-0.34, 0, 0.34] : [0]); yield* this.hover(0.3); }
    this.casting = false;
    yield* this.wait(0.3);
  }
  *starfall() {
    const L = G.level;
    yield* this.flyTo(L.pw / 2, this.hoverY - 40, 380);
    this.tele = 1; this.casting = true; Sound.play('roar');
    const n = this.phase >= 2 ? 9 : 6;
    for (let i = 0; i < n; i++) { spawnRock(clamp(G.player.cx + rand(-280, 280), 3 * TILE, L.pw - 3 * TILE), 0.85, STARP); yield* this.hover(0.2); }
    yield* this.hover(0.9); this.tele = 0; this.casting = false;
  }
  *orbit() {                                     // a spiral of stars from the lens
    yield* this.flyTo(clamp(G.level.pw / 2 + rand(-100, 100), 5 * TILE, G.level.pw - 5 * TILE), this.hoverY - 20, 360);
    this.tele = 1; this.casting = true; Sound.play('tele');
    yield* this.hover(0.55 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const n = this.phase >= 2 ? 24 : 16, arms = this.phase >= 2 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      for (let k = 0; k < arms; k++) { const a = i * 0.34 + k * Math.PI * 2 / arms; G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.cy, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, r: 9, dmg: 1, color: '#dfe6ff', life: 3.2, pal: STARP })); }
      yield* this.hover(0.1);
    }
    this.casting = false;
    yield* this.hover(0.5);
  }
  *blink() {                                     // out here, in there, and a ray from the new place
    const L = G.level; this.ghostly = true;
    for (let a = 1; a > 0; a -= 0.1) { this.alpha = a; yield; }
    this.alpha = 0; yield* this.wait(0.25);
    const side = G.player.cx > L.pw / 2 ? -1 : 1;
    this.x = (L.pw / 2 + side * rand(200, 360)) - this.w / 2; this.y = this.hoverY - this.h / 2;
    for (let a = 0; a < 1; a += 0.12) { this.alpha = a; yield; }
    this.alpha = 1; this.ghostly = false;
    yield* this.aimRay([-0.2, 0.2]);
    this.casting = false;
    yield* this.hover(0.3);
  }
  *lowgrav() {                                   // the room's gravity falls: leap, and strike him, while stars rain slowly
    const L = G.level; this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.flyTo(L.pw / 2, this.hoverY, 380);
    yield* this.hover(0.5);
    this.tele = 0; this.endField();
    this.moonZone = { x: 0, y: 0, w: L.pw, h: L.ph, k: 0.38 }; L.gravs.push(this.moonZone);
    let t = 6.5;
    while (t > 0) { spawnRock(clamp(G.player.cx + rand(-260, 260), 3 * TILE, L.pw - 3 * TILE), 1.0, STARP); const w = 0.55; yield* this.hover(w); t -= w; }
    this.endField(); this.casting = false;
    yield* this.hover(0.3);
  }
  endField() { if (this.moonZone) { const L = G.level; L.gravs = L.gravs.filter(z => z !== this.moonZone); this.moonZone = null; } }
  shiftRoutine() { this.endField(); return super.shiftRoutine(); }
  kill() { this.endField(); super.kill(); }
}

// ---------------------------------------------------------------- the Eclipse Regent
// The last of the Observatory: the one who hid the moon behind his own disc. Each attack is a phase of the moon:
// crescents that sweep the floor, the full moon's ring of orbs, the beams of the eclipse, the dark of the new moon
// (the hall goes black and only the rays show), the tide (gravity falls) and, last, the corona: a searchlight of rays.
class Regent extends Boss {
  constructor(d) { super(d, 100, 140, { key: 'regent', hp: 420, geo: 520, phases: [0.66, 0.33], blood: '#cfd8ff' }); this.grav = false; this.last = ''; this.casting = false; this.moonZone = null; }
  get hoverY() { return this.floorY - 4.6 * TILE; }
  *chooseAttack() {
    yield* this.wait(this.phase === 1 ? 0.6 : this.phase === 2 ? 0.42 : 0.3);
    const opts = ['crescents', 'fullmoon', 'beams'];
    if (this.phase >= 2) opts.push('newmoon', 'tide');
    if (this.phase >= 3) opts.push('totality');
    this.last = pick(opts.filter(o => o !== this.last));
    yield* this[this.last]();
  }
  crescent(dir, y, speed) {
    G.projs.push(new Proj({ kind: 'wave', x: this.cx + dir * 40, y, vx: dir * speed, vy: 0, r: 19, dmg: 1, color: '#dbe4ff', life: 3.2, pierce: true }));
  }
  *crescents() {                                 // alternating low and high: jump the first, stand under the second
    const L = G.level, side = this.cx < L.pw / 2 ? 1 : -1;
    yield* this.flyTo(side > 0 ? 4 * TILE : L.pw - 4 * TILE, this.hoverY, 400);
    this.face = side; this.tele = 1; this.casting = true; Sound.play('tele');
    yield* this.hover(0.55 * this.spd);
    this.tele = 0;
    const n = this.phase >= 3 ? 5 : this.phase >= 2 ? 4 : 3;
    for (let i = 0; i < n; i++) {
      Sound.play('slash'); this.crescent(side, i % 2 ? this.floorY - 112 : this.floorY - 18, 330 + this.phase * 20);
      yield* this.hover(0.62);
    }
    this.casting = false;
    yield* this.flyTo(L.pw / 2, this.hoverY, 380);
  }
  *fullmoon() {
    const L = G.level;
    yield* this.flyTo(clamp(L.pw / 2 + rand(-120, 120), 5 * TILE, L.pw - 5 * TILE), this.hoverY - 10, 360);
    this.tele = 1; this.casting = true; Sound.play('tele');
    yield* this.hover(0.6 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const rings = this.phase >= 2 ? 3 : 2, n = this.phase >= 3 ? 16 : 12;
    for (let r = 0; r < rings; r++) {
      const off = r * Math.PI / n + this.t * 0.5;
      for (let i = 0; i < n; i++) { const a = off + i * Math.PI * 2 / n; G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.cy, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, r: 10, dmg: 1, color: '#dfe6ff', life: 3.4, pal: STARP })); }
      yield* this.hover(0.6);
    }
    this.casting = false;
    yield* this.hover(0.4);
  }
  *beams() {                                     // columns of the eclipse, walking toward you
    const L = G.level; this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.flyTo(L.pw / 2, this.hoverY - 30, 380);
    const n = this.phase >= 2 ? 6 : 4;
    for (let i = 0; i < n; i++) { spawnBeam(clamp(G.player.cx + (i ? rand(-170, 170) : 0), 3 * TILE, L.pw - 3 * TILE), 0.95 - this.phase * 0.08, 0.3, 46, STARP); yield* this.hover(0.45); }
    yield* this.hover(0.8); this.tele = 0; this.casting = false;
  }
  *newmoon() {                                   // the hall goes dark; the rays still show
    const L = G.level; this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.flyTo(L.pw / 2, this.hoverY - 20, 380);
    G.eclipseT = 1;
    yield* this.hover(0.9);
    this.tele = 0;
    const rounds = this.phase >= 3 ? 5 : 4;
    for (let r = 0; r < rounds; r++) {
      const s = { x: this.cx, y: this.cy }, a = Math.atan2(G.player.cy - s.y, G.player.cx - s.x);
      for (const o of (r % 2 ? [-0.32, 0.32] : [0])) spawnRay(s.x, s.y, a + o, { tele: 0.8, dur: 0.26, rw: 18, pal: STARP });
      Sound.play('tele');
      yield* this.hover(1.05);
    }
    G.eclipseT = 0; this.casting = false;
    yield* this.hover(0.6);
  }
  *tide() {                                      // gravity falls, and the crescents come in pairs
    const L = G.level; this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.flyTo(L.pw / 2, this.hoverY, 380);
    yield* this.hover(0.5); this.tele = 0; this.endField();
    this.moonZone = { x: 0, y: 0, w: L.pw, h: L.ph, k: 0.36 }; L.gravs.push(this.moonZone);
    for (let i = 0; i < 5; i++) {
      const side = i % 2 ? 1 : -1; Sound.play('slash');
      this.crescent(side, this.floorY - 22 - (i % 3) * 52, 300);
      this.crescent(-side, this.floorY - 90 + (i % 2) * 40, 260);
      yield* this.hover(1.1);
    }
    this.endField(); this.casting = false;
    yield* this.hover(0.3);
  }
  *totality() {                                  // the corona: a searchlight of rays around the black disc
    const L = G.level; this.tele = 1; this.casting = true; Sound.play('roar');
    yield* this.flyTo(L.pw / 2, this.hoverY - 10, 380);
    yield* this.hover(0.6); this.tele = 0;
    const a0 = pick([2.95, 0.19]), a1 = 3.14 - a0, n = 13;
    for (let i = 0; i < n; i++) {
      spawnRay(this.cx, this.cy, lerp(a0, a1, i / (n - 1)), { tele: 0.6, dur: 0.24, rw: 18, pal: STARP }); Sound.play('tele');
      yield* this.hover(0.19);
    }
    yield* this.hover(1.0); this.casting = false;
  }
  endField() { if (this.moonZone) { const L = G.level; L.gravs = L.gravs.filter(z => z !== this.moonZone); this.moonZone = null; } }
  shiftRoutine() { this.endField(); G.eclipseT = 0; return super.shiftRoutine(); }
  kill() { this.endField(); G.eclipseT = 0; super.kill(); }
}

  const SLOTS = [
    ['player', 'البطل', 'Hero'],
    ['husk', 'الهيكل', 'Husk'], ['crawler', 'الزاحف', 'Crawler'], ['flyer', 'الطائر', 'Flyer'], ['hopper', 'القافز', 'Hopper'],
    ['warden', 'حارس الدرع', 'Shield Warden'], ['ram', 'النطّاح', 'Ram'], ['spitter', 'البصّاق', 'Spitter'], ['shard', 'برج البلّور', 'Crystal turret'], ['sentinel', 'الحارس', 'Sentinel'],
    ['diver', 'البعوضة', 'Diver'], ['spider', 'العنكبوت', 'Spider'], ['shroom', 'الفطر الماشي', 'Shroom'], ['jelly', 'قنديل البحر', 'Jelly'],
    ['boss_guardian', 'زعيم: الحارس الحجري', 'Boss: Stone Guardian'], ['boss_spore', 'زعيم: أم الفطر', 'Boss: Sporecap'],
    ['boss_weaver', 'زعيم: حائكة الأشواك', 'Boss: Thorn Weaver'], ['boss_drowned', 'زعيم: العملاق الغريق', 'Boss: Drowned Giant'],
    ['boss_wraith', 'زعيم: شبح البلّور', 'Boss: Crystal Wraith'], ['boss_brood', 'زعيم: أم الحضنة', 'Boss: Brood Mother'],
    ['boss_king', 'زعيم: الملك المجوّف', 'Boss: Hollow King'],
    ['mole', 'الخلد', 'Mole'], ['lavaworm', 'دودة الحمم', 'Lava Worm'], ['imp', 'عفريت القنابل', 'Bomb Imp'], ['veil', 'الحجاب', 'Veil'],
    ['roller', 'المدحرج', 'Roller'], ['slime', 'الهلام', 'Slime'], ['chainman', 'حامل السلسلة', 'Chain Bearer'], ['moth', 'فراشة الليل', 'Night Moth'], ['icicle', 'الجليدة', 'Icicle'],
    ['boss_queen', 'زعيم: ملكة الصقيع', 'Boss: Rime Queen'], ['boss_thunderhoof', 'زعيم: حافر الرعد', 'Boss: Thunderhoof'], ['boss_roc', 'زعيم: طائر العاصفة', 'Boss: Storm Roc'],
    ['boss_duelist', 'زعيم: مبارز الزجاج', 'Boss: Glass Duelist'], ['boss_twin', 'زعيم: توأم الجوّال', 'Boss: Wanderer\'s Twin'], ['boss_colossus', 'زعيم: العملاق الجمري', 'Boss: Cinder Colossus'],
    ['heap', 'الكومة', 'The Heap'], ['skullbat', 'خفّاش الجمجمة', 'Skull Bat'], ['censer', 'المبخرة', 'The Censer'], ['lensling', 'العدسة الزاحفة', 'Lensling'], ['orrery', 'الفلك المصغّر', 'The Orrery'], ['lunarhare', 'أرنب القمر', 'Lunar Hare'],
    ['boss_bonewright', 'زعيم: نحّات العظام', 'Boss: Bonewright'], ['boss_marrow', 'زعيم: طاغية النخاع', 'Boss: Marrow Tyrant'], ['boss_stargazer', 'زعيم: الراصد', 'Boss: Stargazer'], ['boss_regent', 'زعيم: وصيّ الكسوف', 'Boss: Eclipse Regent'],
  ];
  const imgs = {};          // slot -> HTMLImageElement
  let data = {};            // slot -> data URL
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  for (const k in data) { const im = new Image(); im.src = data[k]; imgs[k] = im; }
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
  };
  const ar = () => LANG.cur === 'ar';
  const T = (a, e) => (ar() ? a : e);

  // ---------------------------------------------------------------- drawing hooks
  function get(slot) { const im = imgs[slot]; return im && im.complete && im.naturalWidth ? im : null; }
  // fits the picture to a body box (a little larger, feet on the box bottom), facing and hit flash
  function draw(g, im, box, face, flash, scale) {
    const k = scale || 1.35, bw = box.w * k, bh = box.h * k;
    const s = Math.min(bw / im.naturalWidth, bh / im.naturalHeight) * 1.0, w = im.naturalWidth * s, h = im.naturalHeight * s;
    const cx = box.x + box.w / 2, by = box.y + box.h + 2;
    g.save(); g.translate(cx, by); if (face < 0) g.scale(-1, 1);
    if (flash > 0) g.filter = 'brightness(2.6)';
    g.drawImage(im, -w / 2, -h, w, h);
    g.restore();
  }

  // ---------------------------------------------------------------- the panel
  let root = null, sheet = null, sel = null, cur = 'player', drag = null, view = null;
  function css() {
    if (document.getElementById('skin-css')) return;
    const st = document.createElement('style'); st.id = 'skin-css';
    st.textContent = `
#skins{position:fixed;inset:0;z-index:50;background:rgba(4,6,12,.94);color:#e6eefa;font:500 14px/1.5 "Cairo",sans-serif;display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow:auto;touch-action:auto;user-select:none}
#skins h2{margin:0;font-size:20px}#skins p{margin:0;opacity:.75;font-size:13px}
#skins .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#skins button,#skins label.btn{background:#1b2436;color:#e6eefa;border:1px solid #3b4a66;border-radius:8px;padding:6px 12px;font:600 13px "Cairo",sans-serif;cursor:pointer}
#skins button.on{background:#36cfc2;color:#05070d;border-color:#36cfc2}
#skins .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
#skins .slot{display:flex;align-items:center;gap:6px;background:#111827;border:1px solid #2a3550;border-radius:8px;padding:4px 6px;cursor:pointer}
#skins .slot.on{border-color:#36cfc2;box-shadow:0 0 0 1px #36cfc2 inset}
#skins .slot img,#skins .slot i{width:34px;height:34px;object-fit:contain;flex:none;background:#05070d;border-radius:6px}
#skins .slot span{flex:1;min-width:0;font-size:12px}
#skins .slot b{font-size:11px;color:#ff9a8a;padding:0 4px}
#skins canvas{max-width:100%;background:repeating-conic-gradient(#1a2030 0 25%,#121722 0 50%) 0 0/20px 20px;border-radius:6px;cursor:crosshair;touch-action:none}
#skins input[type=file]{display:none}`;
    document.head.appendChild(st);
  }
  function open(onClose) {
    css();
    root = document.createElement('div'); root.id = 'skins'; root.dir = ar() ? 'rtl' : 'ltr';
    root.innerHTML = `<div class="row" style="justify-content:space-between"><h2>${T('صورك الخاصة', 'Your images')}</h2><button data-x="close">${T('رجوع إلى اللعبة', 'Back to the game')}</button></div>
<p>${T('حمّل صورة من جهازك (صورة واحدة أو لوحة فيها صور كثيرة)، اختر الشخصية، ثم اسحب مربعاً فوق الجزء الذي تريده. الصور تبقى في متصفحك على جهازك فقط ولا تُرفع إلى أي مكان.', 'Load a picture from your device (one sprite or a whole sheet), pick a character, then drag a box over the part you want. Pictures stay in this browser on your device and are never uploaded.')}</p>
<div class="row"><label class="btn">${T('تحميل صورة…', 'Load a picture…')}<input type="file" accept="image/*"></label><button data-x="whole">${T('استعمل الصورة كاملة', 'Use the whole picture')}</button><button data-x="clear">${T('حذف كل الصور', 'Remove all')}</button></div>
<div class="slots"></div><canvas width="10" height="10"></canvas>`;
    document.body.appendChild(root);
    const q = s => root.querySelector(s);
    q('[data-x=close]').onclick = () => { close(); if (onClose) onClose(); };
    q('[data-x=clear]').onclick = () => { for (const k of Object.keys(data)) remove(k); renderSlots(); };
    q('[data-x=whole]').onclick = () => { if (sheet) assign(cur, 0, 0, sheet.naturalWidth, sheet.naturalHeight); };
    q('input[type=file]').onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { sheet = im; sel = null; paint(); }; im.src = r.result; };
      r.readAsDataURL(f);
    };
    const cv = q('canvas');
    const pos = ev => { const b = cv.getBoundingClientRect(); return { x: (ev.clientX - b.left) * cv.width / b.width, y: (ev.clientY - b.top) * cv.height / b.height }; };
    cv.addEventListener('pointerdown', ev => { if (!sheet) return; cv.setPointerCapture(ev.pointerId); drag = pos(ev); sel = { x: drag.x, y: drag.y, w: 0, h: 0 }; paint(); });
    cv.addEventListener('pointermove', ev => { if (!drag) return; const p = pos(ev); sel = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) }; paint(); });
    cv.addEventListener('pointerup', () => {
      if (!drag) return; drag = null;
      if (sel && sel.w > 4 && sel.h > 4) assign(cur, sel.x / view.s, sel.y / view.s, sel.w / view.s, sel.h / view.s);
    });
    // the game must not steal keys while the panel is open
    root.addEventListener('keydown', e => e.stopPropagation());
    renderSlots(); paint();
  }
  function close() { if (root) root.remove(); root = null; }
  function renderSlots() {
    if (!root) return;
    const box = root.querySelector('.slots'); box.innerHTML = '';
    for (const [k, a, e] of SLOTS) {
      const d = document.createElement('div'); d.className = 'slot' + (k === cur ? ' on' : '');
      d.innerHTML = (data[k] ? `<img src="${data[k]}" alt="">` : '<i></i>') + `<span>${T(a, e)}</span>` + (data[k] ? '<b title="x">✕</b>' : '');
      d.onclick = ev => { if (ev.target.tagName === 'B') { remove(k); } else cur = k; renderSlots(); };
      box.appendChild(d);
    }
  }
  function paint() {
    if (!root) return;
    const cv = root.querySelector('canvas'), g = cv.getContext('2d');
    if (!sheet) { cv.width = 600; cv.height = 120; g.fillStyle = '#9db5d6'; g.font = '16px Cairo, sans-serif'; g.textAlign = 'center'; g.fillText(T('حمّل صورة لتبدأ', 'Load a picture to begin'), 300, 64); return; }
    const s = Math.min(1, 1100 / sheet.naturalWidth);
    view = { s }; cv.width = Math.round(sheet.naturalWidth * s); cv.height = Math.round(sheet.naturalHeight * s);
    g.drawImage(sheet, 0, 0, cv.width, cv.height);
    if (sel) { g.strokeStyle = '#36cfc2'; g.lineWidth = 2; g.setLineDash([6, 4]); g.strokeRect(sel.x, sel.y, sel.w, sel.h); g.fillStyle = 'rgba(54,207,194,0.15)'; g.fillRect(sel.x, sel.y, sel.w, sel.h); }
  }
  // crops the chosen box (downscaled to at most MAX px) and stores it for the slot
  function assign(slot, x, y, w, h) {
    const k = Math.min(1, MAX / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext('2d').drawImage(sheet, x, y, w, h, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/png');
    data[slot] = url; const im = new Image(); im.src = url; imgs[slot] = im;
    if (!save()) G.toastMsg(T('لا توجد مساحة كافية في المتصفح لحفظ الصورة.', 'Not enough browser storage to keep this picture.'), 3);
    renderSlots();
  }
  function remove(slot) { delete data[slot]; delete imgs[slot]; save(); }
  return { get, draw, open, close, isOpen: () => !!root };
})();

<script>
'use strict';
// Charms: small relics the Wanderer wears on the cloak. Each one costs notches. The notches grow
// with the seals of the guardians and with the merchant. Wearing more than the notches allow
// "overcharms" the Wanderer: every wound then costs double. Charms can be changed only while
// resting on a bench. The effects themselves are read by the Player and the Geo pickups through
// Charms.has(id); this file holds the list, the notch rules and the save data.
const Charms = (() => {
  const BASE_NOTCHES = 3;
  const DEFS = {
    reach:      { cost: 1, color: '#cfe6ff', ar: 'نصل طويل', en: 'Long Edge', dAr: 'ضربتك تمتد أبعد بثلث.', dEn: 'Your strike reaches a third further.' },
    swift:      { cost: 2, color: '#bfe8ff', ar: 'ضربة الريح', en: 'Gale Strike', dAr: 'تضرب أسرع بكثير.', dEn: 'You strike much faster.' },
    siphon:     { cost: 2, color: '#a9d4ff', ar: 'ماصّة الروح', en: 'Soul Siphon', dAr: 'كل ضربة تملأ روحاً أكثر.', dEn: 'Every strike gathers more soul.' },
    focus:      { cost: 3, color: '#ffe9a0', ar: 'تركيز سريع', en: 'Swift Focus', dAr: 'تشفي جراحك أسرع.', dEn: 'You heal much faster.' },
    deep:       { cost: 4, color: '#ffd070', ar: 'تركيز عميق', en: 'Deep Focus', dAr: 'الشفاء أبطأ لكنه يشفي قناعين دفعة واحدة.', dEn: 'Healing is slower but mends two masks at once.' },
    thorn:      { cost: 1, color: '#b6ef6a', ar: 'عباءة الشوك', en: 'Thorn Mantle', dAr: 'عندما تُصاب تنفجر الأشواك وتؤذي من حولك.', dEn: 'When you are hurt, thorns burst out and wound those around you.' },
    boots:      { cost: 1, color: '#9dff9a', ar: 'حذاء الريح', en: 'Wind Boots', dAr: 'تجري أسرع.', dEn: 'You run faster.' },
    dashmaster: { cost: 2, color: '#ff9c5a', ar: 'سيّد الاندفاع', en: 'Dash Master', dAr: 'تندفع من جديد بعد وقت أقصر.', dEn: 'You can dash again much sooner.' },
    mage:       { cost: 3, color: '#c8a8ff', ar: 'حجر الساحر', en: 'Mage Stone', dAr: 'تعاويذك تؤذي أكثر بنسبة أربعين بالمئة.', dEn: 'Your spells hurt forty percent more.' },
    spirit:     { cost: 1, color: '#ff9bd6', ar: 'صدى الألم', en: 'Pain Echo', dAr: 'جروحك تملأ روحك.', dEn: 'Your wounds gather soul.' },
    magnet:     { cost: 1, color: '#ffe9a0', ar: 'مغناطيس الجيو', en: 'Geo Magnet', dAr: 'ينجذب الجيو إليك من بعيد.', dEn: 'Geo drifts toward you from afar.' },
    thrift:     { cost: 2, color: '#8fe0ff', ar: 'اقتصاد الروح', en: 'Soul Thrift', dAr: 'التعاويذ والشفاء يكلّفون روحاً أقل.', dEn: 'Spells and healing cost less soul.' },
    fury:       { cost: 2, color: '#ff6a5a', ar: 'غضب الأخير', en: 'Last Fury', dAr: 'حين يبقى لك قناع واحد تصير ضربتك أقوى بكثير.', dEn: 'With a single mask left, your strike hits far harder.' },
    soles:      { cost: 1, color: '#bfe8ff', ar: 'نعل المسامير', en: 'Spiked Soles', dAr: 'تثبت قدماك على الجليد فلا تنزلق.', dEn: 'Your feet grip the ice: no more sliding.' },
    wick:       { cost: 1, color: '#ffd890', ar: 'فتيل الفانوس', en: 'Lantern Wick', dAr: 'يتسع ضوء فانوسك فترى أبعد في العتمة.', dEn: 'Your lantern burns wider: you see further in the dark.' },
    cinder:     { cost: 2, color: '#ff8a4a', ar: 'نصل الجمر', en: 'Cinder Edge', dAr: 'ضرباتك تترك حرقاً يؤذي العدو بعد لحظة.', dEn: 'Your strikes leave a burn that wounds the enemy a moment later.' },
    gale:       { cost: 2, color: '#a8c0ff', ar: 'عباءة العاصفة', en: 'Storm Cloak', dAr: 'قفزتك الثانية أعلى بنحو الربع، وتدفعك الرياح الجانبية أقل.', dEn: 'Your second jump rises about a quarter higher, and crosswinds shove you less.' },
    echo:       { cost: 2, color: '#d8c8ff', ar: 'صدى النصل', en: 'Blade Echo', dAr: 'كل ضربة ثالثة تُطلق موجة شبحية أمامك.', dEn: 'Every third strike sends a spectral wave ahead of you.' },
    grave:      { cost: 2, color: '#bfe8d0', ar: 'همس القبور', en: 'Grave Whisper', dAr: 'كل عدو تقتله يترك روحاً تملأ روحك.', dEn: 'Every foe you slay leaves a spirit that fills your soul.' },
    moonstep:   { cost: 1, color: '#cfd8ff', ar: 'خطوة القمر', en: 'Moonstep', dAr: 'تسقط ببطء أكبر، كأن القمر يسندك من تحت.', dEn: 'You fall more slowly, as if the moon held you up from below.' },
    shell:      { cost: 2, color: '#d8c8a0', ar: 'درع الصدفة', en: 'Shell Ward', dAr: 'بعد الراحة على المقعد تصدّ أول إصابة.', dEn: 'After resting on a bench, it turns aside the first wound.' },
  };
  const ORDER = Object.keys(DEFS);

  let owned = {}, worn = [], shell = false;

  const name = id => DEFS[id][LANG.cur === 'ar' ? 'ar' : 'en'];
  const desc = id => DEFS[id][LANG.cur === 'ar' ? 'dAr' : 'dEn'];
  const has = id => worn.indexOf(id) >= 0;
  const used = () => worn.reduce((s, id) => s + DEFS[id].cost, 0);
  // three to begin with, one more for every two guardians' seals, and up to two from the merchant
  const notches = () => BASE_NOTCHES + Math.floor(sealCount() / 2) + (G.flags.buy_notch1 ? 1 : 0) + (G.flags.buy_notch2 ? 1 : 0);
  const over = () => used() > notches();
  const ownedList = () => ORDER.filter(id => owned[id]);

  function give(id) {
    if (!DEFS[id] || owned[id]) return false;
    owned[id] = true; return true;
  }
  // Wear or remove a charm. Returns 'on', 'over' (worn, but now overcharmed), 'off', 'full' (already
  // overcharmed, so nothing more fits) or 'none' (not owned).
  function toggle(id) {
    if (!owned[id]) return 'none';
    const i = worn.indexOf(id);
    if (i >= 0) { worn.splice(i, 1); return 'off'; }
    if (used() > notches()) return 'full';
    worn.push(id);
    return used() > notches() ? 'over' : 'on';
  }

  // Shell Ward: armed by resting, spent by the next wound.
  function rest() { shell = has('shell'); }
  function absorb() {
    if (!shell || !has('shell')) return false;
    shell = false; return true;
  }

  function reset() { owned = {}; worn = []; shell = false; }
  function save() { return { o: ORDER.filter(id => owned[id]), w: worn.slice() }; }
  function load(d) {
    reset();
    if (!d) return;
    for (const id of d.o || []) if (DEFS[id]) owned[id] = true;
    for (const id of d.w || []) if (owned[id] && worn.indexOf(id) < 0) worn.push(id);
  }

  return { DEFS, ORDER, name, desc, has, used, notches, over, ownedList, give, toggle, rest, absorb, reset, save, load, shellUp: () => shell && has('shell') };
})();

</script>
<script>
'use strict';
// Equipment: the blade in the hand, the cloak on the shoulders, and the nail arts the Wanderer has
// learned. Weapons and cloaks are bought from the smith, the outfitter and the travelling traders
// (see SHOPS in game.js); the arts are taught by the smith. The Player reads the numbers through
// Gear.* (entities.js) and the art in art_gear.js draws what is equipped. Everything is saved.
const Gear = (() => {
  // dmg: multiplies the nail's damage; reach: multiplies the strike's length; cd: seconds between
  // strikes; h: height of the strike box; kb: knockback dealt; soul: extra soul per hit
  const WEAPONS = {

    if (!TABLE[kind][id] || own[KEY[kind]][id]) return false;
    own[KEY[kind]][id] = true; return true;

  const equip = (kind, id) => {
    if (kind === 'art' || !owns(kind, id)) return false;

  function reset() { own = { w: { nail: true }, c: { drifter: true }, a: {} }; cur = { w: 'nail', c: 'drifter' }; }

    for (const id of d.a || []) if (ARTS[id]) own.a[id] = true;
    if (own.w[d.cw]) cur.w = d.cw;
    if (own.c[d.cc]) cur.c = d.cc;

    WEAPONS, CLOAKS, ARTS, NOVA_COST, REND_CHARGE, RUSH_TIME, ORDER: { weapon: Object.keys(WEAPONS), cloak: Object.keys(CLOAKS), art: Object.keys(ARTS) },

    weapon: () => cur.w, cloak: () => cur.c, w: wep, c: clk,

      if (kind !== 'cloak') return '';
      const out = [];
      if (d.speed) out.push((ar ? 'الجري ' : 'Run ') + x(d.speed));
      if (d.dashK) out.push((ar ? 'الاندفاع ' : 'Dash wait ') + x(d.dashK));
      if (d.hurtK) out.push((ar ? 'التحصين ' : 'Grace ') + x(d.hurtK));
      if (d.kbK) out.push((ar ? 'الارتداد ' : 'Recoil ') + x(d.kbK));
      if (d.soul) out.push((ar ? 'الروح ' : 'Soul ') + x(d.soul));
      if (d.focus) out.push((ar ? 'الشفاء ' : 'Heal time ') + x(d.focus));
      if (d.dmg) out.push((ar ? 'الضرر ' : 'Damage ') + x(d.dmg));
      return out.join('   ');
    },
    // ---- numbers read by the Player ----
    dmgK: () => wep().dmg * k(clk(), 'dmg'),
    reachK: () => wep().reach,
    atkCD: () => wep().cd,
    boxH: () => wep().h,
    kbK: () => wep().kb,
    soulBonus: () => wep().soul,
    speedK: () => k(clk(), 'speed'),
    hurtK: () => k(clk(), 'hurtK'),
    takenKbK: () => k(clk(), 'kbK'),
    dashK: () => k(clk(), 'dashK'),
    soulK: () => k(clk(), 'soul'),
    focusK: () => k(clk(), 'focus'),
    iceGrip: () => !!clk().ice,
    dashHit: () => !!clk().dashHit,
    frost: () => !!clk().frost,
    bleeds: () => cur.w === 'bonesaw',
  };
})();
