<style>
/* Layout: one 16:9 stage centred on a near-black page; touch pads appear only on coarse pointers. */
:root{
  color-scheme:dark;
  --ink:#05070d;        /* page ground */
  --stage:#000;         /* canvas letterbox */
  --pad:rgba(214,228,248,.14);
  --pad-on:rgba(214,228,248,.42);
  --pad-line:rgba(214,228,248,.5);
  --text:#e6eefa;
  --reserve:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);overflow:hidden;font-family:"Cairo","Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding-inline:8px}
#wrap{position:relative;line-height:0}
canvas{display:block;background:var(--stage);border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.6);
  width:min(100vw - 16px,(100dvh - 16px - var(--reserve))*16/9);aspect-ratio:16/9;height:auto;outline:none}
#touch{display:none;width:100%;max-width:760px;justify-content:space-between;align-items:flex-end;direction:ltr;padding-bottom:4px}
.cluster{display:grid;gap:8px;align-items:center;justify-items:center}
.dpad{grid-template-columns:repeat(3,auto);grid-template-areas:". up ." "left down right"}
.face{grid-template-columns:repeat(3,auto);grid-template-areas:". cast superdash" "dash attack jump"}
.b{width:58px;height:58px;border-radius:50%;background:var(--pad);border:2px solid var(--pad-line);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 18px/1 "Cairo",sans-serif;backdrop-filter:blur(2px)}
.b small{font:600 10px/1 "Cairo",sans-serif;opacity:.75;margin-top:2px}
.b.on{background:var(--pad-on);transform:scale(.94)}
.b.big{width:66px;height:66px}
[data-act=up]{grid-area:up}[data-act=down]{grid-area:down}[data-act=left]{grid-area:left}[data-act=right]{grid-area:right}
[data-act=jump]{grid-area:jump}[data-act=attack]{grid-area:attack}[data-act=dash]{grid-area:dash}[data-act=cast]{grid-area:cast}[data-act=superdash]{grid-area:superdash}
.b[hidden]{display:none}
.sys{display:flex;gap:10px;align-self:flex-start}
.sys .b{width:40px;height:40px;font-size:13px}
@media (pointer:coarse){#touch{display:flex}:root{--reserve:170px}}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:0px}
  #app{padding:0;gap:0}
  #touch{position:fixed;inset:0;max-width:none;padding:0 calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none}
  #touch .b{pointer-events:auto}
  #touch .sys{position:absolute;top:8px;right:calc(14px + env(safe-area-inset-right))}
  .b{width:52px;height:52px}.b.big{width:60px;height:60px}
}
@media (pointer:coarse) and (orientation:portrait){
  :root{--reserve:250px}
  #touch{flex-wrap:wrap;row-gap:12px;padding-inline:4px}
  #touch .sys{order:-1;width:100%;justify-content:flex-end}
  .cluster{gap:7px}
  .b{width:46px;height:46px}.b.big{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){.b{backdrop-filter:none}}
</style>

'use strict';
// Shared constants and small helpers.
const TILE = 32, VW = 960, VH = 540;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const sign = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// deterministic pseudo random (for tile art and background shapes)
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function rgba(h, a) {
  const c = hexToRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
// Unity's Mathf.SmoothDamp: critically damped spring toward target. Returns [value, velocity].
function smoothDamp(cur, target, vel, smoothTime, dt) {
  smoothTime = Math.max(0.0001, smoothTime);
  const omega = 2 / smoothTime, x = omega * dt;
  const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const change = cur - target;
  const temp = (vel + omega * change) * dt;
  let nv = (vel - omega * temp) * exp;
  let out = target + (change + temp) * exp;
  if ((target - cur > 0) === (out > target)) { out = target; nv = 0; }
  return [out, nv];
}

<script>
'use strict';
// Keyboard, touch buttons and gamepad, merged into one set of named actions.
// pressed() is an edge that stays true until a simulation step consumes it.
const Input = (() => {
  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'jump', Space: 'jump', KeyK: 'jump',
    KeyX: 'attack', KeyJ: 'attack',
    KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyF: 'cast', KeyV: 'cast', KeyI: 'cast',
    KeyQ: 'superdash', KeyE: 'superdash', KeyU: 'superdash',
    Tab: 'map', KeyM: 'map',
    Escape: 'pause', KeyP: 'pause',
    Enter: 'confirm', KeyN: 'mute',
  };
  const held = {}, touch = {}, pad = {}, padPrev = {}, q = {}, rel = {};
  const heldCount = {};

  function setHeld(src, act, on) {
    const was = isHeld(act);
    src[act] = on;
    const now = isHeld(act);
    if (now && !was) q[act] = true;
    if (!now && was) rel[act] = true;
  }
  function isHeld(a) { return !!(held[a] || touch[a] || pad[a]); }

  window.addEventListener('keydown', e => {
    const a = KEYS[e.code];
    if (!a) return;
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    heldCount[e.code] = true;
    setHeld(held, a, true);
    // Z and Space also confirm menus
    if (a === 'jump') q.confirm = true;
  });
  window.addEventListener('keyup', e => {
    const a = KEYS[e.code];
    if (!a) return;
    heldCount[e.code] = false;
    // another key bound to the same action may still be down
    const still = Object.keys(KEYS).some(c => KEYS[c] === a && heldCount[c]);
    if (!still) setHeld(held, a, false);
  });
  window.addEventListener('blur', () => {
    for (const k in held) held[k] = false;
    for (const k in touch) touch[k] = false;
    for (const k in heldCount) heldCount[k] = false;
  });

  // on-screen buttons: each pointer remembers which button it pressed
  function bindTouch() {
    const buttons = document.querySelectorAll('[data-act]');
    const owner = new Map();
    buttons.forEach(b => {
      const act = b.dataset.act;
      const down = e => {
        e.preventDefault();
        owner.set(e.pointerId, b);
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        b.classList.add('on');
        setHeld(touch, act, true);
        if (act === 'jump') q.confirm = true;
      };
      const up = e => {
        if (owner.get(e.pointerId) !== b) return;
        owner.delete(e.pointerId);
        b.classList.remove('on');
        setHeld(touch, act, false);
      };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      b.addEventListener('contextmenu', e => e.preventDefault());
    });
  }

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const g = pads && Array.from(pads).find(p => p && p.connected);
    const now = {};
    if (g) {
      const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      now.left = ax < -0.4 || b(14); now.right = ax > 0.4 || b(15);
      now.up = ay < -0.5 || b(12); now.down = ay > 0.5 || b(13);
      now.jump = b(0); now.attack = b(2) || b(1); now.dash = b(5) || b(7); now.superdash = b(4);
      now.cast = b(3) || b(6); now.map = b(8); now.pause = b(9); now.confirm = b(0);
    }
    for (const a of ['left', 'right', 'up', 'down', 'jump', 'attack', 'dash', 'superdash', 'cast', 'map', 'pause', 'confirm']) {
      const was = !!padPrev[a], on = !!now[a];
      if (a !== 'confirm') setHeld(pad, a, on);
      else if (on && !was) q.confirm = true;
      padPrev[a] = on;
    }
  }

  return {
    init() { bindTouch(); },
    poll: pollPad,
    down: a => isHeld(a),
    pressed: a => !!q[a],
    released: a => !!rel[a],
    consume: a => { q[a] = false; },
    endStep() { for (const k in q) q[k] = false; for (const k in rel) rel[k] = false; },
    axisX: () => (isHeld('right') ? 1 : 0) - (isHeld('left') ? 1 : 0),
    axisY: () => (isHeld('down') ? 1 : 0) - (isHeld('up') ? 1 : 0),
  };
})();

</script>
<script>
'use strict';
// Sound effects are synthesised on the fly. The score is recorded: one looping MP3 per area plus
// two boss themes (audio/music, rendered by tools/music from the original compositions), streamed
// through Web Audio so the loops are sample-exact. If those files cannot be fetched (for instance
// when index.html is opened straight from disk) the score falls back to a plain <audio> element,
// and failing that to the old procedural ambience, so the game always has music.
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, fileBus = null, delay = null;
  let muted = false, theme = 'title', bossMode = false, bossTrack = 'boss', timer = null, step = 0;
  try { muted = localStorage.getItem('duskwell_mute') === '1'; } catch (e) { /* ignore */ }

  const ROOT = { ending: 73.4, bone: 65.4, lunar: 82.4, storm: 87.3, mirror: 69.3, frost: 98.0, ember: 58.3, foundry: 77.8, title: 73.4, town: 110, cave: 73.4, moss: 87.3, crystal: 82.4, throne: 65.4, spore: 92.5, aqueduct: 69.3, webbed: 61.7 };
  const SCALE = [0, 3, 5, 7, 10, 12, 15, 17];
  const TRACK = { ending: 'ending', title: 'overture', town: 'hushvale', cave: 'crossroads', moss: 'moss', crystal: 'crystal', throne: 'throne', spore: 'spore', aqueduct: 'aqueduct', webbed: 'webbed', foundry: 'foundry', frost: 'frost', ember: 'ember', storm: 'storm', mirror: 'mirror', bone: 'ossuary', lunar: 'lunar' };
  // which battle theme each boss fights to (a boss key, or true for the last one); anything else gets the common one
  const BOSS_TRACKS = { king: 'king', bonewright: 'boss_bone', marrow: 'boss_bone', stargazer: 'boss_moon', regent: 'boss_moon' };
  const bossTrackOf = which => (which === true ? 'king' : (typeof which === 'string' && BOSS_TRACKS[which]) || 'boss');
  const MUSIC_DIR = 'audio/music/', SFX_DIR = 'audio/sfx/';
  const AMB_THEME = { town: 'forest', moss: 'forest' };           // area -> ambience loop (audio/sfx/amb_*.mp3)
  const MUSIC_VOL = 0.8;
  const MASTER_VOL = 0.55;

  function init() {
    if (ctx) { if (ctx.state === 'suspended' && !document.hidden) ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : MASTER_VOL; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    fileBus = ctx.createGain(); fileBus.gain.value = MUSIC_VOL; fileBus.connect(master);
    // soft echo for the procedural fallback score
    delay = ctx.createDelay(1.5); delay.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.42;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(musicBus);
    // no music while the tab or the Android app is in the background
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) { ctx.suspend(); if (Score.el) Score.el.pause(); }
      else { ctx.resume(); if (Score.el && !muted) Score.el.play().catch(() => {}); }
    });
    Score.start();
    Rec.start();
  }

  // ------------------------------------------------------------------ recorded score
  const Score = {
    mode: 'pending',      // 'buffer' (Web Audio), 'element' (<audio>), 'synth' (procedural)
    meta: null,           // music.json: { name: { loop: seconds, gain } }
    cache: new Map(),     // decoded AudioBuffers, most recently used last
    loading: new Map(),   // name -> Promise<AudioBuffer>
    want: null, cur: null, el: null, fadeTimer: null,
    start() {
      const viaFile = location.protocol === 'file:';
      const metaReq = viaFile ? Promise.reject(new Error('file')) : fetch(MUSIC_DIR + 'music.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      metaReq.then(m => { this.meta = m; this.mode = 'buffer'; this.update(); })
        .catch(() => { this.mode = 'element'; this.update(); });
    },
    desired() { return bossMode ? bossTrack : (TRACK[theme] || 'crossroads'); },
    update() {
      if (!ctx || this.mode === 'pending') return;
      if (this.mode === 'synth') { if (!timer) startMusic(); return; }
      const name = this.desired();
      if (name === this.want) return;
      this.want = name;
      if (this.mode === 'buffer') {
        this.load(name).then(buf => { if (this.want === name) this.playBuffer(name, buf); })
          .catch(() => { if (this.want === name) { this.mode = 'element'; this.want = null; this.update(); } });
      } else this.playElement(name);
    },
    load(name) {
      if (this.cache.has(name)) { const b = this.cache.get(name); this.cache.delete(name); this.cache.set(name, b); return Promise.resolve(b); }
      if (this.loading.has(name)) return this.loading.get(name);
      const p = fetch(MUSIC_DIR + name + '.mp3')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(data => new Promise((ok, fail) => { const q = ctx.decodeAudioData(data, ok, fail); if (q && q.catch) q.catch(fail); }))
        .then(buf => {
          this.loading.delete(name);
          this.cache.set(name, buf);
          // a decoded minute of stereo audio is ~20 MB, so keep only the newest two pieces
          while (this.cache.size > 2) this.cache.delete(this.cache.keys().next().value);
          return buf;
        }, err => { this.loading.delete(name); throw err; });
      this.loading.set(name, p);
      return p;
    },
    prefetch(name) { if (ctx && this.mode === 'buffer' && name !== this.want) this.load(name).catch(() => {}); },
    fadeOut(cur, sec) {
      if (!cur) return;
      const t = ctx.currentTime;
      cur.gain.gain.cancelScheduledValues(t);
      cur.gain.gain.setValueAtTime(cur.gain.gain.value, t);
      cur.gain.gain.linearRampToValueAtTime(0, t + sec);
      try { cur.src.stop(t + sec + 0.05); } catch (e) { /* already stopped */ }
    },
    playBuffer(name, buf) {
      const info = (this.meta && this.meta[name]) || { loop: buf.duration, gain: 1 };
      // Decoders that keep the MP3 encoder delay give ~1105 extra samples up front.
      const lead = buf.duration - info.loop > 0.02 ? 1105 / 44100 : 0;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = lead; src.loopEnd = Math.min(buf.duration, lead + info.loop);
      const gain = ctx.createGain();
      src.connect(gain); gain.connect(fileBus);
      const fade = bossMode ? 0.35 : 1.8;
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(info.gain, t + fade);
      src.start(t, lead);
      this.fadeOut(this.cur, bossMode ? 0.5 : 2.2);
      this.cur = { name, src, gain };
    },
    playElement(name) {
      const old = this.el;
      const el = new Audio(MUSIC_DIR + name + '.mp3');
      el.loop = true; el.volume = 0; el.muted = muted;
      el.addEventListener('error', () => { if (this.el === el) { this.el = null; this.mode = 'synth'; this.update(); } });
      this.el = el;
      el.play().catch(() => {});
      const target = MUSIC_VOL * MASTER_VOL * ((this.meta && this.meta[name] && this.meta[name].gain) || 0.8);
      const t0 = performance.now(), ms = bossMode ? 400 : 1800;
      clearInterval(this.fadeTimer);
      this.fadeTimer = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        el.volume = target * k;
        if (old) old.volume = Math.max(0, old.volume * (1 - k));
        if (k >= 1) { clearInterval(this.fadeTimer); if (old) old.pause(); }
      }, 50);
    },
  };

  // ------------------------------------------------------------------ recorded effects and ambience
  // CC0 recordings (see CREDITS.md) that replace or sit under the synthesised effects. They need
  // fetch(), so from file:// the game keeps its synthesised sounds.
  const Rec = {
    meta: null, bufs: new Map(), last: {}, amb: null, ambWant: null, ambBus: null,
    start() {
      if (location.protocol === 'file:') return;
      this.ambBus = ctx.createGain(); this.ambBus.gain.value = 0.5; this.ambBus.connect(master);
      fetch(SFX_DIR + 'sfx.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(m => {
        this.meta = m;
        const names = new Set();
        for (const e of Object.values(m.events)) e.files.forEach(f => names.add(f));
        Promise.all([...names].map(n => this.decode(n))).then(() => this.ambience());
      }).catch(() => { this.meta = null; });
    },
    decode(name) {
      return fetch(SFX_DIR + name + '.mp3').then(r => r.arrayBuffer())
        .then(d => new Promise((ok, fail) => { const q = ctx.decodeAudioData(d, ok, fail); if (q && q.catch) q.catch(fail); }))
        .then(b => { this.bufs.set(name, b); return b; }, () => null);
    },
    // returns 'replace', 'layer' or false (nothing recorded for this event)
    play(name) {
      const e = this.meta && this.meta.events[name];
      if (!e || !ctx || muted) return false;
      const picks = e.files.filter(f => this.bufs.has(f));
      if (!picks.length) return false;
      const now = ctx.currentTime;
      if (now - (this.last[name] || 0) < 0.04) return e.layer ? 'layer' : 'replace';        // no machine-gun stacking
      this.last[name] = now;
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = this.bufs.get(pick(picks));
      src.playbackRate.value = e.rate[0] + Math.random() * (e.rate[1] - e.rate[0]);
      g.gain.value = e.gain;
      src.connect(g); g.connect(sfxBus); src.start();
      return e.layer ? 'layer' : 'replace';
    },
    ambience() {
      if (!this.meta || !ctx) return;
      const name = AMB_THEME[theme] || null;
      if (name === this.ambWant) return;
      this.ambWant = name;
      const t = ctx.currentTime;
      if (this.amb) {
        const old = this.amb; this.amb = null;
        old.gain.gain.cancelScheduledValues(t); old.gain.gain.setValueAtTime(old.gain.gain.value, t); old.gain.gain.linearRampToValueAtTime(0, t + 2.5);
        try { old.src.stop(t + 2.6); } catch (e) { /* stopped */ }
      }
      const a = name && this.meta.ambience[name]; if (!a) return;
      const load = this.bufs.has(a.file) ? Promise.resolve(this.bufs.get(a.file)) : this.decode(a.file);
      load.then(buf => {
        if (!buf || this.ambWant !== name) return;
        const src = ctx.createBufferSource(), g = ctx.createGain();
        src.buffer = buf; src.loop = true; src.connect(g); g.connect(this.ambBus);
        const now = ctx.currentTime;
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(a.gain, now + 3);
        src.start(); this.amb = { src, gain: g };
      });
    },
  };

  function tone(o) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + o.d);
    const v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.a || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    osc.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t0); osc.stop(t0 + o.d + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ctx || muted) return;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ctx.currentTime + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1000, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.d);
    f.Q.value = o.q || 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.v == null ? 0.2 : o.v, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0, Math.random()); src.stop(t0 + o.d + 0.05);
  }

  const FX = {
    jump() { tone({ f: 300, f2: 560, d: 0.13, v: 0.12 }); },
    djump() { tone({ f: 420, f2: 900, d: 0.16, v: 0.13, type: 'triangle' }); noise({ f: 3000, f2: 800, d: 0.12, v: 0.06, type: 'highpass' }); },

  function note(semi, dur, vol, oct) {
    const root = ROOT[theme] || 110;
    tone({ f: root * Math.pow(2, (semi + (oct || 0) * 12) / 12), d: dur, v: vol, a: 0.03, bus: musicBus, type: 'sine' });
    tone({ f: root * Math.pow(2, (semi + (oct || 0) * 12) / 12), d: dur, v: vol * 0.5, a: 0.03, bus: delay, type: 'sine' });
  }
  function startMusic() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
      if (!ctx || muted || ctx.state !== 'running' || Score.mode !== 'synth') return;
      step++;
      if (bossMode) {
        // pulse and tense line
        note(0, 0.25, 0.22, 0);
        if (step % 2 === 0) note(SCALE[(step >> 1) % 5], 0.2, 0.09, 2);
        if (step % 8 === 0) note(7, 1.2, 0.1, 1);
        return;
      }
      if (step % 10 === 1) {
        // slow pad chord
        [0, 7, 12].forEach((s, i) => tone({ f: (ROOT[theme] || 110) * Math.pow(2, s / 12), d: 6, v: 0.12, a: 2, bus: musicBus, type: 'triangle', delay: i * 0.05 }));
      }
      if (step % 3 === 0 && Math.random() < 0.7) note(SCALE[randi(0, SCALE.length - 1)], 1.8, 0.09, 1);
    }, bossMode ? 260 : 820);
  }

  return {
    init,
    play(name) { try { const r = Rec.play(name); if (r !== 'replace' && FX[name]) FX[name](); } catch (e) { /* audio must never crash the game */ } },
    // area theme: 'title', 'town', 'cave', 'moss', ... (see TRACK)
    setTheme(t) { if (t !== theme) { theme = t; Score.update(); Rec.ambience(); } },
    // boss music on/off; the final boss has a theme of its own
    boss(on, which) {
      const track = bossTrackOf(which);
      if (bossMode === on && (!on || bossTrack === track)) return;
      bossMode = on; if (on) bossTrack = track;
      if (ctx && Score.mode === 'synth') startMusic();
      Score.update();
    },
    prefetch(which) { Score.prefetch(bossTrackOf(which)); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('duskwell_mute', muted ? '1' : '0'); } catch (e) { /* ignore */ }
      if (master) master.gain.value = muted ? 0 : MASTER_VOL;
      if (Score.el) Score.el.muted = muted;
      return !muted;
    },
    isOn: () => !muted,
    sfxState: () => ({ loaded: !!Rec.meta, buffers: Rec.bufs.size, ambience: Rec.ambWant, ambiencePlaying: !!Rec.amb }),
    musicState: () => ({ mode: Score.mode, want: Score.want, playing: Score.cur ? Score.cur.name : (Score.el ? Score.el.src : null), cached: [...Score.cache.keys()] }),
  };
})();

<script>
'use strict';
// World data: rooms are built from tile rectangles. All coordinates are in tiles, y grows downward.
// Entities are placed by the tile their feet stand in (flyers by their centre tile).
const T_AIR = 0, T_SOLID = 1, T_ONEWAY = 2, T_HAZARD = 3, T_BREAK = 4, T_GATE = 5, T_BOUNCE = 6, T_CRACK = 7, T_ACID = 8, T_CRUMBLE = 9;
// bosses whose seals open the throne gate
const SEAL_FLAGS = ['boss_guardian', 'boss_spore', 'boss_weaver', 'boss_drowned', 'boss_wraith', 'boss_brood'];

class RoomBuilder {
  constructor(id, w, h, opt) {
    this.id = id; this.w = w; this.h = h;
    this.area = opt.area; this.theme = opt.theme; this.map = opt.map;
    this.t = new Uint8Array(w * h);
    this.doors = []; this.enemies = []; this.items = []; this.npcs = []; this.benches = []; this.deco = []; this.stations = []; this.iceCells = new Set();
    this.signs = []; this.winds = []; this.gravs = []; this.arena = null; this.start = null; this.sealGate = null; this.mech = []; this.leverGates = [];
    this.solid(0, 0, w, 1); this.solid(0, h - 1, w, 1); this.solid(0, 0, 1, h); this.solid(w - 1, 0, 1, h);
  }
  fill(x, y, w, h, v) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (i >= 0 && j >= 0 && i < this.w && j < this.h) this.t[j * this.w + i] = v;
    }
    return this;
  }
  solid(x, y, w, h) { return this.fill(x, y, w, h, T_SOLID); }
  air(x, y, w, h) { return this.fill(x, y, w, h, T_AIR); }
  plat(x, y, w) { return this.fill(x, y, w, 1, T_ONEWAY); }
  hazard(x, y, w, h) { return this.fill(x, y, w, h || 1, T_HAZARD); }
  breakable(x, y, w, h) { return this.fill(x, y, w, h, T_BREAK); }
  bounce(x, y, w) { return this.fill(x, y, w, 1, T_BOUNCE); }          // mushroom cap: launches the player
  crack(x, y, w, h) { return this.fill(x, y, w, h || 1, T_CRACK); }    // only a dive breaks it
  acid(x, y, w, h) { return this.fill(x, y, w, h || 1, T_ACID); }
  ice(x, y, w, h) { h = h || 1; this.fill(x, y, w, h, T_SOLID); for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) this.iceCells.add(j * this.w + i); return this; }     // slippery rock
  lava(x, y, w, h) { return this.fill(x, y, w, h || 1, T_ACID); }                                                                                      // looks like lava in Cinderdeep
  crumble(x, y, w) { return this.fill(x, y, w, 1, T_CRUMBLE); }          // gives way soon after it is stood on
  // machinery (see mechanics.js): coordinates in tiles; saws are placed by their centre
  mover(x, y, w, tx, ty, o) { this.mech.push(Object.assign({ type: 'mover', x, y, w, to: { x: tx, y: ty } }, o || {})); return this; }
  saw(x, y, o) { this.mech.push(Object.assign({ type: 'saw', x, y }, o || {})); return this; }
  drip(x, y, o) { this.mech.push(Object.assign({ type: 'drip', x, y }, o || {})); return this; }
  lever(id, x, y, gates) { this.mech.push({ type: 'lever', id, x, y, gates }); this.leverGates.push(...gates); return this; }
  door(id, x, y, w, h, to, toDoor) { this.doors.push({ id, x, y, w, h, to, toDoor }); return this; }
  enemy(type, x, y, o) { this.enemies.push(Object.assign({ type, x, y }, o || {})); return this; }
  item(id, x, y, kind, o) { this.items.push(Object.assign({ id, x, y, kind }, o || {})); return this; }
  npc(type, x, y, shop) { this.npcs.push({ type, x, y, shop }); return this; }
  bench(x, y) { this.benches.push({ x, y }); return this; }
  // wind zone (tiles): wy < 0 is an updraft (the hero rises at that speed in px/s), wy > 0 a downdraft, wx pushes sideways in the air
  // a low-gravity field (the Observatory): k is the share of normal gravity inside
  grav(x, y, w, h, o) { this.gravs.push(Object.assign({ x, y, w, h, k: 0.4 }, o || {})); return this; }
  wind(x, y, w, h, o) { this.winds.push(Object.assign({ x, y, w, h, wx: 0, wy: 0 }, o || {})); return this; }
  station(x, y) { this.stations.push({ x, y }); return this; }          // lantern station: fast travel between lit stations
  sign(x, y, text) { this.signs.push({ x, y, text }); return this; }
  decor(type, x, y, o) { this.deco.push(Object.assign({ type, x, y }, o || {})); return this; }
  // Draws the whole room from text, one character per tile (rows are y = 0..h-1, x = 0..w-1):
  //   # solid   = one-way plate   ^ spikes   ~ acid or lava   b breakable wall   c cracked floor
  //   m bounce cap   i ice (solid and slippery)   space = air
  // Other characters come from the legend and mark what stands in that tile:
  //   ['enemy', type, opts]  ['item', id, kind, opts]  ['bench']  ['station']  ['sign', text]  ['npc', type]
  //   ['light', opts]  and ['door', id, to, toDoor]: all cells of one door letter form its rectangle.
  ascii(rows, legend) {
    legend = legend || {};
    if (rows.length !== this.h) throw new Error(this.id + ': ' + rows.length + ' rows, expected ' + this.h);
    const doors = {};
    rows.forEach((row, y) => {
      if (row.length !== this.w) throw new Error(this.id + ' row ' + y + ': ' + row.length + ' columns, expected ' + this.w);
      for (let x = 0; x < this.w; x++) {
        const ch = row[x], i = y * this.w + x;
        const tile = { '#': T_SOLID, '=': T_ONEWAY, '^': T_HAZARD, '~': T_ACID, b: T_BREAK, c: T_CRACK, m: T_BOUNCE, i: T_SOLID }[ch];
        this.t[i] = tile === undefined ? T_AIR : tile;
        if (ch === 'i') this.iceCells.add(i);
        if (tile !== undefined || ch === ' ') continue;
        const e = legend[ch];
        if (!e) throw new Error(this.id + ' (' + x + ',' + y + '): "' + ch + '" is not in the legend');
        if (e[0] === 'door') { (doors[ch] = doors[ch] || { e, x0: x, y0: y, x1: x, y1: y }); const d = doors[ch]; d.x0 = Math.min(d.x0, x); d.y0 = Math.min(d.y0, y); d.x1 = Math.max(d.x1, x); d.y1 = Math.max(d.y1, y); }
        else if (e[0] === 'enemy') this.enemy(e[1], x, y, e[2]);
        else if (e[0] === 'item') this.item(e[1], x, y, e[2], e[3]);
        else if (e[0] === 'bench') this.bench(x, y);
        else if (e[0] === 'station') this.station(x, y);
        else if (e[0] === 'sign') this.sign(x, y, e[1]);
        else if (e[0] === 'npc') this.npc(e[1], x, y, e[2]);
        else if (e[0] === 'light') this.decor('light', x, y, e[1]);
        else throw new Error(this.id + ': unknown legend kind ' + e[0]);
      }
    });
    for (const k of Object.keys(doors)) { const d = doors[k]; this.door(d.e[1], d.x0, d.y0, d.x1 - d.x0 + 1, d.y1 - d.y0 + 1, d.e[2], d.e[3]); }
    return this;
  }
  at(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? T_SOLID : this.t[y * this.w + x]; }
  finish() {
    // doors are cut last so they always open the frame
    for (const d of this.doors) this.air(d.x, d.y, d.w, d.h);
    // lever gates may stand in a doorway, so they go in after the doors are cut
    for (const gt of this.leverGates) this.fill(gt.x, gt.y, gt.w, gt.h, T_GATE);
    return this;
  }
}

// ---------- tile layer (rendered once per room and scale) ----------

Art.drawWinds = function (g, L, t, cx, cy) {
  for (const w of L.winds) {
    if (w.x > cx + VW || w.x + w.w < cx || w.y > cy + VH || w.y + w.h < cy) continue;

    g.lineCap = 'round'; g.lineWidth = 2;
    for (let i = 0; i < n; i++) {
      const h1 = hash2(i, 7, w.x | 0), h2 = hash2(i, 11, w.y | 0), len = 22 + h1 * 34;
      g.strokeStyle = 'rgba(214,230,255,' + (0.22 + 0.3 * h2) + ')';

      if (w.wy) {
        const span = w.h + len, d = (h2 * span - Math.sign(w.wy) * t * Math.abs(w.wy) * 0.8) % span, y = w.y + (d < 0 ? d + span : d), x = w.x + 6 + h1 * (w.w - 12);
        g.moveTo(x, y); g.lineTo(x, y + (w.wy < 0 ? len : -len));

        g.moveTo(x, y); g.lineTo(x - Math.sign(w.wx) * len, y);
      }
      g.stroke();
    }
    g.restore();
  }
};

// low-gravity fields: a faint silver haze, slow motes that rise and twinkle, and a shimmering rim

  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {

function themeDetail(g, th, L, x, y, px, py, v, eT, eB, isS) {

    } else if (n === 'town') {

      for (let i = 0; i < 3; i++) {
        const lx = px + 4 + i * 10 + hash2(x, y, i + 3) * 6;
        g.fillStyle = th.leaf[Math.floor(hash2(x, y, i + 8) * th.leaf.length)];
        ellipse(g, lx, py + 1, 5, 2.4, hash2(x, y, i) * 2 - 1); g.fill();

    } else if (n === 'spore') {

// ---------- dark foreground framing (drawn over the world) ----------
Art.drawForeground = function (g, theme, camX, camY, t) {
  const th = THEMES[theme];
  if (!th.fg) {
    const rnd = mulberry32(theme.length * 31 + 7);
    th.fg = [];
    for (let i = 0; i < 18; i++) th.fg.push({ x: i / 18 * 2600 + rnd() * 90, top: i % 2 === 0, s: 0.6 + rnd() * 0.9, r: rnd() });
  }
  const col = mix(th.edge, th.near, 0.35);
  g.save(); g.fillStyle = col; g.strokeStyle = col;
  for (const o of th.fg) {
    const x = ((o.x - camX * depthFactor(FORE_Z)) % 2600 + 2600) % 2600 - 200;
    if (x < -220 || x > VW + 220) continue;
    const sway = Math.sin(t * 0.8 + o.r * 6) * 4, s = o.s;
    const y0 = o.top ? -camY * 0.02 - 6 : VH + 6 - camY * 0.02 * 0;
    const dir = o.top ? 1 : -1;
    if (theme === 'moss' || theme === 'town') {
      for (let k = 0; k < 4; k++) {       // broad leaves
        const a = (k - 1.5) * 0.5 + sway * 0.02, len = (60 + k * 16) * s;
        g.save(); g.translate(x + k * 16 * s, y0); g.rotate(dir > 0 ? Math.PI / 2 + a : -Math.PI / 2 + a);
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * 0.5, -len * 0.28, len, 0); g.quadraticCurveTo(len * 0.5, len * 0.28, 0, 0); g.fill();
        g.restore();
      }

    } else if (theme === 'spore') {
      const cw = 60 * s, sy = o.top ? 30 * s : VH - 50 * s;
      if (o.top) { g.fillRect(x - 6, -4, 12, 40 * s); } else { g.fillRect(x - 8, sy, 16, 70 * s); }
      g.beginPath(); g.moveTo(x - cw, sy + 10); g.quadraticCurveTo(x - cw, sy - cw * 0.6, x, sy - cw * 0.62); g.quadraticCurveTo(x + cw, sy - cw * 0.6, x + cw, sy + 10); g.closePath(); g.fill();
    } else if (theme === 'webbed') {
      g.lineWidth = 2; g.strokeStyle = col;
      const r = 120 * s, cy0 = o.top ? -4 : VH + 4, d = o.top ? 1 : -1;
      for (let k = 0; k < 6; k++) { const a = (k / 5) * Math.PI; g.beginPath(); g.moveTo(x, cy0); g.lineTo(x + Math.cos(a) * r, cy0 + d * Math.sin(a) * r); g.stroke(); }
      for (let rr = 24; rr < r; rr += 26) { g.beginPath(); g.arc(x, cy0, rr, o.top ? 0 : Math.PI, o.top ? Math.PI : Math.PI * 2); g.stroke(); }
    } else if (theme === 'crystal') {
      for (let k = 0; k < 3; k++) { const w = (18 + k * 6) * s, h = (50 + k * 30) * s * (k === 1 ? 1.4 : 1), kx = x + k * 20 * s; g.beginPath(); g.moveTo(kx - w / 2, y0); g.lineTo(kx, y0 + dir * h); g.lineTo(kx + w / 2, y0); g.fill(); }
    } else if (theme === 'foundry') {
      if (o.top) {                         // a crane hook on a chain
        g.lineWidth = 4; const len = 70 * s;
        for (let k = 0; k < len; k += 13) { g.beginPath(); g.ellipse(x + sway * k / len, k, 4, 7, 0, 0, 7); g.stroke(); }
        g.lineWidth = 7; g.beginPath(); g.arc(x + sway, len + 14, 12, -Math.PI * 0.5, Math.PI * 0.9); g.stroke();
      } else {                              // a heap of scrap cogs
        for (let k = 0; k < 3; k++) {
          const r = (34 + k * 12) * s, cx2 = x + (k - 1) * 46 * s, cy2 = VH + 10 - k * 6 * s;
          g.beginPath(); for (let q = 0; q < 12; q++) { const a = q / 12 * Math.PI * 2 + k; g.lineTo(cx2 + Math.cos(a) * r, cy2 + Math.sin(a) * r); g.lineTo(cx2 + Math.cos(a + 0.26) * (r + 9), cy2 + Math.sin(a + 0.26) * (r + 9)); } g.closePath(); g.fill();
        }

    } else if (theme === 'throne') {
      if (o.top) { g.lineWidth = 4; g.beginPath(); g.moveTo(x, -4); g.lineTo(x + sway, 60 * s); g.stroke(); for (let k = 0; k < 60 * s; k += 14) { g.beginPath(); g.ellipse(x + sway * k / 60, k, 5, 8, 0, 0, 7); g.stroke(); } }

    } else {
      const w = (40 + o.r * 50) * s, h = (40 + o.r * 70) * s;

// ---------- ambient particles (screen space) ----------
Art.motes = [];

Art.drawAmbient = function (g, dt, theme, camX, camY, t) {
  const th = THEMES[theme];

    const fall = rain ? 420 : leafy ? 34 : snow ? 30 : theme === 'throne' ? 12 : 0, rise = bubble ? 26 : (theme === 'foundry' || theme === 'ember') ? 30 : (theme === 'crystal' || theme === 'cave' || theme === 'spore') ? 10 : 4;

// ---------- decorations ----------

    g.strokeStyle = INK; g.lineWidth = 6; g.beginPath(); g.moveTo(px + 16, py); g.lineTo(px + 16, py - 94); g.quadraticCurveTo(px + 16, py - 112, px + 28, py - 112); g.stroke();
    g.strokeStyle = '#4a2a1a'; g.lineWidth = 2.5; g.stroke();

    g.beginPath(); g.arc(x0 + w / 2, py - 30, 11, Math.PI, 0); g.rect(x0 + w / 2 - 11, py - 30, 22, 30); fs(g, '#0d0504', INK, 3);

    g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(px - 8, py - 28); g.lineTo(px - 8, py - 80); g.lineTo(px + w + 8, py - 80); g.lineTo(px + w + 8, py - 28); g.stroke();
    g.strokeStyle = '#6a3a20'; g.lineWidth = 2; g.stroke();
    const gr = g.createLinearGradient(0, py, 0, py + 140); gr.addColorStop(0, 'rgba(140,200,255,0.25)'); gr.addColorStop(1, 'rgba(140,200,255,0)');

Art.drawBreak = function (g, x, y, th, t) {

Art.drawAcid = function (g, x, y, surface, t, th) {
  const px = x * TILE, py = y * TILE;
  if (th && th.name === 'ember') {              // lava
    const g1 = g.createLinearGradient(0, py, 0, py + TILE); g1.addColorStop(0, 'rgba(255,200,90,0.95)'); g1.addColorStop(0.35, 'rgba(255,110,30,0.92)'); g1.addColorStop(1, 'rgba(170,30,10,0.95)');

Art.drawSeals = function (g, d, t, lit) {

// ---------- lighting (a darkness map with lights cut out of it) and drifting fog ----------
let lightCanvas = null;
const DARKNESS = { bone: 0.58, lunar: 0.4, storm: 0.42, mirror: 0.62, frost: 0.3, ember: 0.52, foundry: 0.48, town: 0.22, cave: 0.55, moss: 0.42, crystal: 0.45, throne: 0.58, spore: 0.45, aqueduct: 0.5, webbed: 0.72 };
Art.drawLighting = function (g, k, theme, lights) {
  const w = Math.max(64, Math.ceil(VW * k * 0.5)), h = Math.max(36, Math.ceil(VH * k * 0.5));
  if (!lightCanvas || lightCanvas.width !== w || lightCanvas.height !== h) { lightCanvas = document.createElement('canvas'); lightCanvas.width = w; lightCanvas.height = h; }
  const c = lightCanvas.getContext('2d');
  c.setTransform(w / VW, 0, 0, h / VH, 0, 0);
  c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, VW, VH);
  const dk = DARKNESS[theme] == null ? 0.45 : DARKNESS[theme];
  c.fillStyle = 'rgba(2,3,8,' + dk + ')'; c.fillRect(0, 0, VW, VH);
  c.globalCompositeOperation = 'destination-out';
  for (const L of lights) {
    if (L.x < -L.r || L.y < -L.r || L.x > VW + L.r || L.y > VH + L.r) continue;
    const gr = c.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    gr.addColorStop(0, 'rgba(0,0,0,' + L.a + ')'); gr.addColorStop(0.45, 'rgba(0,0,0,' + (L.a * 0.62) + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');

  }
  g.drawImage(lightCanvas, 0, 0, VW, VH);

  const o = g.globalCompositeOperation; g.globalCompositeOperation = 'lighter';
  for (const L of lights) {
    if (!L.c || L.x < -L.r || L.y < -L.r || L.x > VW + L.r || L.y > VH + L.r) continue;
    glow(g, L.x, L.y, L.r * 0.7, L.c, 0.07 * L.a);

  g.globalCompositeOperation = o;
};
Art.drawFog = function (g, theme, camX, camY, t) {

    const x = ((i * 390 - camX * par + t * (8 + i * 3)) % span + span) % span - 350;

<script>
'use strict';
// Lumen: the WebGL lighting pass. The game still draws with the 2D canvas, but into two layers:
//   scene  everything that does not move much (painted sky, tiles, props, items), opaque
//   ents   enemies, bosses and the hero, with transparency
// Lumen then lights them in one fragment shader, per pixel:
//   * rock gets a normal map baked once per room from its tiles (a rounded relief that catches light),
//   * every creature gets normals from the soft shape of its own silhouette (alpha blurred into a dome),
//   * point lights give diffuse, a glint and, for creatures, a cool rim light,
//   * the strongest lights cast shadows: the terrain really blocks them (a short ray march through the
//     tile mask), so a lantern behind a pillar leaves the far side dark,
//   * then bloom, light shafts, a chromatic kick when the hero is hurt and heat haze in the foundry.
// If WebGL2 is missing or fails, usable() is false and the old 2D lighting is used instead.
const Lumen = (() => {

  let slow = 0, frames = 0;

in vec2 aPos; out vec2 vUv;
void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  const FRAG_HEIGHT = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uDir; uniform int uMode;
in vec2 vUv; out vec4 o;
float src(vec2 uv) { vec4 c = texture(uTex, uv); return uMode == 0 ? smoothstep(0.55, 0.95, c.a) : c.r; }
void main() {
  float s = 0.0, ws = 0.0;

precision highp float;
uniform sampler2D uScene, uEnt, uHeight, uNorm;
uniform vec2 uLog, uCam, uRoom, uTexel;
uniform int uNL, uNS;
uniform vec4 uL[${MAXL}];
uniform vec3 uLC[${MAXL}];
uniform float uDark, uSpec, uShadow, uTime, uCaustic;
uniform vec3 uTint;
in vec2 vUv; out vec4 o;

vec4 normAt(vec2 wp) {
  vec2 n = wp / uRoom;
  if (n.x < 0.0 || n.y < 0.0 || n.x > 1.0 || n.y > 1.0) return vec4(0.5, 0.5, 1.0, 0.0);
  return texture(uNorm, n);
}
float solidAt(vec2 wp) { return smoothstep(0.78, 0.95, normAt(wp).a); }

// how much of the light reaches p: a short march through the tile mask
float lightReach(vec2 p, vec2 lp) {
  float occ = 0.0;
  float jit = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));     // dither: no visible banding
  for (int s = 1; s <= 12; s++) {

    vec2 q = mix(p, lp, t);
    if (distance(q, lp) < 26.0) continue;

// nStr: how much the normal matters (0 = flat, as the old darkness map); shadowed: terrain blocks the light
vec3 shade(vec3 albedo, vec3 N, vec2 p, float nStr, float specK, bool shadowed) {

  }

    float hl = texture(uHeight, vUv - vec2(e.x, 0.0)).r, hr = texture(uHeight, vUv + vec2(e.x, 0.0)).r;
    float hu = texture(uHeight, vUv + vec2(0.0, e.y)).r, hd = texture(uHeight, vUv - vec2(0.0, e.y)).r;
    vec3 Ne = normalize(vec3((hl - hr) * 5.5, (hu - hd) * 5.5, 1.0));       // screen y points down; v points up

    float lum = dot(en.rgb, vec3(0.3, 0.59, 0.11));
    vec3 lit = shade(en.rgb, Ne, p, 0.8, 0.55 * smoothstep(0.35, 0.9, lum) + 0.08, true);
    float rim = pow(1.0 - Ne.z, 2.2);
    lit += rim * (uTint * 0.9 + 0.12) * 0.55 * en.rgb + rim * uTint * 0.18;

    lit = max(lit, en.rgb * 0.16);
    col = mix(col, lit, en.a);
  }
  o = vec4(col, 1.0);
}`;

  const FRAG_BRIGHT = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform float uThr;
in vec2 vUv; out vec4 o;
void main() { vec3 c = texture(uTex, vUv).rgb; vec3 b = max(c - uThr, 0.0) * 1.7; o = vec4(b, 1.0); }`;

  const FRAG_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uTex; uniform vec2 uDir;
in vec2 vUv; out vec4 o;
void main() {
  vec3 s = vec3(0.0); float ws = 0.0;
  for (int i = -8; i <= 8; i++) { float w = exp(-float(i * i) / 24.0); s += w * texture(uTex, vUv + uDir * float(i)).rgb; ws += w; }
  o = vec4(s / ws, 1.0);
}`;

precision highp float;
uniform sampler2D uLit, uBloom;
uniform vec2 uLog;
uniform float uBloomK, uAberr, uHaze, uTime;
uniform vec4 uShaft;
in vec2 vUv; out vec4 o;
void main() {
  vec2 uv = vUv;
  if (uHaze > 0.0) { uv.x += sin(uv.y * 46.0 + uTime * 3.2) * 0.0011 * uHaze * smoothstep(0.1, 0.9, 1.0 - uv.y); uv.y += cos(uv.x * 28.0 + uTime * 1.6) * 0.0006 * uHaze; }

  if (uAberr > 0.0) { vec2 dir = (uv - 0.5) * uAberr; c = vec3(texture(uLit, uv + dir).r, texture(uLit, uv).g, texture(uLit, uv - dir).b); }

    vec2 sp = vec2(uShaft.x / uLog.x, 1.0 - uShaft.y / uLog.y); vec3 acc = vec3(0.0);
    for (int i = 0; i < 20; i++) acc += texture(uBloom, mix(uv, sp, float(i) / 20.0 * 0.7)).rgb;
    bl += acc / 20.0 * uShaft.w;
  }
  c += bl * uBloomK;
  c = mix(c, 0.85 + (c - 0.85) / (1.0 + (c - 0.85) * 2.2), step(0.85, c));       // soft shoulder instead of a hard clip

  function compile(type, src) {

<script>
'use strict';
// The pixel-art hero (blue or dark version) and the husk, drawn through the lit sprite engine in
// pixel.js. HeroStyle remembers which look the player picked (pause menu: "Hero look").
const HeroStyle = (() => {
  const LIST = ['blue', 'dark', 'vector'];
  let i = 0;
  try { const v = localStorage.getItem('duskwell_hero_style'); if (LIST.includes(v)) i = LIST.indexOf(v); } catch (e) { /* ignore */ }
  return {
    cur: () => LIST[i],
    // the sheet in use: the artist's own, with the cloak's two blues swapped for the equipped cloak's colours
    sheet() {
      const base = 'hero_' + LIST[i], id = typeof Gear !== 'undefined' ? Gear.cloak() : 'drifter';
      if (id === 'drifter' || LIST[i] === 'vector') return base;
      const c = parseInt(Gear.def('cloak', id).color.slice(1), 16), at = (k, kk) => { const f = v => Math.min(255, Math.round(v * kk)); return (f((c >> 16) & 255) << 16) | (f((c >> 8) & 255) << 8) | f(c & 255); };
      const swaps = LIST[i] === 'blue' ? { 0x3d5da4: at(0, 1.1), 0x192c3e: at(0, 0.45) } : { 0x1d2036: at(0, 0.7), 0x18182f: at(0, 0.4) };
      return Pixel.variant(base, id, swaps) || base;
    },
    pixel: () => LIST[i] !== 'vector' && Pixel.ready('hero_' + LIST[i]),
    next() { i = (i + 1) % LIST.length; try { localStorage.setItem('duskwell_hero_style', LIST[i]); } catch (e) { /* ignore */ } },
    label() { return { blue: ['بكسل أزرق', 'Pixel blue'], dark: ['بكسل داكن', 'Pixel dark'], vector: ['مرسوم بالتفصيل', 'Detailed ink'] }[LIST[i]][LANG.cur === 'ar' ? 0 : 1]; },
  };
})();

const SLASH_IMG = new Image(); SLASH_IMG.src = SLASH_SRC;

// which animation and pose the hero is in this frame
function heroPose(p, t) {
  const m = Pixel.meta(HeroStyle.sheet()), A = m.anims;
  const o = { anim: 'idle', frame: 0, sx: 1, sy: 1, rot: 0, flash: 0, dy: 0 };
  const sdGo = !!(p.sd && p.sd.state === 'go'), charge = p.sd && p.sd.state === 'charge' ? clamp(p.sd.t / SD_CHARGE, 0, 1) : 0;
  const pick = (a, k) => A[a][Math.min(A[a].length - 1, k)];
  if (p.atkT > 0) {
    const pr = 1 - clamp(p.atkT / 0.16, 0, 1);
    o.anim = 'attack'; o.frame = pick('attack', Math.floor(pr * A.attack.length));
  } else if (sdGo) { o.anim = 'run'; o.frame = A.run[1 % A.run.length]; o.sx = 1.35; o.sy = 0.82; o.rot = 0.12; }
  else if (charge > 0) { o.frame = A.idle[0]; o.sy = 1 - 0.14 * charge; o.sx = 1 + 0.1 * charge; o.dy = 0; }
  else if (p.dashT > 0) { o.anim = 'run'; o.frame = A.run[2 % A.run.length]; o.sx = 1.3; o.sy = 0.85; o.rot = 0.14; }
  else if (p.diving) { o.anim = 'fall'; o.frame = A.fall[0]; o.sx = 0.8; o.sy = 1.22; }
  else if (p.wailT > 0) { o.anim = 'jump'; o.frame = A.jump[0]; o.sx = 0.9; o.sy = 1.14; o.dy = -4; }          // stretched, face to the sky
  else if (p.sitting) { o.frame = A.idle[0]; o.sy = 0.86; o.dy = 4; }
  else if (p.hurtT > 0) { o.anim = 'fall'; o.frame = A.fall[0]; o.flash = 0.55; o.rot = -0.2; }
  else if (p.sliding) { o.anim = 'fall'; o.frame = A.fall[0]; o.rot = 0.1; o.sy = 1.04; }

  else if (p.landT > 0) { o.frame = A.idle[0]; o.sy = 0.88; o.sx = 1.08; }
  else if (Math.abs(p.vx) > 30) { o.anim = 'run'; o.frame = Pixel.frameOf(HeroStyle.sheet(), 'run', t * (0.6 + Math.abs(p.vx) / 500)); }

}

// ---------------------------------------------------------------- the husk
Art.enemy.husk = function (g, e, t) {

<script>
'use strict';
// Physics, the player, regular enemies, projectiles and pickups.
// Everything talks to the running game through the global G (set in game.js).

class Level {
  constructor(def) {
    this.def = def; this.id = def.id; this.w = def.w; this.h = def.h;
    this.t = Uint8Array.from(def.t);
    this.pw = def.w * TILE; this.ph = def.h * TILE;
    this.ice = def.iceCells || new Set();
    this.gravs = (def.gravs || []).map(z => ({ x: z.x * TILE, y: z.y * TILE, w: z.w * TILE, h: z.h * TILE, k: z.k }));
    this.winds = (def.winds || []).map(w => ({ x: w.x * TILE, y: w.y * TILE, w: w.w * TILE, h: w.h * TILE, wx: w.wx, wy: w.wy }));
  }
  gravAt(px, py) { for (const z of this.gravs) if (px >= z.x && px < z.x + z.w && py >= z.y && py < z.y + z.h) return z; return null; }
  windAt(px, py) { for (const w of this.winds) if (px >= w.x && px < w.x + w.w && py >= w.y && py < w.y + w.h) return w; return null; }
  isIce(tx, ty) { return this.ice.size > 0 && tx >= 0 && ty >= 0 && tx < this.w && ty < this.h && this.ice.has(ty * this.w + tx); }
  get(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return T_SOLID;
    return this.t[ty * this.w + tx];
  }
  set(tx, ty, v) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return;
    const rock = a => a === T_SOLID || a === T_BREAK || a === T_GATE || a === T_CRACK, old = this.t[ty * this.w + tx];
    this.t[ty * this.w + tx] = v;
    if (rock(old) !== rock(v)) Lumen.invalidate();          // the baked relief of the rock is out of date
  }
  solid(tx, ty) { const v = this.get(tx, ty); return v === T_SOLID || v === T_BREAK || v === T_GATE || v === T_CRACK || v === T_CRUMBLE; }
  hazard(tx, ty) { const v = this.get(tx, ty); return v === T_HAZARD || v === T_ACID; }
  solidAtPx(x, y) { return this.solid(Math.floor(x / TILE), Math.floor(y / TILE)); }
  ground(tx, ty) { const v = this.get(tx, ty); return v === T_SOLID || v === T_BREAK || v === T_GATE || v === T_ONEWAY || v === T_CRACK || v === T_BOUNCE || v === T_CRUMBLE; }
  // 2D raycast through the tile grid, sampled every 8px
  lineOfSight(x0, y0, x1, y1) {
    const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8);
    for (let i = 1; i < n; i++) { const t = i / n; if (this.solidAtPx(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; }
    return true;
  }
}

// Axis separated move with tile collision. Sets onGround / hitL / hitR / hitU.
function moveBody(b, dt, L) {
  b.hitL = b.hitR = b.hitU = false;
  const dx = b.vx * dt;
  b.x += dx;
  if (dx !== 0) {
    const top = Math.floor((b.y + 0.5) / TILE), bot = Math.floor((b.y + b.h - 0.5) / TILE);

      const tx = Math.floor((b.x + b.w) / TILE);
      for (let ty = top; ty <= bot; ty++) if (L.solid(tx, ty)) { b.x = tx * TILE - b.w - 0.001; b.hitR = true; b.vx = 0; break; }
    } else {
      const tx = Math.floor(b.x / TILE);
      for (let ty = top; ty <= bot; ty++) if (L.solid(tx, ty)) { b.x = (tx + 1) * TILE + 0.001; b.hitL = true; b.vx = 0; break; }
    }

    const by = Math.floor((b.y + b.h) / TILE);

      const v = L.get(tx, by);
      const top = (v === T_ONEWAY || v === T_BOUNCE) && prevBottom <= by * TILE + 0.5 && !b.noOneway;
