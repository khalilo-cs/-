    this.t += dt;
    const p = G.player;
    if (p.dead || G.state !== 'play') return;
    if (Math.abs(p.cx - this.x) < 30 && Math.abs(p.cy - this.y) < 40) { this.dead = true; G.collectItem(this); }
  }
}

// ============================== ENEMIES ==============================
// Enemy brains mirror a PlayMaker FSM: each enemy runs one switch over this.currentState.
const ST = { IDLE: 'idle', PATROL: 'patrol', CHASE: 'chase', ANTICIPATION: 'anticipation', ATTACK: 'attack', RECOIL: 'recoil' };
class Enemy {
  constructor(def, w, h) {
    this.w = w; this.h = h;
    this.x = def.x * TILE + TILE / 2 - w / 2; this.y = def.y * TILE + TILE - h;
    this.vx = 0; this.vy = 0; this.face = def.face || (Math.random() < 0.5 ? -1 : 1);
    this.t = rand(0, 10); this.flash = 0; this.stun = 0; this.dead = false; this.dmg = 1; this.geo = 2;
    this.kb = 1; this.home = { x: this.x + w / 2, y: this.y + h / 2 }; this.onGround = false;
    this.currentState = ST.IDLE; this.stateT = 0; this.lastSeen = -99;
  }
  get cx() { return this.x + this.w / 2; }
  get cy() { return this.y + this.h / 2; }
  hb() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  body() { return this.hb(); }
  setState(s) { this.currentState = s; this.stateT = 0; }
  tick(dt) { this.t += dt; this.flash -= dt; this.stun -= dt; this.stateT += dt; }
  hurt(dmg, dir, how) {
    if (this.dead) return;
    this.hp -= dmg; this.flash = 0.12; Sound.play('hit'); G.hitstop(how === 'spell' ? 0.03 : 0.06);
    G.burst(this.cx, this.cy, 8, { color: this.blood || '#ffd59a', speed: 220, life: 0.35, size: 3 });
    G.burst(this.cx, this.cy, 3, { color: '#ffffff', speed: 260, life: 0.15, size: 2 });
    G.slashFx(this.cx, this.cy, dir);
    this.onHurt(dir, how);
    if (this.hp <= 0) this.kill();
  }
  // knockback pushes the enemy away from the strike and puts it in the Recoil state
  // the Dusk Cry holds enemies in its column instead of throwing them out of it
  onHurt(dir, how) { if (this.kb && how === 'wail') { this.vx *= 0.3; this.vy = -30 * this.kb; this.stun = 0.1; } else if (this.kb) { this.vx = dir * 220 * this.kb; this.vy = -140 * this.kb; this.stun = 0.18; this.setState(ST.RECOIL); } }
  kill() {
    this.dead = true; Sound.play('enemyDie'); G.shake(4, 0.15);
    G.burst(this.cx, this.cy, 22, { color: this.blood || '#ffd59a', speed: 260, life: 0.6, size: 4 });
    G.burst(this.cx, this.cy, 8, { color: '#0a0d12', speed: 180, life: 0.6, size: 5 });
    G.dropGeo(this.cx, this.cy, this.geo);
  }
  // distance check first, then a ray through the tiles so walls block the view
  seesPlayer(range) {
    const p = G.player;
    if (p.dead) return false;
    const dx = p.cx - this.cx, dy = p.cy - this.cy;
    if (dx * dx + dy * dy > range * range) return false;
    return G.level.lineOfSight(this.cx, this.y + 8, p.cx, p.cy);
  }
  canSeePlayer(range) { return this.seesPlayer(range); }
  // ledge or wall directly ahead: ground walkers turn or stop instead of walking off
  edgeAhead(dir) {
    const L = G.level, fx = Math.floor((this.cx + dir * (this.w / 2 + 6)) / TILE), fy = Math.floor((this.y + this.h + 4) / TILE);
    return !L.ground(fx, fy) || L.solid(fx, Math.floor((this.y + this.h - 4) / TILE));
  }
  physics(dt, grav) {
    if (grav !== false) this.vy = Math.min(this.vy + GRAV * dt, MAXFALL);
    moveBody(this, dt, G.level);
  }
}

class Crawler extends Enemy {
  constructor(d) { super(d, 34, 22); this.hp = 10; this.geo = 2; this.speed = 52; this.blood = '#ffcf8a'; }
  update(dt) {
    this.tick(dt);
    switch (this.currentState) {
      case ST.IDLE: this.setState(ST.PATROL); break;
      case ST.PATROL:
        if (this.onGround) { if (this.edgeAhead(this.face)) this.face *= -1; this.vx = this.face * this.speed; }
        break;
      case ST.RECOIL:
        if (this.onGround) this.vx *= 0.85;
        if (this.stateT > 0.18) this.setState(ST.PATROL);
        break;
    }
    this.physics(dt);
    if (this.hitL) this.face = 1; if (this.hitR) this.face = -1;
  }
}

// A hollow husk from the artist's sprite: shuffles along its patrol, hunts when it sees you, and
// gathers itself for a short leap when you are close.
class Husk extends Enemy {
  constructor(d) { super(d, 34, 40); this.hp = 12; this.geo = 3; this.speed = 48; this.blood = '#9db4e0'; this.lostT = 0; }
  update(dt) {
    this.tick(dt);
    const p = G.player, dist = Math.abs(p.cx - this.cx);
    switch (this.currentState) {
      case ST.IDLE: this.setState(ST.PATROL); break;
      case ST.PATROL:
        if (this.onGround) { if (this.edgeAhead(this.face)) this.face *= -1; this.vx = this.face * this.speed; }
        if (this.seesPlayer(300)) this.setState(ST.CHASE);
        break;
      case ST.CHASE:
        if (this.onGround) {
          this.face = p.cx > this.cx ? 1 : -1;
          this.vx = this.edgeAhead(this.face) ? 0 : this.face * 100;
          if (this.stateT > 0.8 && dist < 170 && Math.abs(p.cy - this.cy) < 90 && this.seesPlayer(220)) this.setState(ST.ANTICIPATION);
        }
        this.lostT = this.seesPlayer(420) ? 0 : this.lostT + dt;
        if (this.lostT > 2) { this.lostT = 0; this.setState(ST.PATROL); }
        break;
      case ST.ANTICIPATION:
        this.vx = 0;
        if (this.stateT > 0.25) { this.vy = -400; this.vx = this.face * 230; this.onGround = false; this.setState(ST.ATTACK); }
        break;
      case ST.ATTACK:
        if (this.onGround && this.stateT > 0.12) { this.vx = 0; this.setState(ST.CHASE); }
        break;
      case ST.RECOIL:
        if (this.onGround) this.vx *= 0.85;
        if (this.stateT > 0.2) this.setState(ST.CHASE);
        break;
    }
    this.physics(dt);
    if (this.hitL) this.face = 1; if (this.hitR) this.face = -1;
  }
}

class Flyer extends Enemy {
  constructor(d) { super(d, 30, 26); this.hp = 10; this.geo = 3; this.kb = 1.2; this.blood = '#e8f6ff'; this.ph = rand(0, 6); this.glowR = 110; }
  steer(tx, ty, sp, acc, dt) {
    const dx = tx - this.cx, dy = ty - this.cy, d = Math.hypot(dx, dy) || 1;
    this.vx = approach(this.vx, dx / d * sp, acc * dt); this.vy = approach(this.vy, dy / d * sp, acc * dt);
    if (Math.abs(this.vx) > 10) this.face = sign(this.vx);
  }
  update(dt) {
    this.tick(dt);
    const p = G.player, sees = this.seesPlayer(300);
    if (sees) this.lastSeen = this.t;
    switch (this.currentState) {
      case ST.IDLE:        // drift around the nest
        this.steer(this.home.x + Math.sin(this.t * 0.8 + this.ph) * 40, this.home.y + Math.sin(this.t * 1.7 + this.ph) * 14, 60, 200, dt);
        if (sees) this.setState(ST.CHASE);
        break;
      case ST.CHASE:
        this.steer(p.cx, p.cy - 6 + Math.sin(this.t * 4) * 18, 135, 420, dt);
        if (p.dead || this.t - this.lastSeen > 2) this.setState(ST.IDLE);
        break;
      case ST.RECOIL:
        this.vx *= 0.94; this.vy *= 0.94;
        if (this.stateT > 0.2) this.setState(ST.CHASE);
        break;
    }
    this.physics(dt, false);
    if (this.hitL || this.hitR) this.vx = 0; if (this.hitU || this.onGround) this.vy = 0;
  }
}

class Hopper extends Enemy {
  constructor(d) { super(d, 30, 30); this.hp = 14; this.geo = 4; this.wait = rand(0.6, 1.6); this.blood = '#b8e08a'; }
  update(dt) {
    this.tick(dt);
    const p = G.player;
    switch (this.currentState) {
      case ST.IDLE:
        if (this.onGround) this.vx *= 0.8;
        if (this.onGround && this.stateT > this.wait && this.seesPlayer(380)) { this.face = p.cx > this.cx ? 1 : -1; this.setState(ST.ANTICIPATION); }
        break;
      case ST.ANTICIPATION:  // crouch before the leap
        this.vx = 0;
        if (this.stateT > 0.28) { this.vy = -540; this.vx = this.face * rand(140, 200); this.onGround = false; this.setState(ST.ATTACK); }
        break;
      case ST.ATTACK:
        if (this.onGround && this.stateT > 0.1) { this.wait = rand(0.9, 1.8); this.setState(ST.IDLE); }
        break;
      case ST.RECOIL:
        if (this.onGround) this.vx *= 0.85;
        if (this.stateT > 0.2) this.setState(ST.IDLE);
        break;
    }
    this.physics(dt);
    if (this.hitL || this.hitR) this.vx = 0;
  }
}

class Spitter extends Enemy {
  constructor(d) { super(d, 30, 36); this.hp = 12; this.geo = 4; this.cool = rand(0.8, 2); this.tele = 0; this.kb = 0; this.blood = '#9fdc7a'; }
  update(dt) {
    this.t += dt; this.flash -= dt;
    const p = G.player;
    this.face = p.cx > this.cx ? 1 : -1;
    if (this.tele > 0) {
      this.tele -= dt;
      if (this.tele <= 0) this.fire();
    } else {
      this.cool -= dt;
      if (this.cool <= 0 && this.canSeePlayer(430)) { this.tele = 0.45; this.cool = 2.3; Sound.play('tele'); }
    }
    this.physics(dt);
  }
  fire() {
    const p = G.player, g = 900, T = clamp(Math.abs(p.cx - this.cx) / 360 + 0.45, 0.5, 1.1);
    const sx = this.cx, sy = this.y + 6;
    const vx = (p.cx - sx) / T, vy = (p.cy - sy - 0.5 * g * T * T) / T;
    Sound.play('shoot');
    G.projs.push(new Proj({ x: sx, y: sy, vx, vy, grav: g, r: 8, dmg: 1, kind: 'glob', color: '#b6ef6a', life: 3 }));
  }
}

class Shard extends Enemy {     // crystal turret
  constructor(d) { super(d, 30, 42); this.hp = 15; this.geo = 5; this.cool = rand(1, 2.4); this.tele = 0; this.kb = 0; this.blood = '#ff9bd6'; this.glowR = 150; }
  update(dt) {
    this.t += dt; this.flash -= dt;
    const p = G.player;
    this.face = p.cx > this.cx ? 1 : -1;
    if (this.tele > 0) {
      this.tele -= dt;
      if (this.tele <= 0) {
        const a = Math.atan2(p.cy - this.cy, p.cx - this.cx);
        Sound.play('shoot');
        for (const o of [-0.26, 0, 0.26]) G.projs.push(new Proj({ x: this.cx, y: this.cy - 6, vx: Math.cos(a + o) * 270, vy: Math.sin(a + o) * 270, r: 7, dmg: 1, kind: 'shard', color: '#ff8fd0', life: 3, rot: a + o }));
      }
    } else {
      this.cool -= dt;
      if (this.cool <= 0 && this.canSeePlayer(470)) { this.tele = 0.5; this.cool = 2.8; Sound.play('tele'); }
    }
    this.physics(dt);
  }
}

class Sentinel extends Enemy {   // Idle -> Patrol (waypoints) -> Chase -> Anticipation -> Attack, Recoil when struck
  constructor(d) {
    super(d, 40, 58); this.hp = 32; this.geo = 14; this.kb = 0.35; this.blood = '#d8c8a0';
    this.range = (d.range || 5) * TILE; this.wp = null; this.wpi = 1; this.melee = null;
  }
  // walk the ground both ways from the spawn to find two waypoints before any ledge or wall
  initWaypoints() {
    const L = G.level, fy = Math.floor((this.y + this.h + 4) / TILE), wy = Math.floor((this.y + this.h - 6) / TILE);
    const ok = x => { const tx = Math.floor(x / TILE); return L.ground(tx, fy) && !L.solid(tx, wy); };
    let a = this.cx, b = this.cx;
    for (let i = 0; i < this.range; i += 8) { if (!ok(this.cx - i - this.w / 2 - 4)) break; a = this.cx - i; }
    for (let i = 0; i < this.range; i += 8) { if (!ok(this.cx + i + this.w / 2 + 4)) break; b = this.cx + i; }
    this.wp = [a, b];
  }
  onHurt(dir, how) {
    if (this.currentState === ST.ANTICIPATION || this.currentState === ST.ATTACK) { this.vx += dir * 60; return; }   // armour holds mid-swing
    super.onHurt(dir, how);
  }
  update(dt) {
    this.tick(dt);
    if (!this.wp && this.onGround) this.initWaypoints();
    const p = G.player, sees = this.seesPlayer(320) && Math.abs(p.cy - this.cy) < 120;
    if (sees) this.lastSeen = this.t;
    this.melee = null;
    switch (this.currentState) {
      case ST.IDLE:
        this.vx = 0;
        if (sees) this.setState(ST.CHASE);
        else if (this.stateT > 0.8) this.setState(ST.PATROL);
        break;
      case ST.PATROL: {
        if (!this.wp) { this.vx = 0; break; }
        const tx = this.wp[this.wpi];
        this.face = tx > this.cx ? 1 : -1; this.vx = this.face * 42;
        if (Math.abs(tx - this.cx) < 4 || this.edgeAhead(this.face)) { this.wpi ^= 1; this.setState(ST.IDLE); }
        if (sees) this.setState(ST.CHASE);
        break;
      }
      case ST.CHASE:
        this.face = p.cx > this.cx ? 1 : -1;
        this.vx = this.edgeAhead(this.face) ? 0 : this.face * 150;
        if (Math.abs(p.cx - this.cx) < 95 && Math.abs(p.cy - this.cy) < 70) { this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        else if (this.t - this.lastSeen > 1.3) this.setState(ST.PATROL);
        break;
      case ST.ANTICIPATION:   // raise the blade, readable warning
        this.vx = 0;
        if (this.stateT >= 0.45) this.setState(ST.ATTACK);
        break;
      case ST.ATTACK:         // short lunge with a live hitbox
        this.vx = this.edgeAhead(this.face) ? 0 : this.face * 380;
        this.melee = { x: this.face > 0 ? this.x + this.w - 6 : this.x - 44, y: this.y + 10, w: 50, h: 40 };
        if (!p.dead && overlap(p.hurtbox(), this.melee)) p.hurt(1, this.cx);
        if (this.stateT >= 0.28) { this.vx = 0; this.setState(ST.IDLE); }
        break;
      case ST.RECOIL:
        this.vx *= 0.85;
        if (this.stateT > 0.2) this.setState(ST.CHASE);
        break;
    }
    this.physics(dt);
  }
}

class ShadeEnemy extends Enemy {   // the shade that keeps your Geo after a death
  constructor(d, geo) { super(d, 34, 46); this.hp = 28; this.geo = 0; this.stored = geo; this.kb = 0.3; this.ghostly = false; this.blood = '#9db5d6'; this.home = { x: this.x + 17, y: this.y + 23 }; }
  update(dt) {
    this.t += dt; this.flash -= dt; this.stun -= dt;
    const p = G.player;
    if (this.stun > 0) { this.vx *= 0.93; this.vy *= 0.93; }
    else {
      const d = Math.hypot(p.cx - this.cx, p.cy - this.cy);
      const tx = d < 360 ? p.cx : this.home.x, ty = (d < 360 ? p.cy - 10 : this.home.y) + Math.sin(this.t * 3) * 20;
      const dx = tx - this.cx, dy = ty - this.cy, m = Math.hypot(dx, dy) || 1;
      this.vx = approach(this.vx, dx / m * 105, 260 * dt); this.vy = approach(this.vy, dy / m * 105, 260 * dt);
      this.face = sign(this.vx) || this.face;
    }
    this.physics(dt, false);
  }
  kill() {
    this.dead = true; Sound.play('enemyDie'); G.shake(5, 0.2);
    G.burst(this.cx, this.cy, 26, { color: '#b9cbe8', speed: 240, life: 0.8, size: 4 });
    G.player.geo += this.stored; G.shadeRecovered(this.stored);
  }
}

class Diver extends Enemy {     // mosquito: hovers, locks on, then spears in a straight line
  constructor(d) { super(d, 28, 24); this.hp = 12; this.geo = 4; this.kb = 1; this.blood = '#ffb070'; this.glowR = 90; this.ph = rand(0, 6); this.cool = rand(0.5, 1.5); }
  update(dt) {
    this.tick(dt);
    const p = G.player, sees = this.seesPlayer(330);
    switch (this.currentState) {
      case ST.IDLE: {
        const tx = this.home.x + Math.sin(this.t * 0.9 + this.ph) * 50, ty = this.home.y + Math.sin(this.t * 2 + this.ph) * 16;
        this.vx = approach(this.vx, (tx - this.cx) * 2, 300 * dt); this.vy = approach(this.vy, (ty - this.cy) * 2, 300 * dt);
        this.face = sign(p.cx - this.cx) || this.face;
        this.cool -= dt;
        if (sees && this.cool <= 0) { this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        break;
      }
      case ST.ANTICIPATION: {   // shiver while aiming
        this.vx *= 0.8; this.vy *= 0.8;
        const a = Math.atan2(p.cy - this.cy, p.cx - this.cx); this.aim = a; this.face = Math.cos(a) >= 0 ? 1 : -1;
        if (this.stateT > 0.45) this.setState(ST.ATTACK);
        break;
      }
      case ST.ATTACK:
        this.vx = Math.cos(this.aim) * 560; this.vy = Math.sin(this.aim) * 560;
        if (this.stateT > 0.7 || this.hitL || this.hitR || this.hitU || this.onGround) { this.vx *= 0.2; this.vy *= 0.2; this.cool = 1.3; this.home = { x: this.cx, y: this.cy - 40 }; this.setState(ST.IDLE); }
        break;
      case ST.RECOIL:
        this.vx *= 0.92; this.vy *= 0.92;
        if (this.stateT > 0.2) { this.cool = 0.8; this.setState(ST.IDLE); }
        break;
    }
    this.physics(dt, false);
  }
}

class Spider extends Enemy {    // hangs on a thread, drops on the player, then chases along the floor
  constructor(d) {
    super(d, 34, 24); this.hp = 14; this.geo = 5; this.kb = 0.8; this.blood = '#c8a8ff';
    this.hanging = !d.ground; if (!this.hanging) this.currentState = ST.CHASE;
    this.anchorY = null;
  }
  update(dt) {
    this.tick(dt);
    const p = G.player;
    if (this.anchorY === null) { let ty = Math.floor(this.y / TILE); while (ty > 0 && !G.level.solid(Math.floor(this.cx / TILE), ty)) ty--; this.anchorY = (ty + 1) * TILE; }
    switch (this.currentState) {
      case ST.IDLE:     // hanging
        if (this.hanging) {
          this.vx = 0; this.vy = 0; this.y += Math.sin(this.t * 2) * 0.2;
          if (!p.dead && Math.abs(p.cx - this.cx) < 80 && p.cy > this.cy && p.cy - this.cy < 460 && this.seesPlayer(480)) { this.hanging = false; this.setState(ST.ATTACK); Sound.play('tele'); }
          this.physics(0, false);
          return;
        }
        this.setState(ST.CHASE);
        break;
      case ST.ATTACK:   // falling
        if (this.onGround) { G.shake(3, 0.1); G.burst(this.cx, this.y + this.h, 8, { color: '#8a8aa0', speed: 120, life: 0.4, size: 3 }); this.setState(ST.CHASE); }
        break;
      case ST.CHASE:
        if (this.onGround) {
          this.face = p.cx > this.cx ? 1 : -1;
          this.vx = this.edgeAhead(this.face) ? 0 : this.face * 115;
          if (Math.abs(p.cx - this.cx) < 70 && Math.abs(p.cy - this.cy) < 50 && this.stateT > 0.6) this.setState(ST.ANTICIPATION);
        }
        break;
      case ST.ANTICIPATION:
        this.vx = 0;
        if (this.stateT > 0.3) { this.vy = -380; this.vx = this.face * 260; this.onGround = false; this.setState(ST.RECOIL); }
        break;
      case ST.RECOIL:
        if (this.onGround && this.stateT > 0.15) { this.vx *= 0.8; if (this.stateT > 0.35) this.setState(ST.CHASE); }
        break;
    }
    this.physics(dt);
  }
}

class Shroom extends Enemy {    // slow walker that breathes out a cloud of spores
  constructor(d) { super(d, 30, 36); this.hp = 16; this.geo = 5; this.kb = 0.6; this.blood = '#ffcf70'; this.cool = rand(0.5, 1.5); }
  update(dt) {
    this.tick(dt);
    const p = G.player;
    switch (this.currentState) {
      case ST.IDLE: this.vx = 0; if (this.stateT > 0.6) this.setState(ST.PATROL); break;
      case ST.PATROL:
        if (this.onGround) { if (this.edgeAhead(this.face)) this.face *= -1; this.vx = this.face * 32; }
        this.cool -= dt;
        if (this.cool <= 0 && this.seesPlayer(210) && Math.abs(p.cy - this.cy) < 80) { this.face = p.cx > this.cx ? 1 : -1; this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        break;
      case ST.ANTICIPATION: this.vx = 0; if (this.stateT > 0.5) this.setState(ST.ATTACK); break;
      case ST.ATTACK:
        G.projs.push(new Proj({ kind: 'cloud', x: this.cx + this.face * 46, y: this.cy - 4, w: 84, h: 64, vx: this.face * 30, vy: -12, dmg: 1, life: 1.5, pierce: true, passWalls: true, color: '#e8d070' }));
        Sound.play('dash'); this.cool = 2; this.setState(ST.IDLE);
        break;
      case ST.RECOIL: if (this.onGround) this.vx *= 0.85; if (this.stateT > 0.2) this.setState(ST.PATROL); break;
    }
    this.physics(dt);
  }
}

class Jelly extends Enemy {     // drifting jellyfish that bursts into sparks when popped
  constructor(d) { super(d, 30, 32); this.hp = 8; this.geo = 3; this.kb = 0.6; this.blood = '#ffc890'; this.glowR = 130; this.ph = rand(0, 6); }
  update(dt) {
    this.tick(dt);
    switch (this.currentState) {
      case ST.RECOIL: this.vx *= 0.9; this.vy *= 0.9; if (this.stateT > 0.25) this.setState(ST.IDLE); break;
      default: {
        const tx = this.home.x + Math.sin(this.t * 0.5 + this.ph) * 60, ty = this.home.y + Math.sin(this.t * 0.9 + this.ph) * 30;
        this.vx = approach(this.vx, (tx - this.cx) * 0.8, 60 * dt); this.vy = approach(this.vy, (ty - this.cy) * 0.8, 60 * dt);
      }
    }
    this.physics(dt, false);
  }
  kill() {
    super.kill();
    for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + 0.3; G.projs.push(new Proj({ kind: 'orb', x: this.cx, y: this.cy, vx: Math.cos(a) * 170, vy: Math.sin(a) * 170, r: 7, dmg: 1, life: 1.4, color: '#ffc890' })); }
  }
}

// Shield Warden: a slow guard with a tall shield. A strike from the side it faces is blocked; its
// back, the air above it and spells are open. It turns toward the player only every 0.8 s, so
// slipping past gives a moment to strike its back.  Idle -> Patrol -> Chase -> Anticipation -> Attack (shield bash) -> Recoil
class Warden extends Enemy {
  constructor(d) { super(d, 38, 56); this.hp = 28; this.geo = 9; this.kb = 0.3; this.blood = '#c9b88a'; this.turnCD = 0; this.blocked = 0; }
  hurt(dmg, dir, how) {
    if (this.dead) return;
    if (how === 'side' && dir === -this.face) {            // the strike travels against the way it faces: shield
      this.blocked = 0.18; this.flash = 0;
      Sound.play('clank'); G.hitstop(0.04);
      G.burst(this.cx + this.face * 24, this.cy - 6, 8, { color: '#fff3c4', speed: 220, life: 0.25, size: 2 });
      if (this.currentState !== ST.ATTACK) this.vx += -dir * 40;
      return false;
    }
    return super.hurt(dmg, dir, how);
  }
  update(dt) {
    this.tick(dt); this.turnCD -= dt; this.blocked -= dt;
    const p = G.player, sees = this.seesPlayer(300) && Math.abs(p.cy - this.cy) < 110;
    if (sees) this.lastSeen = this.t;
    switch (this.currentState) {
      case ST.IDLE:
        this.vx = 0;
        if (sees) this.setState(ST.CHASE);
        else if (this.stateT > 1) this.setState(ST.PATROL);
        break;
      case ST.PATROL:
        this.vx = this.face * 34;
        if (this.edgeAhead(this.face)) { this.face = -this.face; this.setState(ST.IDLE); }
        if (sees) this.setState(ST.CHASE);
        break;
      case ST.CHASE:
        if (this.turnCD <= 0) { this.face = p.cx > this.cx ? 1 : -1; this.turnCD = 0.8; }
        this.vx = this.edgeAhead(this.face) ? 0 : this.face * 58;
        if (Math.abs(p.cx - this.cx) < 78 && Math.abs(p.cy - this.cy) < 70 && (p.cx - this.cx) * this.face > 0) { this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        else if (this.t - this.lastSeen > 1.5) this.setState(ST.PATROL);
        break;
      case ST.ANTICIPATION:           // the shield is drawn back
        this.vx = 0;
        if (this.stateT >= 0.55) this.setState(ST.ATTACK);
        break;
      case ST.ATTACK:                 // shield bash
        this.vx = this.edgeAhead(this.face) ? 0 : this.face * 300;
        if (this.stateT >= 0.3) { this.vx = 0; this.setState(ST.RECOIL); }
        break;
      case ST.RECOIL:
        this.vx *= 0.85;
        if (this.stateT > 0.35) this.setState(ST.CHASE);
        break;
    }
    this.physics(dt);
  }
}

// Ram: paws the ground, charges in a straight line, and is left dazed when it runs into a wall.
// Patrol -> Anticipation (pawing) -> Attack (charge) -> Recoil (dazed after a crash)
class Ram extends Enemy {
  constructor(d) { super(d, 52, 34); this.hp = 26; this.geo = 7; this.kb = 0.25; this.blood = '#d4b79a'; this.crashed = false; }
  onHurt(dir, how) { if (this.currentState === ST.ATTACK) return; super.onHurt(dir, how); }     // nothing stops a charge
  update(dt) {
    this.tick(dt);
    const p = G.player, sees = this.seesPlayer(430) && Math.abs(p.cy - this.cy) < 90;
    switch (this.currentState) {
      case ST.IDLE:
        this.vx = 0;
        if (sees && this.stateT > 0.4) { this.face = p.cx > this.cx ? 1 : -1; this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        else if (this.stateT > 1.2) this.setState(ST.PATROL);
        break;
      case ST.PATROL:
        this.vx = this.face * 36;
        if (this.edgeAhead(this.face)) { this.face = -this.face; this.setState(ST.IDLE); }
        if (sees) { this.face = p.cx > this.cx ? 1 : -1; this.setState(ST.ANTICIPATION); Sound.play('tele'); }
        break;
      case ST.ANTICIPATION:           // paws the ground: dust, a readable warning
        this.vx = 0;
        if (Math.random() < 0.5) G.burst(this.cx + this.face * 26, this.y + this.h, 1, { color: '#8d9aa8', speed: 60, life: 0.4, size: 3, vy: -40 });
        if (this.stateT >= 0.75) this.setState(ST.ATTACK);
        break;
      case ST.ATTACK: {
        const wall = this.face > 0 ? this.hitR : this.hitL;
        this.vx = this.face * 430;
        if (Math.random() < 0.6) G.burst(this.cx - this.face * 26, this.y + this.h, 1, { color: '#8d9aa8', speed: 50, life: 0.35, size: 3, vy: -30 });
        if (wall) { this.crashed = true; this.vx = -this.face * 90; this.vy = -180; G.shake(6, 0.2); Sound.play('slam'); G.burst(this.cx + this.face * 26, this.cy, 12, { color: '#cfd8e0', speed: 200, life: 0.4, size: 3 }); this.setState(ST.RECOIL); }
        else if (this.edgeAhead(this.face) || this.stateT > 1.6) { this.vx = 0; this.setState(ST.RECOIL); }
        break;
      }
      case ST.RECOIL:
        this.vx *= 0.85;
        if (this.stateT > (this.crashed ? 1.1 : 0.35)) { this.crashed = false; this.setState(ST.IDLE); }
        break;
    }
    this.physics(dt);
  }
}

const ENEMY_TYPES = { husk: Husk, crawler: Crawler, flyer: Flyer, hopper: Hopper, spitter: Spitter, shard: Shard, sentinel: Sentinel, diver: Diver, spider: Spider, shroom: Shroom, jelly: Jelly, warden: Warden, ram: Ram };

<script>
'use strict';
// Room machinery: crumbling plates, moving platforms that carry the player, saw blades on rails,
// levers that open gates, and stalactites that drop on whoever walks beneath.
// A room lists its pieces in def.mech (see RoomBuilder in world.js); Mech.init builds them on
// entry and the game calls Mech.update before the player moves, so riders are carried first.

const CRUMBLE_DELAY = 0.55;      // seconds a plate shakes under the player before it falls
const CRUMBLE_RETURN = 3.2;      // seconds until it grows back
const DRIP_SHAKE = 0.38;         // stalactite warning time
const DRIP_REGROW = 3.5;

function circleRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
// eases a 0..1 path position so machines slow into their stops
const easeInOut = u => u * u * (3 - 2 * u);

// ------------------------------------------------------------------ crumbling plates
// A horizontal run of T_CRUMBLE tiles that gives way as one piece: idle -> shake -> gone -> idle.
class Crumble {
  constructor(x, y, w) { this.x = x; this.y = y; this.w = w; this.state = 'idle'; this.t = 0; this.fade = 1; this.chunks = []; }
  rect() { return { x: this.x * TILE, y: this.y * TILE, w: this.w * TILE, h: TILE }; }
  carrying() {
    return P.onGround && !P.riding && Math.abs(P.y + P.h - this.y * TILE) < 1.5 &&
      P.x + P.w > this.x * TILE + 1 && P.x < (this.x + this.w) * TILE - 1;
  }
  update(dt) {
    this.t += dt;
    for (const c of this.chunks) { c.vy += 1800 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; c.life -= dt; }
    this.chunks = this.chunks.filter(c => c.life > 0);
    if (this.state === 'idle') {
      this.fade = Math.min(1, this.fade + dt * 3);
      if (this.carrying()) { this.state = 'shake'; this.t = 0; Sound.play('creak'); }
    } else if (this.state === 'shake') {
      if (Math.random() < 0.35) G.burst(this.x * TILE + Math.random() * this.w * TILE, (this.y + 1) * TILE, 1, { color: '#a0705a', speed: 30, life: 0.5, size: 2, vy: 40 });
      if (this.t >= CRUMBLE_DELAY) this.collapse();
    } else if (this.state === 'gone' && this.t >= CRUMBLE_RETURN) {
      const r = this.rect();
      const blocked = overlap(P, r) || G.enemies.some(e => !e.dead && overlap(e.body(), r));
      if (!blocked) { this.state = 'idle'; this.t = 0; this.fade = 0; for (let i = 0; i < this.w; i++) G.level.set(this.x + i, this.y, T_CRUMBLE); }
    }
  }
  collapse() {
    this.state = 'gone'; this.t = 0;
    for (let i = 0; i < this.w; i++) {
      G.level.set(this.x + i, this.y, T_AIR);
      for (let k = 0; k < 2; k++) this.chunks.push({ x: (this.x + i) * TILE + 8 + k * 16, y: this.y * TILE + 8, vx: rand(-60, 60), vy: rand(-80, 40), rot: 0, vr: rand(-6, 6), s: rand(8, 13), life: 1.4 });
    }
    Sound.play('break');
    G.burst((this.x + this.w / 2) * TILE, this.y * TILE + 16, 14, { color: '#8a5a44', speed: 160, life: 0.6, size: 3 });
  }
}

// ------------------------------------------------------------------ moving platforms
// Travels A <-> B and waits at each end. "needs" names a flag (a lever) that powers it.
class Mover {
  constructor(o) {
    this.ax = o.x * TILE; this.ay = o.y * TILE; this.bx = o.to.x * TILE; this.by = o.to.y * TILE;
    this.w = o.w * TILE; this.h = 16; this.speed = o.speed || 110; this.wait = o.wait == null ? 0.8 : o.wait; this.needs = o.needs || null;
    this.len = Math.max(1, Math.hypot(this.bx - this.ax, this.by - this.ay));
    this.s = 0; this.dir = 1; this.waitT = this.wait; this.x = this.ax; this.y = this.ay; this.dx = 0; this.dy = 0; this.t = 0;
  }
  powered() { return !this.needs || !!G.flags[this.needs]; }
  update(dt) {
    const ox = this.x, oy = this.y;
    this.t += dt;
    if (this.powered()) {
      if (this.waitT > 0) this.waitT -= dt;
      else {
        // s advances steadily; the easing below slows the deck into each stop
        this.s += this.dir * this.speed * dt / this.len;
        if (this.s >= 1) { this.s = 1; this.dir = -1; this.waitT = this.wait; Sound.play('clunk'); }
        else if (this.s <= 0) { this.s = 0; this.dir = 1; this.waitT = this.wait; Sound.play('clunk'); }
      }
    }
    const k = easeInOut(this.s);
    this.x = lerp(this.ax, this.bx, k); this.y = lerp(this.ay, this.by, k);
    this.dx = this.x - ox; this.dy = this.y - oy;
  }
}

// ------------------------------------------------------------------ saw blades
// Either rides a rail A <-> B (ping-pong) or orbits a pivot. Touching one is like touching
// spikes; striking down on one bounces you off it, a side strike just clangs.
class Saw {
  constructor(o) {
    this.r = o.r || 22; this.spin = 0; this.spark = 0;
    if (o.orbit) { this.cx = o.x * TILE; this.cy = o.y * TILE; this.R = o.orbit * TILE; this.a = (o.phase || 0) * Math.PI * 2; this.speed = o.speed || 140; }
    else {
      this.ax = o.x * TILE; this.ay = o.y * TILE; this.bx = (o.to ? o.to.x : o.x) * TILE; this.by = (o.to ? o.to.y : o.y) * TILE;
      this.len = Math.max(1, Math.hypot(this.bx - this.ax, this.by - this.ay)); this.speed = o.speed || 120;
      this.u = (o.phase || 0) * 2;           // 0..2 covers there and back
    }
    this.place();
  }
  place() {
    if (this.R) { this.x = this.cx + Math.cos(this.a) * this.R; this.y = this.cy + Math.sin(this.a) * this.R; return; }
    const k = easeInOut(this.u <= 1 ? this.u : 2 - this.u);
    this.x = lerp(this.ax, this.bx, k); this.y = lerp(this.ay, this.by, k);
  }
  update(dt) {
    this.spin += dt * 16; this.spark -= dt;
    if (this.R) this.a += dt * this.speed / this.R;
    else this.u = (this.u + dt * this.speed / this.len) % 2;
    this.place();
    if (!P.dead && P.invuln <= 0 && G.state === 'play' && circleRect(this.x, this.y, this.r - 4, P.hurtbox())) {
      G.burst(P.cx, P.cy, 10, { color: '#ffd8a0', speed: 260, life: 0.35, size: 2 });
      P.spikeHurt();
    }
  }
}

// ------------------------------------------------------------------ levers
// Strike it once: it flips, saves a flag, and its gates sink row by row.
class Lever {
  constructor(o) {
    this.x = o.x * TILE + 16; this.y = (o.y + 1) * TILE; this.flag = 'lever_' + o.id; this.gates = o.gates || [];
    this.on = !!G.flags[this.flag]; this.flip = this.on ? 1 : 0; this.opening = -1; this.rows = [];
  }
  hb() { return { x: this.x - 16, y: this.y - 48, w: 32, h: 48 }; }
  hit() {
    G.burst(this.x, this.y - 34, 8, { color: '#ffd8a0', speed: 200, life: 0.3, size: 2 });
    if (this.on) { Sound.play('clank'); return; }
    this.on = true; G.flags[this.flag] = true;
    Sound.play('lever'); G.shake(4, 0.25);
    // gates open from the bottom row up
    this.rows = [];
    for (const gt of this.gates) for (let y = gt.y + gt.h - 1; y >= gt.y; y--) this.rows.push({ gt, y });
    this.opening = 0;
    if (this.gates.length) G.toastMsg(tr('gate_opened'), 2.4);
  }
  update(dt) {
    this.flip = approach(this.flip, this.on ? 1 : 0, dt * 7);
    if (this.opening < 0 || !this.rows.length) return;
    this.opening += dt;
    while (this.rows.length && this.opening > 0.35) {
      const { gt, y } = this.rows.shift();
      for (let x = gt.x; x < gt.x + gt.w; x++) {
        G.level.set(x, y, T_AIR);
        G.burst(x * TILE + 16, y * TILE + 16, 5, { color: '#8a7a6a', speed: 140, life: 0.5, size: 3 });
      }
      this.opening = 0.22;
      Sound.play(this.rows.length ? 'clunk' : 'door');
    }
  }
}

// ------------------------------------------------------------------ stalactites
class Drip {
  constructor(o) { this.hx = o.x * TILE + 16; this.hy = o.y * TILE; this.len = o.len || 44; this.reset(); this.grow = 1; }
  reset() { this.state = 'hang'; this.x = this.hx; this.y = this.hy; this.vy = 0; this.t = 0; }
  body() { return { x: this.x - 9, y: this.y, w: 18, h: this.len }; }
  drop() { if (this.state === 'hang' || this.state === 'shake') { this.state = 'fall'; this.vy = 120; Sound.play('creak'); } }
  update(dt) {
    this.t += dt;
    const L = G.level;
    if (this.state === 'grow') { this.grow = Math.min(1, this.t / 0.6); if (this.grow >= 1) this.reset(); return; }
    if (this.state === 'hang') {
      const below = Math.abs(P.cx - this.x) < 56 && P.y > this.y && P.y - this.y < 14 * TILE && !P.dead;
      if (below && L.lineOfSight(this.x, this.y + this.len + 4, P.cx, P.y)) { this.state = 'shake'; this.t = 0; Sound.play('creak'); }
    } else if (this.state === 'shake') {
      if (Math.random() < 0.3) G.burst(this.x + rand(-6, 6), this.y + 2, 1, { color: '#9a8070', speed: 20, life: 0.6, size: 2, vy: 60 });
      if (this.t >= DRIP_SHAKE) this.drop();
    } else if (this.state === 'fall') {
      this.vy = Math.min(this.vy + 2600 * dt, 1300); this.y += this.vy * dt;
      const tip = this.y + this.len;
      if (!P.dead && overlap(this.body(), P.hurtbox()) && P.hurt(1, this.x)) return this.shatter();
      for (const e of G.enemies) if (!e.dead && !e.isBoss && overlap(this.body(), e.hb())) { e.hurt(12, e.cx > this.x ? 1 : -1, 'spell'); return this.shatter(); }
      if (L.solidAtPx(this.x, tip) || tip > L.ph) return this.shatter();
    } else if (this.state === 'gone' && this.t >= DRIP_REGROW) { this.state = 'grow'; this.t = 0; this.grow = 0; this.x = this.hx; this.y = this.hy; }
  }
  shatter() {
    this.state = 'gone'; this.t = 0;
    Sound.play('break'); G.shake(4, 0.15);
    G.burst(this.x, this.y + this.len - 6, 14, { color: '#9a8576', speed: 220, life: 0.6, size: 3, vy: -80 });
  }
}

// ------------------------------------------------------------------ registry
const Mech = {
  init(def) {
    const L = G.level, m = { crumbles: [], movers: [], saws: [], levers: [], drips: [] };
    G.mech = m;
    for (const o of def.mech || []) {
      if (o.type === 'mover') m.movers.push(new Mover(o));
      else if (o.type === 'saw') m.saws.push(new Saw(o));
      else if (o.type === 'drip') m.drips.push(new Drip(o));
      else if (o.type === 'lever') {
        const lv = new Lever(o); m.levers.push(lv);
        if (lv.on) for (const gt of lv.gates) for (let y = gt.y; y < gt.y + gt.h; y++) for (let x = gt.x; x < gt.x + gt.w; x++) L.set(x, y, T_AIR);
      }
    }
    // each horizontal run of crumble tiles becomes one plate
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
      if (L.get(x, y) !== T_CRUMBLE || (x > 0 && L.get(x - 1, y) === T_CRUMBLE)) continue;
      let w = 1; while (L.get(x + w, y) === T_CRUMBLE) w++;
      m.crumbles.push(new Crumble(x, y, w));
    }
    P.riding = null;
  },
  // runs before the player: platforms move and carry whoever stands on them
  update(dt) {
    const m = G.mech; if (!m) return;
    for (const mv of m.movers) {
      mv.update(dt);
      if (P.riding === mv && !P.dead) {
        Mech.nudgeX(P, mv.dx);
        if (P.x + P.w > mv.x && P.x < mv.x + mv.w) P.y = mv.y - P.h; else P.riding = null;
      }
    }
    for (const c of m.crumbles) c.update(dt);
    for (const s of m.saws) s.update(dt);
    for (const l of m.levers) l.update(dt);
    for (const d of m.drips) d.update(dt);
  },
  // horizontal push with tile collision (used to carry riders)
  nudgeX(b, dx) {
    if (!dx) return;
    const L = G.level, top = Math.floor((b.y + 0.5) / TILE), bot = Math.floor((b.y + b.h - 0.5) / TILE);
    b.x += dx;
    const tx = Math.floor(dx > 0 ? (b.x + b.w) / TILE : b.x / TILE);
    for (let ty = top; ty <= bot; ty++) if (L.solid(tx, ty)) { b.x = dx > 0 ? tx * TILE - b.w - 0.001 : (tx + 1) * TILE + 0.001; break; }
  },
  // after a body has moved: lands it on a platform deck it fell onto this frame
  land(b, prevBottom) {
    b.riding = null;
    const m = G.mech;
    if (!m || b.vy < 0 || b.onGround) return;
    for (const mv of m.movers) {
      if (b.x + b.w <= mv.x + 2 || b.x >= mv.x + mv.w - 2) continue;
      const tol = Math.max(0, -mv.dy) + 2;
      if (prevBottom <= mv.y + tol && b.y + b.h >= mv.y) { b.y = mv.y - b.h; b.vy = 0; b.onGround = true; b.riding = mv; return; }
    }
  },
  // the nail met machinery: returns what the swing should do to the player
  attack(hb, p) {
    const out = { pogo: false, clank: false };
    const m = G.mech; if (!m) return out;
    for (const s of m.saws) {
      if (p.hits.has(s) || !circleRect(s.x, s.y, s.r + 4, hb)) continue;
      p.hits.add(s); s.spark = 0.25;
      if (p.atkDir === 'down') out.pogo = true; else out.clank = true;
      Sound.play('clank'); G.burst(s.x, s.y, 8, { color: '#ffe0b0', speed: 240, life: 0.3, size: 2 });
    }
    for (const l of m.levers) if (!p.hits.has(l) && overlap(hb, l.hb())) { p.hits.add(l); l.hit(); out.clank = true; }
    for (const d of m.drips) if (!p.hits.has(d) && (d.state === 'hang' || d.state === 'shake') && overlap(hb, d.body())) { p.hits.add(d); d.drop(); }
    return out;
  },
  // pieces that must never be stood on as a safe respawn point
  unsafe(tx, ty) { return G.level.get(tx, ty) === T_CRUMBLE; },
  lights(add, th) {
    const m = G.mech; if (!m) return;
    for (const mv of m.movers) add(mv.x + mv.w / 2, mv.y + 22, 150, mv.powered() ? 0.8 : 0.35, th.glow);
    for (const l of m.levers) add(l.x, l.y - 40, 110, l.on ? 0.85 : 0.5, l.on ? '#9dffc8' : '#ffb070');
    for (const s of m.saws) if (s.spark > 0) add(s.x, s.y, 120, 0.7, '#ffd8a0');
  },
};

<script>
'use strict';
// Boss fights. Every boss runs a generator "brain": each yield waits one frame,
// so an attack reads like a script (telegraph, strike, recover).

function spawnShock(x, y, dir, speed, color, life) {
  G.projs.push(new Proj({ kind: 'shock', x, y, vx: dir * speed, vy: 0, w: 46, h: 36, dmg: 1, color: color || '#c9d3de', life: life || 1.8, pierce: true, passWalls: true }));
}
function spawnRock(x, tele) {
  const y0 = 2 * TILE;
  G.projs.push(new Proj({ kind: 'rock', x, y: y0, y0, r: 17, vx: 0, vy: 0, grav: 1500, dmg: 1, tele: tele || 0.7, life: 4, color: '#8d97a3', passWalls: true }));
}
function spawnBeam(x, tele, dur, w) {
  Sound.play('tele');
  G.projs.push(new Proj({ kind: 'beam', x, y: 0, bw: w || 44, tele, dur: dur || 0.3, dmg: 1, life: 5, color: '#dff3ff', pierce: true, passWalls: true }));
}
function spawnPillar(x, y, tele, dur, h) {
  Sound.play('tele');
  G.projs.push(new Proj({ kind: 'pillar', x, y, bw: 46, ph: h || 230, tele, dur: dur || 0.4, dmg: 1, life: 5, color: '#ff9bd6', pierce: true, passWalls: true }));
}

class Boss extends Enemy {
  constructor(def, w, h, cfg) {
    super(def, w, h);
    this.hp = this.maxHp = cfg.hp; this.kb = 0; this.isBoss = true; this.bossKey = cfg.key; this.geo = cfg.geo;
    this.state = 'intro'; this.introT = 2.4; this.phase = 1; this.phases = cfg.phases || [0.5];
    this.tele = 0; this.grav = true; this.melee = null; this.alpha = 1; this.invul = true; this.co = null;
    this.spd = 1; this.face = -1; this.stunned = false; this.dt = 1 / 60; this.dyingT = 0; this.blood = cfg.blood || '#e8eef5';
    this.dmg = 1;
  }
  get floorY() { return G.floorY; }
  facePlayer() { this.face = G.player.cx > this.cx ? 1 : -1; }
  body() { return this.hb(); }
  hb() { return { x: this.x + 6, y: this.y + 4, w: this.w - 12, h: this.h - 4 }; }

      if (this.introT <= 0) { this.state = 'fight'; this.invul = false; this.co = this.brain(); G.bossBarShow = true; }
      return;
    }
    if (this.state === 'dying') {

  }
}

// ---------------------------------------------------------------- Drowned Colossus
class Drowned extends Boss {
  constructor(d) { super(d, 96, 128, { key: 'drowned', hp: 180, geo: 180, phases: [0.5], blood: '#8fe0ff' }); this.last = ''; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.7 : 0.45);
    const opts = ['charge', 'geysers', 'bubbles', 'slam'].filter(o => o !== this.last);
    this.last = pick(opts);
    yield* this[this.last]();
  }
  *charge() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.55 * this.spd);
    this.tele = 0;
    let t = 1.5, k = 0;
    while (t > 0) {
      this.vx = this.face * (this.phase >= 2 ? 560 : 470); this.doMelee(0, 20, 70, 100, 1, 0.05); t -= this.dt; k++;
      if (k % 10 === 0) G.burst(this.cx, this.y + this.h, 6, { color: '#8fe0ff', speed: 140, life: 0.5, size: 3, vy: -120 });
      if (this.hitL || this.hitR) break;
      yield;
    }
    this.vx = 0; Sound.play('slam'); G.shake(8, 0.3); this.stunned = true;
    spawnShock(this.cx - this.face * 50, this.y + this.h, -this.face, 400, '#8fe0ff');
    yield* this.wait(0.9);
    this.stunned = false;
  }
  *geysers() {
    this.tele = 1; Sound.play('roar');
    const rounds = this.phase >= 2 ? 2 : 1;
    for (let r = 0; r < rounds; r++) {
      for (let i = 0; i < 4; i++) {
        const x = clamp(G.player.cx + (i - 1.5) * 130 + rand(-30, 30), 3 * TILE, G.level.pw - 3 * TILE);
        G.projs.push(new Proj({ kind: 'pillar', x, y: this.floorY, bw: 50, ph: 300, tele: 0.8, dur: 0.45, dmg: 1, life: 5, color: '#8fe0ff', pierce: true, passWalls: true }));
      }
      Sound.play('tele');
      yield* this.wait(1.1);
    }
    this.tele = 0;
    yield* this.wait(0.3);
  }
  *bubbles() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.5 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const a0 = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx), n = this.phase >= 2 ? 7 : 5;
    for (let i = 0; i < n; i++) {
      const a = a0 + (i - (n - 1) / 2) * 0.22;
      G.projs.push(new Proj({ kind: 'orb', x: this.cx + this.face * 40, y: this.cy - 20, vx: Math.cos(a) * 210, vy: Math.sin(a) * 210, r: 12, dmg: 1, life: 3.2, color: '#8fe0ff' }));
    }
    yield* this.wait(0.8 * this.spd);
  }
  *slam() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.5 * this.spd);
    this.tele = 0;
    const T = 0.8; this.vy = -880; this.vx = clamp((G.player.cx - this.cx) / T, -430, 430); this.onGround = false;
    yield; yield;
    yield* this.until(() => this.onGround, 2);
    this.vx = 0; Sound.play('slam'); G.shake(10, 0.35);
    for (const d of [-1, 1]) spawnShock(this.cx + d * 50, this.y + this.h, d, 420, '#8fe0ff');
    for (let i = 0; i < (this.phase >= 2 ? 5 : 3); i++) spawnRock(clamp(G.player.cx + rand(-240, 240), 3 * TILE, G.level.pw - 3 * TILE), 0.7 + i * 0.1);
    yield* this.wait(0.6 * this.spd);
  }
}

// ---------------------------------------------------------------- Brood Mother
class Brood extends Boss {
  constructor(d) { super(d, 128, 80, { key: 'brood', hp: 170, geo: 170, phases: [0.5], blood: '#c8a8ff' }); this.last = ''; this.onCeil = false; }
  *chooseAttack() {
    this.facePlayer();
    yield* this.wait(this.phase === 1 ? 0.6 : 0.4);
    const opts = ['pounce', 'webShot', 'spawnBrood', 'ceilingDrop'].filter(o => o !== this.last);
    this.last = pick(opts);
    yield* this[this.last]();
  }
  *pounce() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.42 * this.spd);
    this.tele = 0;
    const T = 0.6; this.vy = -660; this.vx = clamp((G.player.cx - this.cx) / T, -520, 520); this.onGround = false;
    yield; yield;
    yield* this.until(() => this.onGround, 2);
    this.vx = 0; Sound.play('slam'); G.shake(6, 0.2);
    this.doMelee(-this.w / 2, 20, this.w, 60, 1, 0.15);
    if (this.phase >= 2) { spawnShock(this.cx - 50, this.y + this.h, -1, 360, '#c8a8ff'); spawnShock(this.cx + 50, this.y + this.h, 1, 360, '#c8a8ff'); }
    yield* this.wait(0.5 * this.spd);
  }
  *webShot() {
    this.facePlayer(); this.tele = 1; Sound.play('tele');
    yield* this.wait(0.45 * this.spd);
    this.tele = 0; Sound.play('shoot');
    const a0 = Math.atan2(G.player.cy - this.cy, G.player.cx - this.cx), n = this.phase >= 2 ? 5 : 3;
    for (let i = 0; i < n; i++) { const a = a0 + (i - (n - 1) / 2) * 0.2; G.projs.push(new Proj({ kind: 'web', x: this.cx + this.face * 50, y: this.cy - 10, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, r: 10, dmg: 1, life: 2.5, color: '#e6e0ff' })); }
    yield* this.wait(0.6 * this.spd);
  }
  *spawnBrood() {
    const alive = G.enemies.filter(e => e.kind === 'brood_child' && !e.dead).length;
    if (alive >= 4) { yield* this.pounce(); return; }
    this.tele = 1; Sound.play('roar');
    yield* this.wait(0.6);
    this.tele = 0;
    for (const d of [-1, 1]) {
      const s = new Spider({ x: 0, y: 0, ground: true }); s.kind = 'brood_child'; s.geo = 0; s.hp = 8;
      s.x = this.cx + d * 50 - s.w / 2; s.y = this.y + this.h - s.h - 10; s.vx = d * 200; s.vy = -300;
      G.enemies.push(s);
    }
    yield* this.wait(0.8 * this.spd);
  }
  *ceilingDrop() {
    this.vy = -1100; this.onGround = false;
    yield; yield;
    yield* this.until(() => this.hitU || this.vy >= 0, 1.2);
    this.grav = false; this.vy = 0; this.onCeil = true; this.tele = 1; Sound.play('tele');
    let t = 0.8 * this.spd;
    while (t > 0) { this.vx = clamp((G.player.cx - this.cx) * 5, -420, 420); this.vy = -20; t -= this.dt; yield; }
    this.vx = 0; this.tele = 0; this.onCeil = false; this.grav = true; this.vy = 1100;
    yield* this.until(() => this.onGround, 2);
    Sound.play('slam'); G.shake(10, 0.35);
    for (const d of [-1, 1]) spawnShock(this.cx + d * 50, this.y + this.h, d, 400, '#c8a8ff');
    yield* this.wait(0.6 * this.spd);
  }
}

const BOSS_TYPES = { guardian: Guardian, weaver: Weaver, wraith: Wraith, king: King, spore: Sporecap, drowned: Drowned, brood: Brood };

<script>
'use strict';
// "Your images": the player can replace the drawing of the hero, any monster or any boss with a
// picture from their own device, for learning and experiments. Load an image (a single sprite or
// a whole sheet), drag a box over the part you want, and assign it to a character.
// Crops are kept only in this browser (localStorage); nothing is uploaded or shipped with the game.
const Skins = (() => {
  const KEY = 'duskwell_skins_v1', MAX = 256;
  const SLOTS = [
    ['player', 'البطل', 'Hero'],
    ['husk', 'الهيكل', 'Husk'], ['crawler', 'الزاحف', 'Crawler'], ['flyer', 'الطائر', 'Flyer'], ['hopper', 'القافز', 'Hopper'],
    ['warden', 'حارس الدرع', 'Shield Warden'], ['ram', 'النطّاح', 'Ram'], ['spitter', 'البصّاق', 'Spitter'], ['shard', 'برج البلّور', 'Crystal turret'], ['sentinel', 'الحارس', 'Sentinel'],
    ['diver', 'البعوضة', 'Diver'], ['spider', 'العنكبوت', 'Spider'], ['shroom', 'الفطر الماشي', 'Shroom'], ['jelly', 'قنديل البحر', 'Jelly'],
    ['boss_guardian', 'زعيم: الحارس الحجري', 'Boss: Stone Guardian'], ['boss_spore', 'زعيم: أم الفطر', 'Boss: Sporecap'],
    ['boss_weaver', 'زعيم: حائكة الأشواك', 'Boss: Thorn Weaver'], ['boss_drowned', 'زعيم: العملاق الغريق', 'Boss: Drowned Giant'],
    ['boss_wraith', 'زعيم: شبح البلّور', 'Boss: Crystal Wraith'], ['boss_brood', 'زعيم: أم الحضنة', 'Boss: Brood Mother'],
    ['boss_king', 'زعيم: الملك المجوّف', 'Boss: Hollow King'],
  ];
  const imgs = {};          // slot -> HTMLImageElement
  let data = {};            // slot -> data URL
  try { data = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { data = {}; }
  for (const k in data) { const im = new Image(); im.src = data[k]; imgs[k] = im; }
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
  };
  const ar = () => LANG.cur === 'ar';
  const T = (a, e) => (ar() ? a : e);

  // ---------------------------------------------------------------- drawing hooks
  function get(slot) { const im = imgs[slot]; return im && im.complete && im.naturalWidth ? im : null; }
  // fits the picture to a body box (a little larger, feet on the box bottom), facing and hit flash
  function draw(g, im, box, face, flash, scale) {
    const k = scale || 1.35, bw = box.w * k, bh = box.h * k;
    const s = Math.min(bw / im.naturalWidth, bh / im.naturalHeight) * 1.0, w = im.naturalWidth * s, h = im.naturalHeight * s;
    const cx = box.x + box.w / 2, by = box.y + box.h + 2;
    g.save(); g.translate(cx, by); if (face < 0) g.scale(-1, 1);
    if (flash > 0) g.filter = 'brightness(2.6)';
    g.drawImage(im, -w / 2, -h, w, h);
    g.restore();
  }

  // ---------------------------------------------------------------- the panel
  let root = null, sheet = null, sel = null, cur = 'player', drag = null, view = null;
  function css() {
    if (document.getElementById('skin-css')) return;
    const st = document.createElement('style'); st.id = 'skin-css';
    st.textContent = `
#skins{position:fixed;inset:0;z-index:50;background:rgba(4,6,12,.94);color:#e6eefa;font:500 14px/1.5 "Cairo",sans-serif;display:flex;flex-direction:column;padding:12px 16px;gap:10px;overflow:auto;touch-action:auto;user-select:none}
#skins h2{margin:0;font-size:20px}#skins p{margin:0;opacity:.75;font-size:13px}
#skins .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#skins button,#skins label.btn{background:#1b2436;color:#e6eefa;border:1px solid #3b4a66;border-radius:8px;padding:6px 12px;font:600 13px "Cairo",sans-serif;cursor:pointer}
#skins button.on{background:#36cfc2;color:#05070d;border-color:#36cfc2}
#skins .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
#skins .slot{display:flex;align-items:center;gap:6px;background:#111827;border:1px solid #2a3550;border-radius:8px;padding:4px 6px;cursor:pointer}
#skins .slot.on{border-color:#36cfc2;box-shadow:0 0 0 1px #36cfc2 inset}
#skins .slot img,#skins .slot i{width:34px;height:34px;object-fit:contain;flex:none;background:#05070d;border-radius:6px}
#skins .slot span{flex:1;min-width:0;font-size:12px}
#skins .slot b{font-size:11px;color:#ff9a8a;padding:0 4px}
#skins canvas{max-width:100%;background:repeating-conic-gradient(#1a2030 0 25%,#121722 0 50%) 0 0/20px 20px;border-radius:6px;cursor:crosshair;touch-action:none}
#skins input[type=file]{display:none}`;
    document.head.appendChild(st);
  }
  function open(onClose) {
    css();
    root = document.createElement('div'); root.id = 'skins'; root.dir = ar() ? 'rtl' : 'ltr';
    root.innerHTML = `<div class="row" style="justify-content:space-between"><h2>${T('صورك الخاصة', 'Your images')}</h2><button data-x="close">${T('رجوع إلى اللعبة', 'Back to the game')}</button></div>
<p>${T('حمّل صورة من جهازك (صورة واحدة أو لوحة فيها صور كثيرة)، اختر الشخصية، ثم اسحب مربعاً فوق الجزء الذي تريده. الصور تبقى في متصفحك على جهازك فقط ولا تُرفع إلى أي مكان.', 'Load a picture from your device (one sprite or a whole sheet), pick a character, then drag a box over the part you want. Pictures stay in this browser on your device and are never uploaded.')}</p>
<div class="row"><label class="btn">${T('تحميل صورة…', 'Load a picture…')}<input type="file" accept="image/*"></label><button data-x="whole">${T('استعمل الصورة كاملة', 'Use the whole picture')}</button><button data-x="clear">${T('حذف كل الصور', 'Remove all')}</button></div>
<div class="slots"></div><canvas width="10" height="10"></canvas>`;
    document.body.appendChild(root);
    const q = s => root.querySelector(s);
    q('[data-x=close]').onclick = () => { close(); if (onClose) onClose(); };
    q('[data-x=clear]').onclick = () => { for (const k of Object.keys(data)) remove(k); renderSlots(); };
    q('[data-x=whole]').onclick = () => { if (sheet) assign(cur, 0, 0, sheet.naturalWidth, sheet.naturalHeight); };
    q('input[type=file]').onchange = e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { const im = new Image(); im.onload = () => { sheet = im; sel = null; paint(); }; im.src = r.result; };
      r.readAsDataURL(f);
    };
    const cv = q('canvas');
    const pos = ev => { const b = cv.getBoundingClientRect(); return { x: (ev.clientX - b.left) * cv.width / b.width, y: (ev.clientY - b.top) * cv.height / b.height }; };
    cv.addEventListener('pointerdown', ev => { if (!sheet) return; cv.setPointerCapture(ev.pointerId); drag = pos(ev); sel = { x: drag.x, y: drag.y, w: 0, h: 0 }; paint(); });
    cv.addEventListener('pointermove', ev => { if (!drag) return; const p = pos(ev); sel = { x: Math.min(drag.x, p.x), y: Math.min(drag.y, p.y), w: Math.abs(p.x - drag.x), h: Math.abs(p.y - drag.y) }; paint(); });
    cv.addEventListener('pointerup', () => {
      if (!drag) return; drag = null;
      if (sel && sel.w > 4 && sel.h > 4) assign(cur, sel.x / view.s, sel.y / view.s, sel.w / view.s, sel.h / view.s);
    });
    // the game must not steal keys while the panel is open
    root.addEventListener('keydown', e => e.stopPropagation());
    renderSlots(); paint();
  }
  function close() { if (root) root.remove(); root = null; }
  function renderSlots() {
    if (!root) return;
    const box = root.querySelector('.slots'); box.innerHTML = '';
    for (const [k, a, e] of SLOTS) {
      const d = document.createElement('div'); d.className = 'slot' + (k === cur ? ' on' : '');
      d.innerHTML = (data[k] ? `<img src="${data[k]}" alt="">` : '<i></i>') + `<span>${T(a, e)}</span>` + (data[k] ? '<b title="x">✕</b>' : '');
      d.onclick = ev => { if (ev.target.tagName === 'B') { remove(k); } else cur = k; renderSlots(); };
      box.appendChild(d);
    }
  }
  function paint() {
    if (!root) return;
    const cv = root.querySelector('canvas'), g = cv.getContext('2d');
    if (!sheet) { cv.width = 600; cv.height = 120; g.fillStyle = '#9db5d6'; g.font = '16px Cairo, sans-serif'; g.textAlign = 'center'; g.fillText(T('حمّل صورة لتبدأ', 'Load a picture to begin'), 300, 64); return; }
    const s = Math.min(1, 1100 / sheet.naturalWidth);
    view = { s }; cv.width = Math.round(sheet.naturalWidth * s); cv.height = Math.round(sheet.naturalHeight * s);
    g.drawImage(sheet, 0, 0, cv.width, cv.height);
    if (sel) { g.strokeStyle = '#36cfc2'; g.lineWidth = 2; g.setLineDash([6, 4]); g.strokeRect(sel.x, sel.y, sel.w, sel.h); g.fillStyle = 'rgba(54,207,194,0.15)'; g.fillRect(sel.x, sel.y, sel.w, sel.h); }
  }
  // crops the chosen box (downscaled to at most MAX px) and stores it for the slot
  function assign(slot, x, y, w, h) {
    const k = Math.min(1, MAX / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    c.getContext('2d').drawImage(sheet, x, y, w, h, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/png');
    data[slot] = url; const im = new Image(); im.src = url; imgs[slot] = im;
    if (!save()) G.toastMsg(T('لا توجد مساحة كافية في المتصفح لحفظ الصورة.', 'Not enough browser storage to keep this picture.'), 3);
    renderSlots();
  }
  function remove(slot) { delete data[slot]; delete imgs[slot]; save(); }
  return { get, draw, open, close, isOpen: () => !!root };
})();

</script>
<script>
'use strict';
// Charms: small relics the Wanderer wears on the cloak. Each one costs notches. The notches grow
// with the seals of the guardians and with the merchant. Wearing more than the notches allow
// "overcharms" the Wanderer: every wound then costs double. Charms can be changed only while
// resting on a bench. The effects themselves are read by the Player and the Geo pickups through
// Charms.has(id); this file holds the list, the notch rules and the save data.
const Charms = (() => {
  const BASE_NOTCHES = 3;
  const DEFS = {
    reach:      { cost: 1, color: '#cfe6ff', ar: 'نصل طويل', en: 'Long Edge', dAr: 'ضربتك تمتد أبعد بثلث.', dEn: 'Your strike reaches a third further.' },
    swift:      { cost: 2, color: '#bfe8ff', ar: 'ضربة الريح', en: 'Gale Strike', dAr: 'تضرب أسرع بكثير.', dEn: 'You strike much faster.' },
    siphon:     { cost: 2, color: '#a9d4ff', ar: 'ماصّة الروح', en: 'Soul Siphon', dAr: 'كل ضربة تملأ روحاً أكثر.', dEn: 'Every strike gathers more soul.' },
    focus:      { cost: 3, color: '#ffe9a0', ar: 'تركيز سريع', en: 'Swift Focus', dAr: 'تشفي جراحك أسرع.', dEn: 'You heal much faster.' },
    deep:       { cost: 4, color: '#ffd070', ar: 'تركيز عميق', en: 'Deep Focus', dAr: 'الشفاء أبطأ لكنه يشفي قناعين دفعة واحدة.', dEn: 'Healing is slower but mends two masks at once.' },
    thorn:      { cost: 1, color: '#b6ef6a', ar: 'عباءة الشوك', en: 'Thorn Mantle', dAr: 'عندما تُصاب تنفجر الأشواك وتؤذي من حولك.', dEn: 'When you are hurt, thorns burst out and wound those around you.' },
    boots:      { cost: 1, color: '#9dff9a', ar: 'حذاء الريح', en: 'Wind Boots', dAr: 'تجري أسرع.', dEn: 'You run faster.' },
    dashmaster: { cost: 2, color: '#ff9c5a', ar: 'سيّد الاندفاع', en: 'Dash Master', dAr: 'تندفع من جديد بعد وقت أقصر.', dEn: 'You can dash again much sooner.' },
    mage:       { cost: 3, color: '#c8a8ff', ar: 'حجر الساحر', en: 'Mage Stone', dAr: 'تعاويذك تؤذي أكثر بنسبة أربعين بالمئة.', dEn: 'Your spells hurt forty percent more.' },
    spirit:     { cost: 1, color: '#ff9bd6', ar: 'صدى الألم', en: 'Pain Echo', dAr: 'جروحك تملأ روحك.', dEn: 'Your wounds gather soul.' },
    magnet:     { cost: 1, color: '#ffe9a0', ar: 'مغناطيس الجيو', en: 'Geo Magnet', dAr: 'ينجذب الجيو إليك من بعيد.', dEn: 'Geo drifts toward you from afar.' },
    thrift:     { cost: 2, color: '#8fe0ff', ar: 'اقتصاد الروح', en: 'Soul Thrift', dAr: 'التعاويذ والشفاء يكلّفون روحاً أقل.', dEn: 'Spells and healing cost less soul.' },
    fury:       { cost: 2, color: '#ff6a5a', ar: 'غضب الأخير', en: 'Last Fury', dAr: 'حين يبقى لك قناع واحد تصير ضربتك أقوى بكثير.', dEn: 'With a single mask left, your strike hits far harder.' },
    shell:      { cost: 2, color: '#d8c8a0', ar: 'درع الصدفة', en: 'Shell Ward', dAr: 'بعد الراحة على المقعد تصدّ أول إصابة.', dEn: 'After resting on a bench, it turns aside the first wound.' },
  };
  const ORDER = Object.keys(DEFS);

  let owned = {}, worn = [], shell = false;

  const name = id => DEFS[id][LANG.cur === 'ar' ? 'ar' : 'en'];
  const desc = id => DEFS[id][LANG.cur === 'ar' ? 'dAr' : 'dEn'];
  const has = id => worn.indexOf(id) >= 0;
  const used = () => worn.reduce((s, id) => s + DEFS[id].cost, 0);
  // three to begin with, one more for every two guardians' seals, and up to two from the merchant
  const notches = () => BASE_NOTCHES + Math.floor(sealCount() / 2) + (G.flags.buy_notch1 ? 1 : 0) + (G.flags.buy_notch2 ? 1 : 0);
  const over = () => used() > notches();
  const ownedList = () => ORDER.filter(id => owned[id]);

  function give(id) {
    if (!DEFS[id] || owned[id]) return false;
    owned[id] = true; return true;
  }
  // Wear or remove a charm. Returns 'on', 'over' (worn, but now overcharmed), 'off', 'full' (already
  // overcharmed, so nothing more fits) or 'none' (not owned).
  function toggle(id) {
    if (!owned[id]) return 'none';
    const i = worn.indexOf(id);
    if (i >= 0) { worn.splice(i, 1); return 'off'; }
    if (used() > notches()) return 'full';
    worn.push(id);
    return used() > notches() ? 'over' : 'on';
  }

  // Shell Ward: armed by resting, spent by the next wound.
  function rest() { shell = has('shell'); }
  function absorb() {
    if (!shell || !has('shell')) return false;
    shell = false; return true;
  }

  function reset() { owned = {}; worn = []; shell = false; }
  function save() { return { o: ORDER.filter(id => owned[id]), w: worn.slice() }; }
  function load(d) {
    reset();
    if (!d) return;
    for (const id of d.o || []) if (DEFS[id]) owned[id] = true;
    for (const id of d.w || []) if (owned[id] && worn.indexOf(id) < 0) worn.push(id);
  }

})();

<script>
'use strict';
// Game state, rooms, camera, menus, HUD and the main loop.
const STEP = 1 / 60;
const SAVE_KEY = 'duskwell_save_v1';
const AREA_COLORS = { hushvale: '#ffd98a', crossroads: '#9cc4ff', mossgrove: '#9dff9a', crystal: '#ff9bd6', throne: '#e6f0ff', spore: '#ffb070', aqueduct: '#8fe0ff', webbed: '#c8a8ff', rustworks: '#ff9c5a' };

const G = {
  state: 'title', canvas: null, g: null, k: 1, time: 0, deaths: 0, t: 0,
  level: null, player: new Player(), enemies: [], projs: [], geos: [], items: [], parts: [], fx: [],
  benches: [], npcs: [], signs: [], gates: [], cam: { x: 0, y: 0 }, camV: { x: 0, y: 0 }, shakeT: 0, shakeA: 0, hitstopT: 0, slowmo: 0, flash: 0,
  flags: {}, visited: {}, shade: null, bench: null, arena: null, boss: null, bossBarShow: false, floorY: 0,
  fadeA: 0, trans: null, afterTrans: 'play', doorLock: false, dialog: null, shop: null, banner: null, toast: null,
  areaBanner: null, menuSel: 0, menu: 'main', confirmNew: false, mapPulse: 0, tileCanvas: null, tileScale: 0, tileRoom: '',
  geoPulse: 0, ending: null, deathText: 0, lastArea: '', charmSel: 0, charmNote: null, shopTop: 0, stations: [], look: 0, lookT: 0, lookDir: 0,

const P = G.player;

// ---------------------------------------------------------------- effects API used by entities
G.burst = function (x, y, n, o) {
  o = o || {};
  for (let i = 0; i < n; i++) {
    if (G.parts.length > 900) break;
    const a = rand(0, Math.PI * 2), sp = (o.speed || 120) * rand(0.3, 1);
    G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (o.vy || 0), life: (o.life || 0.5) * rand(0.6, 1), t: 0, size: (o.size || 3) * rand(0.6, 1.2), color: o.color || '#fff', grav: o.grav == null ? 300 : o.grav });
  }

G.shake = function (a, t) { if (a >= G.shakeA || G.shakeT <= 0) { G.shakeA = a; } G.shakeT = Math.max(G.shakeT, t); };

  let n = 0;
  while (total >= 25 && n < 12) { G.geos.push(new Geo(x - 6, y - 6, 25)); total -= 25; n++; }
  while (total >= 5 && n < 16) { G.geos.push(new Geo(x - 4, y - 4, 5)); total -= 5; n++; }

G.breakTile = function (tx, ty) {

  Sound.play('break'); G.shake(3, 0.12);

// ---------------------------------------------------------------- saving
function saveGame() {

    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v: 1, room: G.bench.room, maxHp: P.maxHp, ab: P.ab, geo: P.geo, nail: P.nail, soulGain: P.soulGain, flags: G.flags,
      shade: G.shade, visited: G.visited, time: G.time, deaths: G.deaths, charms: Charms.save(),
    }));

}
function readSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); return s && s.v === 1 && WORLD.rooms[s.room] ? s : null; } catch (e) { return null; }
}
G.hasSave = readSave() !== null;

// ---------------------------------------------------------------- rooms
function enterRoom(id, spawn) {
  const def = WORLD.rooms[id];
  const L = new Level(def);
  G.level = L;
  G.enemies = []; G.projs = []; G.geos = []; G.items = []; G.fx = []; G.parts = [];
  G.benches = def.benches.map(b => ({ x: b.x, y: b.y, px: b.x * TILE + 16, py: (b.y + 1) * TILE, room: id }));
  G.npcs = def.npcs.map(n => ({ type: n.type, px: n.x * TILE + 16, py: (n.y + 1) * TILE }));
  G.stations = def.stations.map(t => ({ px: t.x * TILE + 16, py: (t.y + 1) * TILE, room: id }));
  G.signs = def.signs.map(s => ({ text: s.text, px: s.x * TILE + 16, py: (s.y + 1) * TILE }));
  G.gates = []; G.arena = null; G.boss = null; G.bossBarShow = false; G.doorLock = true;

  for (const e of def.enemies) { const en = new ENEMY_TYPES[e.type](e); en.kind = e.type; G.enemies.push(en); }

  if (G.shade && G.shade.room === id) {
    const s = new ShadeEnemy({ x: 0, y: 0 }, G.shade.geo); s.kind = 'shade';
    s.x = G.shade.x - s.w / 2; s.y = G.shade.y - s.h / 2; s.home = { x: G.shade.x, y: G.shade.y };
    G.enemies.push(s);
  }

    const a = def.arena;
    G.arena = { def: a, state: G.flags[a.flag] ? 'won' : 'idle' };
    if (G.arena.state === 'idle') { for (const gt of a.gates) if (gt.close === 'always') closeGate(gt, true); }
    else for (const r of [a.reward, a.reward2]) if (r && !G.flags[r.id]) G.items.push(new Item(r));
    let fy = a.spawn.y; while (fy < L.h - 1 && !L.solid(a.spawn.x, fy)) fy++;

    P.place(b.px, b.py, 1); P.sit(b); G.bench = { room: id };
  } else if (spawn.door) {
    const d = def.doors.find(d => d.id === spawn.door);
    const cx = (d.x + d.w / 2) * TILE;
    let fx, fy, face = 1, vy = 0;
    if (d.x === 0) { fx = 2.5 * TILE; fy = (d.y + d.h) * TILE; face = 1; }
    else if (d.x + d.w === L.w) { fx = L.pw - 2.5 * TILE; fy = (d.y + d.h) * TILE; face = -1; }
    else if (d.y === 0) { fx = cx; fy = (d.y + d.h + 2.5) * TILE; face = pick([-1, 1]); }
    else { fx = cx; fy = d.y * TILE; vy = -900; }
    const keep = { hp: P.hp, soul: P.soul };
    P.place(fx, fy, face); P.vy = vy; P.hp = keep.hp; P.soul = keep.soul;
  } else if (spawn.station && G.stations.length) {
    P.place(G.stations[0].px, G.stations[0].py, 1);

  G.tileCanvas = null;
}

G.fadeTo = function (fn, out, hold, inn) {

};
G.onBossDying = function (b) { G.bossBarShow = true; };
G.onBossDeath = function (b) {

  if (a.def.ending) { G.ending = { t: 0 }; G.fadeTo(() => { G.state = 'ending'; G.afterTrans = 'ending'; Sound.setTheme('title'); }, 2.2, 0.4, 1.5); saveGame(); }
};

function startGame(useSave) {

  G.look = 0; G.lookT = 0; G.lookDir = 0;
  G.flags = {}; G.visited = {}; G.shade = null; G.time = 0; G.deaths = 0; G.lastArea = ''; G.ending = null; Charms.reset();
  let room = WORLD.startRoom, spawn = { pos: { x: WORLD.startPos.x * TILE + 16, y: (WORLD.startPos.y + 1) * TILE } };
  const s = useSave ? readSave() : null;
  if (s) {

}

// ---------------------------------------------------------------- interaction
function nearest(list, px, range) {
  let best = null, bd = range;
  for (const o of list) { const d = Math.abs(o.px - P.cx); if (d < bd && Math.abs(o.py - (P.y + P.h)) < 60) { best = o; bd = d; } }
  return best;
}
function interact() {
  const b = nearest(G.benches, P.cx, 54);
  if (b) { P.sit(b); G.bench = { room: G.level.id }; Sound.play('bench'); saveGame(); G.hasSave = true; G.toastMsg(tr('saved'), 1.6); G.burst(b.px, b.py - 40, 16, { color: '#cfe6ff', speed: 90, life: 0.9, size: 3, grav: -90 }); return true; }
  const stn = nearest(G.stations, P.cx, 54);
  if (stn) {
    if (!stationLit(stn.room)) {
      G.flags['station_' + stn.room] = true; Sound.play('bench'); G.toastMsg(tr('stationLit'), 2.2);
      G.burst(stn.px, stn.py - 70, 18, { color: '#ffd98a', speed: 110, life: 0.9, size: 3, grav: -100 }); G.ring(stn.px, stn.py - 70, '#ffd98a', 0.4);
      return true;
    }
    if (!stationList().length) { G.toastMsg(tr('stationNone'), 2.6); return true; }
    G.state = 'travel'; G.menuSel = 0; Sound.play('select'); return true;
  }
  const n = nearest(G.npcs, P.cx, 70);
  if (n) {
    if (n.type === 'elder') G.dialog = { lines: [tr('elder1'), tr('elder2'), tr('elder3')], i: 0, t: 0 };
    else G.dialog = { lines: [tr('merchant')], i: 0, t: 0, shop: true };
    G.state = 'dialog'; Sound.play('select'); return true;
  }
  const s = nearest(G.signs, P.cx, 54);
  if (s) {
    const text = s.text === 'seal_gate' ? tr('seal_gate') + '  ' + sealCount() + ' / ' + SEAL_FLAGS.length : tr(s.text);
    G.dialog = { lines: [text], i: 0, t: 0 }; G.state = 'dialog'; Sound.play('select'); return true;
  }
  return false;
}

const stationLit = room => room === 'town' || !!G.flags['station_' + room];
function stationList() {

    .map(id => ({ id, name: tr('area_' + WORLD.rooms[id].area), color: AREA_COLORS[WORLD.rooms[id].area] }));

// ---------------------------------------------------------------- update
function updateParticles(dt) {
  for (const p of G.parts) { p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.life);
}

function updatePlay(dt) {
  const L = G.level;
  if (Input.pressed('pause')) { G.state = 'pause'; G.menu = 'pause'; G.menuSel = 0; Input.consume('pause'); return; }
  if (Input.pressed('map')) { G.state = 'map'; Input.consume('map'); Sound.play('select'); return; }
  G.time += dt;
  Mech.update(dt);
  P.update(dt);
  if (G.state !== 'play') return;           // hurt() may have changed it
  // a cracked soul vessel: while the shade still holds your Geo, only two thirds of the soul can be kept
  P.maxSoul = G.shade ? 66 : 99; if (P.soul > P.maxSoul) P.soul = P.maxSoul;
  // looking up or down: hold the key while standing still and the camera drifts that way
  const still = P.onGround && !P.sitting && Input.axisX() === 0 && P.atkT <= 0 && P.hurtT <= 0 && !P.diving && !P.sd && !P.wailT;
  const iy = still ? Input.axisY() : 0;
  if (iy !== 0 && iy === G.lookDir) G.lookT += dt; else { G.lookDir = iy; G.lookT = 0; }
  G.look = lerp(G.look, G.lookT > 0.55 ? G.lookDir * 130 : 0, 1 - Math.exp(-dt * 5));
  if (Input.pressed('up') && !P.sitting && P.onGround && P.hurtT <= 0 && P.atkT <= 0) interact();
  if (Input.pressed('mute')) Sound.toggle();

  for (const e of G.enemies) e.update(dt);
  for (const p of G.projs) p.update(dt);
  for (const c of G.geos) c.update(dt);
  for (const it of G.items) it.update(dt);
  G.enemies = G.enemies.filter(e => !e.dead); G.projs = G.projs.filter(p => !p.dead);
  G.geos = G.geos.filter(c => !c.dead); G.items = G.items.filter(i => !i.dead);

  // contact damage
  if (!P.dead) {
    const hb = P.hurtbox();
    for (const e of G.enemies) {
      if (e.dead || e.ghostly || e.dmg <= 0) continue;
      if (e.isBoss && (e.state === 'intro' || e.state === 'dying')) continue;
      if (e.alpha !== undefined && e.alpha < 0.6) continue;
      if (overlap(hb, e.body())) P.hurt(e.dmg, e.cx);
    }
  }

  // arena trigger
  const a = G.arena;
  if (a && a.state === 'idle' && ((a.def.triggerDir || 1) > 0 ? P.cx > a.def.trigger * TILE : P.cx < a.def.trigger * TILE) && P.onGround) {
    a.state = 'fight';
    for (const gt of a.def.gates) if (gt.close === 'start') closeGate(gt);
    const B = BOSS_TYPES[a.def.boss];
    const boss = new B({ x: a.def.spawn.x, y: a.def.spawn.y });
    G.enemies.push(boss); G.boss = boss;
    Sound.boss(true, a.def.boss === 'king');
  }

  // doors
  if (G.doorLock) {
    let inside = false;
    for (const d of L.def.doors) if (P.cx > d.x * TILE && P.cx < (d.x + d.w) * TILE && P.cy > d.y * TILE && P.cy < (d.y + d.h) * TILE) inside = true;
    if (!inside) G.doorLock = false;
  } else if (!P.dead) {
    for (const d of L.def.doors) {
      if (P.cx > d.x * TILE && P.cx < (d.x + d.w) * TILE && P.cy > d.y * TILE && P.cy < (d.y + d.h) * TILE) {
        if (L.get(d.x, d.y) === T_GATE) continue;
        const target = { room: d.to, door: d.toDoor };
        G.fadeTo(() => enterRoom(target.room, { door: target.door }), 0.22, 0.05, 0.28);
        break;
      }
    }
  }
  // keep inside the room
  if (P.x < 0) { P.x = 0; P.vx = Math.max(0, P.vx); }
  if (P.x + P.w > L.pw) { P.x = L.pw - P.w; P.vx = Math.min(0, P.vx); }
  if (P.y > L.ph + 200) { P.spikeHurt(); }

  // camera: SmoothDamp toward the target, then clamp to the room bounds
  const c = cameraTarget();
  [G.cam.x, G.camV.x] = smoothDamp(G.cam.x, c.x, G.camV.x, 0.16, dt);
  [G.cam.y, G.camV.y] = smoothDamp(G.cam.y, c.y, G.camV.y, P.vy > 400 ? 0.1 : 0.24, dt);
  const b = cameraBounds();
  G.cam.x = clamp(G.cam.x, b.x0, b.x1); G.cam.y = clamp(G.cam.y, b.y0, b.y1);
}

function updateTrans(dt) {
  const tr_ = G.trans; tr_.t += dt;
  if (tr_.t < tr_.out) G.fadeA = tr_.t / tr_.out;
  else {
    if (!tr_.done) { tr_.done = true; G.fadeA = 1; tr_.fn(); }
    const u = tr_.t - tr_.out - tr_.hold;
    if (u < 0) G.fadeA = 1;
    else if (u < tr_.inn) G.fadeA = 1 - u / tr_.inn;
    else { G.fadeA = 0; G.trans = null; if (G.state === 'trans') G.state = G.afterTrans || 'play'; }
  }
}

function updateDying(dt) {
  G.dyingT += dt;
  if (G.dyingT > 1.3 && !G.trans) {
    G.fadeTo(() => {
      G.deaths++;
      const dropGeo = P.geo;
      G.shade = dropGeo > 0 ? { room: G.level.id, x: clamp(P.cx, 40, G.level.pw - 40), y: clamp(P.cy, 40, G.level.ph - 60), geo: dropGeo } : (G.shade && G.shade.room ? G.shade : null);
      if (dropGeo > 0) P.geo = 0;
      P.hp = P.maxHp; P.soul = 0; P.dead = false;
      enterRoom(G.bench.room, { bench: true });
      G.deathText = 3;
      G.afterTrans = 'play';
    }, 0.6, 0.6, 0.6);
  }
}

function menuNav(n) {
  if (Input.pressed('up')) { G.menuSel = (G.menuSel + n - 1) % n; Sound.play('select'); }
  if (Input.pressed('down')) { G.menuSel = (G.menuSel + 1) % n; Sound.play('select'); }

}

}

}
function updatePause() {

}

function updateDialog(dt) {

function updateShop() {
  const list = shopList(), n = list.length + 1, VIS = 6;
  if (Input.pressed('pause') || Input.pressed('map') || Input.pressed('attack')) { G.state = 'play'; Input.consume('pause'); return; }

    P.geo -= it.price; G.flags[it.id] = true; it.apply(); Sound.play('ability');
    G.toastMsg(shopName(it), 1.8);

  G.menuSel = Math.min(G.menuSel, n - 1);

const CHARM_COLS = 7;
function updateCharms(dt) {
  const list = Charms.ownedList(), n = list.length;
  if (G.charmNote) { G.charmNote.t += dt; if (G.charmNote.t > 3) G.charmNote = null; }
  if (Input.pressed('pause') || Input.pressed('map') || Input.pressed('attack')) { G.state = 'pause'; Input.consume('pause'); Input.consume('map'); Sound.play('select'); return; }

    else {

function updateBanner(dt) {
  const b = G.banner; b.t += dt;
  if (b.t > 1.4 && (Input.pressed('confirm') || Input.pressed('attack')) || b.t > 7) { G.banner = null; G.state = 'play'; }
}

function update(dt) {
  G.t += dt;
  if (G.toast) { G.toast.t += dt; if (G.toast.t > G.toast.dur) G.toast = null; }
  if (G.areaBanner) { G.areaBanner.t += dt; if (G.areaBanner.t > 3.6) G.areaBanner = null; }
  if (G.deathText > 0) G.deathText -= dt;
  G.flash = Math.max(0, G.flash - dt * 1.8);
  G.geoPulse = Math.max(0, G.geoPulse - dt * 3);
  if (G.shakeT > 0) G.shakeT -= dt;
  switch (G.state) {
    case 'title': updateTitle(); break;
    case 'trans': updateTrans(dt); break;
    case 'pause': updatePause(); break;
    case 'map': if (Input.pressed('map') || Input.pressed('pause') || Input.pressed('confirm') || Input.pressed('attack')) { G.state = 'play'; Input.consume('map'); Input.consume('pause'); } break;
    case 'dialog': updateDialog(dt); updateParticles(dt); break;
    case 'shop': updateShop(); break;
    case 'charms': updateCharms(dt); break;
    case 'travel': updateTravel(); break;
    case 'banner': updateBanner(dt); updateParticles(dt); for (const it of G.items) it.t += dt; break;
    case 'ending': G.ending.t += dt; if (G.ending.t > 4 && Input.pressed('confirm')) { G.fadeTo(() => { G.state = 'title'; G.afterTrans = 'title'; G.hasSave = readSave() !== null; G.menuSel = 0; Sound.setTheme('title'); }, 0.6, 0.2, 0.6); } break;
    case 'dying': {
      let d = dt; if (G.slowmo > 0) { G.slowmo -= dt; d = dt * 0.35; }
      updateDying(dt); updateParticles(d); break;
    }
    case 'play': {
      if (G.hitstopT > 0) { G.hitstopT -= dt; break; }
      let d = dt;
      if (G.slowmo > 0) { G.slowmo -= dt; d = dt * 0.35; }
      updatePlay(d); updateParticles(d);
      break;
    }
  }
  if (G.state === 'trans' && G.trans) { /* keep particles alive during fades */ updateParticles(dt * 0.3); }
}

// ---------------------------------------------------------------- drawing
function wrapText(g, text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function textShadow(g, s, x, y, color, blur) { g.save(); g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = blur || 6; g.fillStyle = color || '#fff'; g.fillText(s, x, y); g.restore(); }
function setDir(g) { g.direction = LANG.cur === 'ar' ? 'rtl' : 'ltr'; }

function drawMaskIcon(g, x, y, full, pulse) {
  g.save(); g.translate(x, y);
  const s = 1 + pulse * 0.25;
  g.scale(s, s);
  poly(g, [-11, -12, 11, -12, 13, 2, 0, 15, -13, 2]);
  if (full) { fs(g, '#f3f8fb', INK, 2.5); g.fillStyle = INK; ellipse(g, -4.5, -2, 2, 3.4); g.fill(); ellipse(g, 4.5, -2, 2, 3.4); g.fill(); }
  else { fs(g, 'rgba(10,14,22,0.6)', 'rgba(200,215,235,0.55)', 2); }
  g.restore();
}
function drawHUD(g) {
  // soul orb
  const ox = 52, oy = 54, r = 30, soul = P.soul / 99;
  g.save();
  glow(g, ox, oy, 60, '#cfe8ff', P.soul >= P.spellCost() ? 0.25 + 0.15 * Math.sin(G.t * 5) : 0.08);
  g.beginPath(); g.arc(ox, oy, r, 0, 7); g.fillStyle = 'rgba(8,12,22,0.75)'; g.fill();
  g.save(); g.beginPath(); g.arc(ox, oy, r - 2, 0, 7); g.clip();
  const ly = oy + r - 2 * (r - 2) * soul;
  g.fillStyle = P.soul >= P.spellCost() ? '#e4f4ff' : '#9bb8d6';
  g.beginPath(); g.moveTo(ox - r, oy + r);
  for (let x = -r; x <= r; x += 4) g.lineTo(ox + x, ly + Math.sin(G.t * 4 + x * 0.25) * 2);
  g.lineTo(ox + r, oy + r); g.closePath(); g.fill();
  if (P.maxSoul < 99) {            // the cracked top third
    const cy = oy + r - 2 * (r - 2) * (P.maxSoul / 99);
    g.fillStyle = 'rgba(6,8,14,0.82)'; g.fillRect(ox - r, oy - r, 2 * r, cy - (oy - r));
    g.strokeStyle = 'rgba(160,175,200,0.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(ox - r + 3, cy); g.lineTo(ox - 8, cy + 3); g.lineTo(ox + 2, cy - 2); g.lineTo(ox + r - 3, cy + 2); g.stroke();
  }
  g.restore();
  g.lineWidth = 3; g.strokeStyle = '#e9f1f8'; g.beginPath(); g.arc(ox, oy, r, 0, 7); g.stroke();
  g.lineWidth = 2; g.strokeStyle = INK; g.beginPath(); g.arc(ox, oy, r + 2, 0, 7); g.stroke();
  g.restore();
  // masks
  for (let i = 0; i < P.maxHp; i++) drawMaskIcon(g, 108 + i * 32, 50, i < P.hp, (P.invuln > 1.1 || (P.focusT === 0 && G.flash > 0.2)) ? 0.2 : 0);

// light sources in screen space for the darkness map
function collectLights(cx, cy, skipPlayer) {
  const L = G.level, th = THEMES[L.def.theme], out = [];
  const add = (x, y, r, a, c) => out.push({ x: x - cx, y: y - cy, r, a, c });
  if (!P.dead && !skipPlayer) add(P.cx, P.cy - 6, P.focusT > 0 ? 300 : 250, 1, '#cfe8ff');
  if (P.wailT > 0) add(P.cx, (P.wailTop + P.y) / 2, 320, 1, '#dff3ff');
  for (const d of L.def.deco) {
    if (d.type === 'lamp') add(d.x * TILE + 16, d.y * TILE - 70, 280, 0.95, th.glow);
    else if (d.type === 'light') add(d.x * TILE + 16, d.y * TILE + 16, d.r || 220, d.a || 0.8, d.c || th.glow);
  }
  for (const b of G.benches) add(b.px, b.py - 40, 200, 0.85, '#ffe2a8');
  for (const n of G.npcs) add(n.px, n.py - 40, 170, 0.8, '#ffd98a');
  for (const s of G.stations) if (stationLit(s.room)) add(s.px, s.py - 70, 230, 0.9, '#ffd98a');
  for (const it of G.items) add(it.x, it.y, 190, 0.9, '#e6f3ff');
  for (const c of G.geos) add(c.x, c.y, 50, 0.5, null);
  for (const p of G.projs) {
    if (p.kind === 'beam' || p.kind === 'pillar') { if (p.t >= p.tele) add(p.x, p.kind === 'beam' ? cy + VH / 2 : p.y - 100, 260, 0.9, p.color); }
    else add(p.x, p.y, p.friendly ? 190 : 110, p.friendly ? 1 : 0.75, p.color);
  }
  for (const e of G.enemies) {
    if (e.isBoss) add(e.cx, e.cy, e.bossKey === 'wraith' || e.bossKey === 'king' ? 300 : 230, 0.7, e.blood);
    else if (e.glowR) add(e.cx, e.cy, e.glowR, 0.7, e.blood);
  }
  for (const d of L.def.doors) add((d.x + d.w / 2) * TILE, (d.y + d.h / 2) * TILE, 170, 0.55, th.fog);
  Mech.lights(add, th);
  return out;
}

    else { g.fillStyle = 'rgba(200,215,240,0.6)'; g.fillText(P.sitting ? tr('charmsHint') : tr('charmsBench'), VW / 2, 494); }

}

function drawBanner(g) {

function draw() {
  const g = G.g;
  g.setTransform(G.k, 0, 0, G.k, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH);
  g.lineJoin = 'round';
  switch (G.state) {
    case 'title': drawTitle(g); break;
    case 'ending': drawEnding(g); break;
    default:
      if (G.level) {
        drawWorld(g); drawHUD(g);
        if (G.state === 'map') drawMap(g);
        if (G.state === 'pause') { g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, VW, VH); setDir(g); g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = font(40, '700'); textShadow(g, tr('pause'), VW / 2, 110, '#eef5ff'); drawMenu(g, pauseItems(), G.menuSel, 168, 44); g.font = font(15, '500'); g.fillStyle = 'rgba(200,215,240,0.6)'; g.fillText(tr('ctl'), VW / 2, VH - 24); }
        if (G.state === 'dialog') drawDialog(g);
        if (G.state === 'shop') drawShop(g);
        if (G.state === 'charms') drawCharms(g);
        if (G.state === 'travel') drawTravel(g);
        if (G.state === 'banner') drawBanner(g);
      }
  }
  if (G.fadeA > 0) { g.fillStyle = 'rgba(0,0,0,' + G.fadeA + ')'; g.fillRect(0, 0, VW, VH); }
}

// ---------------------------------------------------------------- boot
function resize() {
  const c = G.canvas, r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.max(320, Math.round(r.width * dpr)); c.height = Math.round(c.width * 9 / 16);
  G.k = c.width / VW; G.tileCanvas = null;
}
function boot() {
  G.canvas = document.getElementById('c'); G.g = G.canvas.getContext('2d');
  Input.init(); resize(); window.addEventListener('resize', resize); refreshTouchLabels();
  const wake = () => Sound.init();
  // tapping the picture focuses it for the keyboard and works as "confirm" on menus
  G.canvas.addEventListener('pointerdown', () => {
    try { G.canvas.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    if (G.state === 'title' || G.state === 'ending' || G.state === 'dialog' || G.state === 'banner') window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Enter' })), window.dispatchEvent(new KeyboardEvent('keyup', { code: 'Enter' }));
  });
  window.addEventListener('keydown', wake); window.addEventListener('pointerdown', wake);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') { G.state = 'pause'; G.menu = 'pause'; G.menuSel = 0; } });
  Art.ambientInit();
  let last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    Input.poll();
    let guard = 0;
    if (G.manual) { acc = 0; draw(); return; }
    while (acc >= STEP && guard++ < 6) { update(STEP); acc -= STEP; Input.endStep(); }
    if (guard >= 6) acc = 0;
    draw();
  }
  requestAnimationFrame(frame);
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fontsReady.then(() => { /* canvas text uses fallbacks until web fonts arrive, which is fine */ });
}
// the Comet Heart button only appears once the ability is found
function syncAbilityButtons() {
  const b = document.querySelector('[data-act=superdash]');
  if (b) b.hidden = !P.ab.superdash;
}
function refreshTouchLabels() {
  const caps = { cast: ['روح', 'Soul'], dash: ['اندفاع', 'Dash'], attack: ['ضرب', 'Strike'], jump: ['قفز', 'Jump'], superdash: ['شهاب', 'Comet'] };
  document.querySelectorAll('[data-cap]').forEach(el => { el.textContent = caps[el.dataset.cap][LANG.cur === 'ar' ? 0 : 1]; });
}
window.refreshTouchLabels = refreshTouchLabels;
window.DW = { G, P, Charms, enterRoom, startGame, WORLD, Input, step(n) { for (let i = 0; i < n; i++) { update(STEP); Input.endStep(); } } };
window.addEventListener('DOMContentLoaded', boot);
