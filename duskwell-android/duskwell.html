<style>
/* Layout: one 16:9 stage centred on a near-black page; touch pads appear only on coarse pointers. */
:root{
  color-scheme:dark;
  --ink:#05070d;        /* page ground */
  --stage:#000;         /* canvas letterbox */
  --pad:rgba(214,228,248,.14);
  --pad-on:rgba(214,228,248,.42);
  --pad-line:rgba(214,228,248,.5);
  --text:#e6eefa;
  --reserve:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);overflow:hidden;font-family:"Cairo","Segoe UI",Tahoma,sans-serif}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding-inline:8px}
#wrap{position:relative;line-height:0}
canvas{display:block;background:var(--stage);border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,.6);
  width:min(100vw - 16px,(100dvh - 16px - var(--reserve))*16/9);aspect-ratio:16/9;height:auto;outline:none}
#touch{display:none;width:100%;max-width:760px;justify-content:space-between;align-items:flex-end;direction:ltr;padding-bottom:4px}
.cluster{display:grid;gap:8px;align-items:center;justify-items:center}
.dpad{grid-template-columns:repeat(3,auto);grid-template-areas:". up ." "left down right"}
.face{grid-template-columns:repeat(3,auto);grid-template-areas:". cast superdash" "dash attack jump"}
.b{width:58px;height:58px;border-radius:50%;background:var(--pad);border:2px solid var(--pad-line);color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 18px/1 "Cairo",sans-serif;backdrop-filter:blur(2px)}
.b small{font:600 10px/1 "Cairo",sans-serif;opacity:.75;margin-top:2px}
.b.on{background:var(--pad-on);transform:scale(.94)}
.b.big{width:66px;height:66px}
[data-act=up]{grid-area:up}[data-act=down]{grid-area:down}[data-act=left]{grid-area:left}[data-act=right]{grid-area:right}
[data-act=jump]{grid-area:jump}[data-act=attack]{grid-area:attack}[data-act=dash]{grid-area:dash}[data-act=cast]{grid-area:cast}[data-act=superdash]{grid-area:superdash}
.b[hidden]{display:none}
.sys{display:flex;gap:10px;align-self:flex-start}
.sys .b{width:40px;height:40px;font-size:13px}
@media (pointer:coarse){#touch{display:flex}:root{--reserve:170px}}
@media (pointer:coarse) and (orientation:landscape){
  :root{--reserve:0px}
  #app{padding:0;gap:0}
  #touch{position:fixed;inset:0;max-width:none;padding:0 calc(14px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));pointer-events:none}
  #touch .b{pointer-events:auto}
  #touch .sys{position:absolute;top:8px;right:calc(14px + env(safe-area-inset-right))}
  .b{width:52px;height:52px}.b.big{width:60px;height:60px}
}
@media (pointer:coarse) and (orientation:portrait){
  :root{--reserve:250px}
  #touch{flex-wrap:wrap;row-gap:12px;padding-inline:4px}
  #touch .sys{order:-1;width:100%;justify-content:flex-end}
  .cluster{gap:7px}
  .b{width:46px;height:46px}.b.big{width:52px;height:52px}
}
@media (prefers-reduced-motion:reduce){.b{backdrop-filter:none}}
</style>

'use strict';
// Shared constants and small helpers.
const TILE = 32, VW = 960, VH = 540;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const sign = v => (v < 0 ? -1 : v > 0 ? 1 : 0);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// deterministic pseudo random (for tile art and background shapes)
function hash2(x, y, s) {
  let h = (x * 374761393 + y * 668265263 + (s || 0) * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) {
  const n = parseInt(h.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(c1, c2, t) {
  const a = hexToRgb(c1), b = hexToRgb(c2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], t)) + ',' + Math.round(lerp(a[1], b[1], t)) + ',' + Math.round(lerp(a[2], b[2], t)) + ')';
}
function rgba(h, a) {
  const c = hexToRgb(h);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
// Unity's Mathf.SmoothDamp: critically damped spring toward target. Returns [value, velocity].
function smoothDamp(cur, target, vel, smoothTime, dt) {
  smoothTime = Math.max(0.0001, smoothTime);
  const omega = 2 / smoothTime, x = omega * dt;
  const exp = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
  const change = cur - target;
  const temp = (vel + omega * change) * dt;
  let nv = (vel - omega * temp) * exp;
  let out = target + (change + temp) * exp;
  if ((target - cur > 0) === (out > target)) { out = target; nv = 0; }
  return [out, nv];
}

<script>
'use strict';
// Keyboard, touch buttons and gamepad, merged into one set of named actions.
// pressed() is an edge that stays true until a simulation step consumes it.
const Input = (() => {
  const KEYS = {
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    KeyZ: 'jump', Space: 'jump', KeyK: 'jump',
    KeyX: 'attack', KeyJ: 'attack',
    KeyC: 'dash', KeyL: 'dash', ShiftLeft: 'dash', ShiftRight: 'dash',
    KeyF: 'cast', KeyV: 'cast', KeyI: 'cast',
    KeyQ: 'superdash', KeyE: 'superdash', KeyU: 'superdash',
    Tab: 'map', KeyM: 'map',
    Escape: 'pause', KeyP: 'pause',
    Enter: 'confirm', KeyN: 'mute',
  };
  const held = {}, touch = {}, pad = {}, padPrev = {}, q = {}, rel = {};
  const heldCount = {};

  function setHeld(src, act, on) {
    const was = isHeld(act);
    src[act] = on;
    const now = isHeld(act);
    if (now && !was) q[act] = true;
    if (!now && was) rel[act] = true;
  }
  function isHeld(a) { return !!(held[a] || touch[a] || pad[a]); }

  window.addEventListener('keydown', e => {
    const a = KEYS[e.code];
    if (!a) return;
    if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    heldCount[e.code] = true;
    setHeld(held, a, true);
    // Z and Space also confirm menus
    if (a === 'jump') q.confirm = true;
  });
  window.addEventListener('keyup', e => {
    const a = KEYS[e.code];
    if (!a) return;
    heldCount[e.code] = false;
    // another key bound to the same action may still be down
    const still = Object.keys(KEYS).some(c => KEYS[c] === a && heldCount[c]);
    if (!still) setHeld(held, a, false);
  });
  window.addEventListener('blur', () => {
    for (const k in held) held[k] = false;
    for (const k in touch) touch[k] = false;
    for (const k in heldCount) heldCount[k] = false;
  });

  // on-screen buttons: each pointer remembers which button it pressed
  function bindTouch() {
    const buttons = document.querySelectorAll('[data-act]');
    const owner = new Map();
    buttons.forEach(b => {
      const act = b.dataset.act;
      const down = e => {
        e.preventDefault();
        owner.set(e.pointerId, b);
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        b.classList.add('on');
        setHeld(touch, act, true);
        if (act === 'jump') q.confirm = true;
      };
      const up = e => {
        if (owner.get(e.pointerId) !== b) return;
        owner.delete(e.pointerId);
        b.classList.remove('on');
        setHeld(touch, act, false);
      };
      b.addEventListener('pointerdown', down);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
      b.addEventListener('contextmenu', e => e.preventDefault());
    });
  }

  function pollPad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const g = pads && Array.from(pads).find(p => p && p.connected);
    const now = {};
    if (g) {
      const b = i => !!(g.buttons[i] && g.buttons[i].pressed);
      const ax = g.axes[0] || 0, ay = g.axes[1] || 0;
      now.left = ax < -0.4 || b(14); now.right = ax > 0.4 || b(15);
      now.up = ay < -0.5 || b(12); now.down = ay > 0.5 || b(13);
      now.jump = b(0); now.attack = b(2) || b(1); now.dash = b(5) || b(7); now.superdash = b(4);
      now.cast = b(3) || b(6); now.map = b(8); now.pause = b(9); now.confirm = b(0);
    }
    for (const a of ['left', 'right', 'up', 'down', 'jump', 'attack', 'dash', 'superdash', 'cast', 'map', 'pause', 'confirm']) {
      const was = !!padPrev[a], on = !!now[a];
      if (a !== 'confirm') setHeld(pad, a, on);
      else if (on && !was) q.confirm = true;
      padPrev[a] = on;
    }
  }

  return {
    init() { bindTouch(); },
    poll: pollPad,
    down: a => isHeld(a),
    pressed: a => !!q[a],
    released: a => !!rel[a],
    consume: a => { q[a] = false; },
    endStep() { for (const k in q) q[k] = false; for (const k in rel) rel[k] = false; },
    axisX: () => (isHeld('right') ? 1 : 0) - (isHeld('left') ? 1 : 0),
    axisY: () => (isHeld('down') ? 1 : 0) - (isHeld('up') ? 1 : 0),
  };
})();

<script>
'use strict';
// Sound effects are synthesised on the fly. The score is recorded: one looping MP3 per area plus
// two boss themes (audio/music, rendered by tools/music from the original compositions), streamed
// through Web Audio so the loops are sample-exact. If those files cannot be fetched (for instance
// when index.html is opened straight from disk) the score falls back to a plain <audio> element,
// and failing that to the old procedural ambience, so the game always has music.
const Sound = (() => {
  let ctx = null, master = null, sfxBus = null, musicBus = null, fileBus = null, delay = null;
  let muted = false, theme = 'title', bossMode = false, bossTrack = 'boss', timer = null, step = 0;
  try { muted = localStorage.getItem('duskwell_mute') === '1'; } catch (e) { /* ignore */ }

  const ROOT = { foundry: 77.8, title: 73.4, town: 110, cave: 73.4, moss: 87.3, crystal: 82.4, throne: 65.4, spore: 92.5, aqueduct: 69.3, webbed: 61.7 };
  const SCALE = [0, 3, 5, 7, 10, 12, 15, 17];
  const TRACK = { title: 'title', town: 'hushvale', cave: 'crossroads', moss: 'moss', crystal: 'crystal', throne: 'throne', spore: 'spore', aqueduct: 'aqueduct', webbed: 'webbed', foundry: 'foundry' };
  const MUSIC_DIR = 'audio/music/', SFX_DIR = 'audio/sfx/';
  const AMB_THEME = { town: 'forest', moss: 'forest' };           // area -> ambience loop (audio/sfx/amb_*.mp3)
  const MUSIC_VOL = 0.8;
  const MASTER_VOL = 0.55;

  function init() {
    if (ctx) { if (ctx.state === 'suspended' && !document.hidden) ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = muted ? 0 : MASTER_VOL; master.connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.32; musicBus.connect(master);
    fileBus = ctx.createGain(); fileBus.gain.value = MUSIC_VOL; fileBus.connect(master);
    // soft echo for the procedural fallback score
    delay = ctx.createDelay(1.5); delay.delayTime.value = 0.42;
    const fb = ctx.createGain(); fb.gain.value = 0.42;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(musicBus);
    // no music while the tab or the Android app is in the background
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.hidden) { ctx.suspend(); if (Score.el) Score.el.pause(); }
      else { ctx.resume(); if (Score.el && !muted) Score.el.play().catch(() => {}); }
    });
    Score.start();
    Rec.start();
  }

  // ------------------------------------------------------------------ recorded score
  const Score = {
    mode: 'pending',      // 'buffer' (Web Audio), 'element' (<audio>), 'synth' (procedural)
    meta: null,           // music.json: { name: { loop: seconds, gain } }
    cache: new Map(),     // decoded AudioBuffers, most recently used last
    loading: new Map(),   // name -> Promise<AudioBuffer>
    want: null, cur: null, el: null, fadeTimer: null,
    start() {
      const viaFile = location.protocol === 'file:';
      const metaReq = viaFile ? Promise.reject(new Error('file')) : fetch(MUSIC_DIR + 'music.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      metaReq.then(m => { this.meta = m; this.mode = 'buffer'; this.update(); })
        .catch(() => { this.mode = 'element'; this.update(); });
    },
    desired() { return bossMode ? bossTrack : (TRACK[theme] || 'crossroads'); },
    update() {
      if (!ctx || this.mode === 'pending') return;
      if (this.mode === 'synth') { if (!timer) startMusic(); return; }
      const name = this.desired();
      if (name === this.want) return;
      this.want = name;
      if (this.mode === 'buffer') {
        this.load(name).then(buf => { if (this.want === name) this.playBuffer(name, buf); })
          .catch(() => { if (this.want === name) { this.mode = 'element'; this.want = null; this.update(); } });
      } else this.playElement(name);
    },
    load(name) {
      if (this.cache.has(name)) { const b = this.cache.get(name); this.cache.delete(name); this.cache.set(name, b); return Promise.resolve(b); }
      if (this.loading.has(name)) return this.loading.get(name);
      const p = fetch(MUSIC_DIR + name + '.mp3')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(data => new Promise((ok, fail) => { const q = ctx.decodeAudioData(data, ok, fail); if (q && q.catch) q.catch(fail); }))
        .then(buf => {
          this.loading.delete(name);
          this.cache.set(name, buf);
          // a decoded minute of stereo audio is ~20 MB, so keep only the newest two pieces
          while (this.cache.size > 2) this.cache.delete(this.cache.keys().next().value);
          return buf;
        }, err => { this.loading.delete(name); throw err; });
      this.loading.set(name, p);
      return p;
    },
    prefetch(name) { if (ctx && this.mode === 'buffer' && name !== this.want) this.load(name).catch(() => {}); },
    fadeOut(cur, sec) {
      if (!cur) return;
      const t = ctx.currentTime;
      cur.gain.gain.cancelScheduledValues(t);
      cur.gain.gain.setValueAtTime(cur.gain.gain.value, t);
      cur.gain.gain.linearRampToValueAtTime(0, t + sec);
      try { cur.src.stop(t + sec + 0.05); } catch (e) { /* already stopped */ }
    },
    playBuffer(name, buf) {
      const info = (this.meta && this.meta[name]) || { loop: buf.duration, gain: 1 };
      // Decoders that keep the MP3 encoder delay give ~1105 extra samples up front.
      const lead = buf.duration - info.loop > 0.02 ? 1105 / 44100 : 0;
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      src.loopStart = lead; src.loopEnd = Math.min(buf.duration, lead + info.loop);
      const gain = ctx.createGain();
      src.connect(gain); gain.connect(fileBus);
      const fade = bossMode ? 0.35 : 1.8;
      const t = ctx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(info.gain, t + fade);
      src.start(t, lead);
      this.fadeOut(this.cur, bossMode ? 0.5 : 2.2);
      this.cur = { name, src, gain };
    },
    playElement(name) {
      const old = this.el;
      const el = new Audio(MUSIC_DIR + name + '.mp3');
      el.loop = true; el.volume = 0; el.muted = muted;
      el.addEventListener('error', () => { if (this.el === el) { this.el = null; this.mode = 'synth'; this.update(); } });
      this.el = el;
      el.play().catch(() => {});
      const target = MUSIC_VOL * MASTER_VOL * ((this.meta && this.meta[name] && this.meta[name].gain) || 0.8);
      const t0 = performance.now(), ms = bossMode ? 400 : 1800;
      clearInterval(this.fadeTimer);
      this.fadeTimer = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / ms);
        el.volume = target * k;
        if (old) old.volume = Math.max(0, old.volume * (1 - k));
        if (k >= 1) { clearInterval(this.fadeTimer); if (old) old.pause(); }
      }, 50);
    },
  };

  // ------------------------------------------------------------------ recorded effects and ambience
  // CC0 recordings (see CREDITS.md) that replace or sit under the synthesised effects. They need
  // fetch(), so from file:// the game keeps its synthesised sounds.
  const Rec = {
    meta: null, bufs: new Map(), last: {}, amb: null, ambWant: null, ambBus: null,
    start() {
      if (location.protocol === 'file:') return;
      this.ambBus = ctx.createGain(); this.ambBus.gain.value = 0.5; this.ambBus.connect(master);
      fetch(SFX_DIR + 'sfx.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(m => {
        this.meta = m;
        const names = new Set();
        for (const e of Object.values(m.events)) e.files.forEach(f => names.add(f));
        Promise.all([...names].map(n => this.decode(n))).then(() => this.ambience());
      }).catch(() => { this.meta = null; });
    },
    decode(name) {
      return fetch(SFX_DIR + name + '.mp3').then(r => r.arrayBuffer())
        .then(d => new Promise((ok, fail) => { const q = ctx.decodeAudioData(d, ok, fail); if (q && q.catch) q.catch(fail); }))
        .then(b => { this.bufs.set(name, b); return b; }, () => null);
    },
    // returns 'replace', 'layer' or false (nothing recorded for this event)
    play(name) {
      const e = this.meta && this.meta.events[name];
      if (!e || !ctx || muted) return false;
      const picks = e.files.filter(f => this.bufs.has(f));
      if (!picks.length) return false;
      const now = ctx.currentTime;
      if (now - (this.last[name] || 0) < 0.04) return e.layer ? 'layer' : 'replace';        // no machine-gun stacking
      this.last[name] = now;
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = this.bufs.get(pick(picks));
      src.playbackRate.value = e.rate[0] + Math.random() * (e.rate[1] - e.rate[0]);
      g.gain.value = e.gain;
      src.connect(g); g.connect(sfxBus); src.start();
      return e.layer ? 'layer' : 'replace';
    },
    ambience() {
      if (!this.meta || !ctx) return;
      const name = AMB_THEME[theme] || null;
      if (name === this.ambWant) return;
      this.ambWant = name;
      const t = ctx.currentTime;
      if (this.amb) {
        const old = this.amb; this.amb = null;
        old.gain.gain.cancelScheduledValues(t); old.gain.gain.setValueAtTime(old.gain.gain.value, t); old.gain.gain.linearRampToValueAtTime(0, t + 2.5);
        try { old.src.stop(t + 2.6); } catch (e) { /* stopped */ }
      }
      const a = name && this.meta.ambience[name]; if (!a) return;
      const load = this.bufs.has(a.file) ? Promise.resolve(this.bufs.get(a.file)) : this.decode(a.file);
      load.then(buf => {
        if (!buf || this.ambWant !== name) return;
        const src = ctx.createBufferSource(), g = ctx.createGain();
        src.buffer = buf; src.loop = true; src.connect(g); g.connect(this.ambBus);
        const now = ctx.currentTime;
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(a.gain, now + 3);
        src.start(); this.amb = { src, gain: g };
      });
    },
  };

  function tone(o) {
    if (!ctx || muted) return;
    const t0 = ctx.currentTime + (o.delay || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t0 + o.d);
    const v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + (o.a || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    osc.connect(g); g.connect(o.bus || sfxBus);
    osc.start(t0); osc.stop(t0 + o.d + 0.05);
  }
  let noiseBuf = null;
  function noise(o) {
    if (!ctx || muted) return;
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = ctx.currentTime + (o.delay || 0);
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1000, t0);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.d);
    f.Q.value = o.q || 0.7;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.v == null ? 0.2 : o.v, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.d);
    src.connect(f); f.connect(g); g.connect(sfxBus);
    src.start(t0, Math.random()); src.stop(t0 + o.d + 0.05);
  }

  const FX = {
    jump() { tone({ f: 300, f2: 560, d: 0.13, v: 0.12 }); },
    djump() { tone({ f: 420, f2: 900, d: 0.16, v: 0.13, type: 'triangle' }); noise({ f: 3000, f2: 800, d: 0.12, v: 0.06, type: 'highpass' }); },
    land() { noise({ f: 500, d: 0.09, v: 0.16 }); },
    slash() { noise({ f: 2600, f2: 900, d: 0.11, v: 0.13, type: 'bandpass', q: 1.2 }); },
    hit() { noise({ f: 3000, f2: 600, d: 0.12, v: 0.22 }); tone({ f: 180, f2: 60, d: 0.14, v: 0.16, type: 'square' }); },
    pogo() { tone({ f: 500, f2: 800, d: 0.08, v: 0.1, type: 'triangle' }); },
    enemyDie() { noise({ f: 1500, f2: 200, d: 0.3, v: 0.22 }); tone({ f: 220, f2: 50, d: 0.3, v: 0.16, type: 'sawtooth' }); },
    hurt() { tone({ f: 220, f2: 70, d: 0.35, v: 0.3, type: 'sawtooth' }); noise({ f: 900, d: 0.3, v: 0.2 }); },
    dash() { noise({ f: 600, f2: 4000, d: 0.2, v: 0.14, type: 'bandpass', q: 0.8 }); },
    geo() { tone({ f: 1400, d: 0.07, v: 0.09, type: 'triangle' }); tone({ f: 1900, d: 0.09, v: 0.09, type: 'triangle', delay: 0.05 }); },
    heal() { [0, 1, 2, 3].forEach(i => tone({ f: 420 * Math.pow(1.26, i), d: 0.3, v: 0.12, delay: i * 0.07 })); },
    focus() { tone({ f: 200, f2: 400, d: 0.9, v: 0.05, a: 0.4 }); },
    cast() { noise({ f: 900, f2: 3000, d: 0.25, v: 0.15, type: 'bandpass' }); tone({ f: 300, f2: 700, d: 0.25, v: 0.12, type: 'sawtooth' }); },
    bench() { [0, 4, 7, 12].forEach((s, i) => tone({ f: 220 * Math.pow(2, s / 12), d: 1.2, v: 0.1, delay: i * 0.12 })); },
    door() { noise({ f: 200, d: 0.5, v: 0.3 }); tone({ f: 70, f2: 40, d: 0.5, v: 0.25, type: 'square' }); },
    roar() { tone({ f: 90, f2: 45, d: 1.3, v: 0.3, type: 'sawtooth' }); tone({ f: 93, f2: 48, d: 1.3, v: 0.22, type: 'square' }); noise({ f: 400, d: 1.2, v: 0.2 }); },
    bossHit() { noise({ f: 2000, f2: 400, d: 0.1, v: 0.18 }); tone({ f: 120, f2: 70, d: 0.12, v: 0.15, type: 'square' }); },
    bossDie() { tone({ f: 150, f2: 30, d: 2.2, v: 0.35, type: 'sawtooth' }); noise({ f: 1800, f2: 100, d: 2, v: 0.3 }); },
    slam() { noise({ f: 300, f2: 60, d: 0.4, v: 0.4 }); tone({ f: 70, f2: 35, d: 0.4, v: 0.3, type: 'square' }); },
    shoot() { tone({ f: 700, f2: 300, d: 0.12, v: 0.1, type: 'square' }); },
    tele() { tone({ f: 200, f2: 500, d: 0.4, v: 0.08, type: 'triangle' }); },
    ability() { [0, 4, 7, 11, 14, 19].forEach((s, i) => tone({ f: 261 * Math.pow(2, s / 12), d: 1.6, v: 0.11, delay: i * 0.13, type: 'triangle' })); },
    select() { tone({ f: 600, d: 0.06, v: 0.08, type: 'triangle' }); },
    confirm() { tone({ f: 500, d: 0.06, v: 0.1, type: 'triangle' }); tone({ f: 750, d: 0.1, v: 0.1, type: 'triangle', delay: 0.06 }); },
    break() { noise({ f: 900, f2: 200, d: 0.3, v: 0.3 }); },
    bounce() { tone({ f: 180, f2: 620, d: 0.22, v: 0.16, type: 'triangle' }); noise({ f: 400, d: 0.1, v: 0.1 }); },
    shade() { tone({ f: 150, f2: 100, d: 0.6, v: 0.15, type: 'triangle' }); },
    creak() { tone({ f: 120, f2: 90, d: 0.4, v: 0.1, type: 'sawtooth' }); noise({ f: 700, f2: 300, d: 0.35, v: 0.08, type: 'bandpass', q: 3 }); },
    clunk() { tone({ f: 90, f2: 55, d: 0.18, v: 0.16, type: 'square' }); noise({ f: 500, d: 0.12, v: 0.1 }); },
    clank() { tone({ f: 1250, f2: 900, d: 0.18, v: 0.08, type: 'triangle' }); tone({ f: 1870, d: 0.12, v: 0.05, type: 'sine' }); noise({ f: 4000, d: 0.06, v: 0.08, type: 'highpass' }); },
    lever() { tone({ f: 180, f2: 120, d: 0.25, v: 0.16, type: 'square' }); tone({ f: 900, d: 0.12, v: 0.08, type: 'triangle', delay: 0.12 }); noise({ f: 800, d: 0.2, v: 0.12 }); },
    sdcharge() { tone({ f: 160, f2: 640, d: 0.8, v: 0.08, a: 0.2, type: 'sawtooth' }); noise({ f: 600, f2: 2400, d: 0.8, v: 0.05, type: 'bandpass', q: 2 }); },
    sdready() { tone({ f: 1320, d: 0.25, v: 0.1, type: 'triangle' }); tone({ f: 1980, d: 0.3, v: 0.06, type: 'sine', delay: 0.04 }); },
    sdlaunch() { noise({ f: 300, f2: 3000, d: 0.35, v: 0.22, type: 'bandpass', q: 0.8 }); tone({ f: 110, f2: 55, d: 0.4, v: 0.22, type: 'sawtooth' }); },
  };

  function note(semi, dur, vol, oct) {
    const root = ROOT[theme] || 110;
    tone({ f: root * Math.pow(2, (semi + (oct || 0) * 12) / 12), d: dur, v: vol, a: 0.03, bus: musicBus, type: 'sine' });
    tone({ f: root * Math.pow(2, (semi + (oct || 0) * 12) / 12), d: dur, v: vol * 0.5, a: 0.03, bus: delay, type: 'sine' });
  }
  function startMusic() {
    if (timer) clearInterval(timer);
    timer = setInterval(() => {
      if (!ctx || muted || ctx.state !== 'running' || Score.mode !== 'synth') return;
      step++;
      if (bossMode) {
        // pulse and tense line
        note(0, 0.25, 0.22, 0);
        if (step % 2 === 0) note(SCALE[(step >> 1) % 5], 0.2, 0.09, 2);
        if (step % 8 === 0) note(7, 1.2, 0.1, 1);
        return;
      }
      if (step % 10 === 1) {
        // slow pad chord
        [0, 7, 12].forEach((s, i) => tone({ f: (ROOT[theme] || 110) * Math.pow(2, s / 12), d: 6, v: 0.12, a: 2, bus: musicBus, type: 'triangle', delay: i * 0.05 }));
      }
      if (step % 3 === 0 && Math.random() < 0.7) note(SCALE[randi(0, SCALE.length - 1)], 1.8, 0.09, 1);
    }, bossMode ? 260 : 820);
  }

  return {
    init,
    play(name) { try { const r = Rec.play(name); if (r !== 'replace' && FX[name]) FX[name](); } catch (e) { /* audio must never crash the game */ } },
    // area theme: 'title', 'town', 'cave', 'moss', ... (see TRACK)
    setTheme(t) { if (t !== theme) { theme = t; Score.update(); Rec.ambience(); } },
    // boss music on/off; the final boss has a theme of its own
    boss(on, final) {
      const track = final ? 'king' : 'boss';
      if (bossMode === on && (!on || bossTrack === track)) return;
      bossMode = on; if (on) bossTrack = track;
      if (ctx && Score.mode === 'synth') startMusic();
      Score.update();
    },
    prefetch(final) { Score.prefetch(final ? 'king' : 'boss'); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem('duskwell_mute', muted ? '1' : '0'); } catch (e) { /* ignore */ }
      if (master) master.gain.value = muted ? 0 : MASTER_VOL;
      if (Score.el) Score.el.muted = muted;
      return !muted;
    },
    isOn: () => !muted,
    sfxState: () => ({ loaded: !!Rec.meta, buffers: Rec.bufs.size, ambience: Rec.ambWant, ambiencePlaying: !!Rec.amb }),

<script>
'use strict';
// World data: rooms are built from tile rectangles. All coordinates are in tiles, y grows downward.
// Entities are placed by the tile their feet stand in (flyers by their centre tile).
const T_AIR = 0, T_SOLID = 1, T_ONEWAY = 2, T_HAZARD = 3, T_BREAK = 4, T_GATE = 5, T_BOUNCE = 6, T_CRACK = 7, T_ACID = 8, T_CRUMBLE = 9;
// bosses whose seals open the throne gate
const SEAL_FLAGS = ['boss_guardian', 'boss_spore', 'boss_weaver', 'boss_drowned', 'boss_wraith', 'boss_brood'];

class RoomBuilder {
  constructor(id, w, h, opt) {
    this.id = id; this.w = w; this.h = h;
    this.area = opt.area; this.theme = opt.theme; this.map = opt.map;
    this.t = new Uint8Array(w * h);
    this.doors = []; this.enemies = []; this.items = []; this.npcs = []; this.benches = []; this.deco = []; this.stations = [];
    this.signs = []; this.arena = null; this.start = null; this.sealGate = null; this.mech = []; this.leverGates = [];
    this.solid(0, 0, w, 1); this.solid(0, h - 1, w, 1); this.solid(0, 0, 1, h); this.solid(w - 1, 0, 1, h);
  }
  fill(x, y, w, h, v) {
    for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
      if (i >= 0 && j >= 0 && i < this.w && j < this.h) this.t[j * this.w + i] = v;
    }
    return this;
  }
  solid(x, y, w, h) { return this.fill(x, y, w, h, T_SOLID); }
  air(x, y, w, h) { return this.fill(x, y, w, h, T_AIR); }
  plat(x, y, w) { return this.fill(x, y, w, 1, T_ONEWAY); }
  hazard(x, y, w, h) { return this.fill(x, y, w, h || 1, T_HAZARD); }
  breakable(x, y, w, h) { return this.fill(x, y, w, h, T_BREAK); }
  bounce(x, y, w) { return this.fill(x, y, w, 1, T_BOUNCE); }          // mushroom cap: launches the player
  crack(x, y, w, h) { return this.fill(x, y, w, h || 1, T_CRACK); }    // only a dive breaks it
  acid(x, y, w, h) { return this.fill(x, y, w, h || 1, T_ACID); }
  crumble(x, y, w) { return this.fill(x, y, w, 1, T_CRUMBLE); }          // gives way soon after it is stood on
  // machinery (see mechanics.js): coordinates in tiles; saws are placed by their centre
  mover(x, y, w, tx, ty, o) { this.mech.push(Object.assign({ type: 'mover', x, y, w, to: { x: tx, y: ty } }, o || {})); return this; }
  saw(x, y, o) { this.mech.push(Object.assign({ type: 'saw', x, y }, o || {})); return this; }
  drip(x, y, o) { this.mech.push(Object.assign({ type: 'drip', x, y }, o || {})); return this; }
  lever(id, x, y, gates) { this.mech.push({ type: 'lever', id, x, y, gates }); this.leverGates.push(...gates); return this; }
  door(id, x, y, w, h, to, toDoor) { this.doors.push({ id, x, y, w, h, to, toDoor }); return this; }
  enemy(type, x, y, o) { this.enemies.push(Object.assign({ type, x, y }, o || {})); return this; }
  item(id, x, y, kind, o) { this.items.push(Object.assign({ id, x, y, kind }, o || {})); return this; }
  npc(type, x, y) { this.npcs.push({ type, x, y }); return this; }
  bench(x, y) { this.benches.push({ x, y }); return this; }
  station(x, y) { this.stations.push({ x, y }); return this; }          // lantern station: fast travel between lit stations
  sign(x, y, text) { this.signs.push({ x, y, text }); return this; }
  decor(type, x, y, o) { this.deco.push(Object.assign({ type, x, y }, o || {})); return this; }
  at(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? T_SOLID : this.t[y * this.w + x]; }
  finish() {
    // doors are cut last so they always open the frame
    for (const d of this.doors) this.air(d.x, d.y, d.w, d.h);
    // lever gates may stand in a doorway, so they go in after the doors are cut
    for (const gt of this.leverGates) this.fill(gt.x, gt.y, gt.w, gt.h, T_GATE);
    return this;
  }
}

// ---------------------------------------------------------------- projectiles, pickups, props
Art.drawProj = function (g, p, t) {
  const k = p.kind;
  if (k === 'bolt') {
    const dir = sign(p.vx) || 1;
    bloom(g, p.x, p.y, 46, '#a9e6ff', 0.55);
    const tr = g.createLinearGradient(p.x, 0, p.x - dir * 90, 0); tr.addColorStop(0, 'rgba(210,244,255,0.9)'); tr.addColorStop(1, 'rgba(210,244,255,0)');
    g.fillStyle = tr; g.beginPath(); g.moveTo(p.x, p.y - 13); g.quadraticCurveTo(p.x - dir * 40, p.y - 14, p.x - dir * 90, p.y); g.quadraticCurveTo(p.x - dir * 40, p.y + 14, p.x, p.y + 13); g.fill();
    ellipse(g, p.x, p.y, 13, 10); fs(g, '#ffffff', '#7fc8ff', 2);
    g.fillStyle = INK; ellipse(g, p.x + dir * 3, p.y - 1, 1.8, 3); g.fill(); ellipse(g, p.x + dir * 8, p.y - 1, 1.8, 3); g.fill();
  } else if (k === 'glob') {
    ellipse(g, p.x, p.y, p.r + Math.sin(t * 20) * 1.2, p.r - Math.sin(t * 20)); fs(g, '#b6ef6a', INK, 2.4);
    g.fillStyle = 'rgba(255,255,255,0.6)'; ellipse(g, p.x - 2, p.y - 3, 2.5, 2); g.fill();
  } else if (k === 'shard' || k === 'thorn') {
    g.save(); g.translate(p.x, p.y); g.rotate(p.rot || Math.atan2(p.vy, p.vx));
    bloom(g, 0, 0, 22, p.color, 0.4);
    poly(g, [-12, 0, -2, -5, 14, 0, -2, 5]); fs(g, k === 'thorn' ? '#6fd04a' : '#ff9bd6', INK, 2.4); g.restore();
  } else if (k === 'needle') {
    const a = Math.atan2(p.vy, p.vx);
    g.save(); g.translate(p.x, p.y); g.rotate(a);
    g.strokeStyle = INK; g.lineWidth = 6; g.lineCap = 'round'; g.beginPath(); g.moveTo(-44, 0); g.lineTo(10, 0); g.stroke();
    g.strokeStyle = '#f6e2b0'; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-44, 0); g.lineTo(10, 0); g.stroke(); g.restore();
  } else if (k === 'orb') {
    bloom(g, p.x, p.y, 30, '#ffe8c0', 0.5);
    ellipse(g, p.x, p.y, p.r, p.r); fs(g, '#fffaf0', INK, 2.6);
  } else if (k === 'shock') {
    const dir = sign(p.vx) || 1;
    g.save(); g.translate(p.x, p.y);
    bloom(g, 0, -14, 34, p.color, 0.3);
    for (let i = -1; i <= 1; i++) {
      const h = 14 + (1 - Math.abs(i)) * 14 + Math.sin(t * 30 + i) * 3;
      poly(g, [i * 14 - 8, 0, i * 14 + dir * 4, -h, i * 14 + 8, 0]); fs(g, p.color, INK, 2.4);
    }
    g.restore();
  } else if (k === 'rock') {
    if (p.t < p.tele) {
      const a = 0.25 + 0.35 * Math.abs(Math.sin(p.t * 14));
      const gr = g.createLinearGradient(0, p.y0, 0, G.floorY); gr.addColorStop(0, 'rgba(255,90,70,0)'); gr.addColorStop(1, 'rgba(255,90,70,' + a + ')');
      g.fillStyle = gr; g.fillRect(p.x - 16, p.y0, 32, G.floorY - p.y0);
      g.save(); g.translate(p.x + Math.sin(p.t * 60) * 1.5, p.y); ellipse(g, 0, 0, 14, 12); fs(g, '#6f7a86', INK, 2.4); g.restore();
    } else {
      g.save(); g.translate(p.x, p.y); g.rotate(p.t * 3);
      poly(g, [-16, -4, -6, -16, 10, -12, 17, 2, 8, 15, -10, 13]); fs(g, '#7d8894', INK, 3.2); g.restore();
    }
  } else if (k === 'beam') {
    if (p.t < p.tele) {
      const f = p.t / p.tele, w = 2 + f * 6;
      g.fillStyle = 'rgba(255,240,210,' + (0.25 + 0.4 * f) + ')'; g.fillRect(p.x - w / 2, 0, w, G.level.ph);
    } else {
      const gr = g.createLinearGradient(p.x - p.bw / 2, 0, p.x + p.bw / 2, 0);
      gr.addColorStop(0, 'rgba(255,220,170,0)'); gr.addColorStop(0.3, 'rgba(255,252,240,0.95)'); gr.addColorStop(0.7, 'rgba(255,252,240,0.95)'); gr.addColorStop(1, 'rgba(255,220,170,0)');
      g.fillStyle = gr; g.fillRect(p.x - p.bw / 2 - 10, 0, p.bw + 20, G.level.ph);
    }

    if (p.t < p.tele) {
      const f = p.t / p.tele;
      bloom(g, p.x, p.y - 4, 40 + f * 20, '#ff9bd6', 0.3 + f * 0.4);
      g.strokeStyle = 'rgba(255,170,230,' + (0.4 + f * 0.5) + ')'; g.lineWidth = 3; g.beginPath(); g.moveTo(p.x - 24, p.y - 2); g.lineTo(p.x + 24, p.y - 2); g.stroke();

      poly(g, [p.x - 6, p.y, p.x - 6, p.y - h, p.x + 4, p.y - h * 0.75, p.x + 4, p.y]); fs(g, '#ffe0f8', null);
    }
  }
};

// ---------------------------------------------------------------- effects
Art.drawFx = function (g, f) {
  const k = f.t / f.life, a = 1 - k;
  if (f.type === 'slash') {
    g.save(); g.translate(f.x, f.y); g.globalAlpha = a; g.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      const ang = (f.dir > 0 ? 0 : Math.PI) + i * 0.5, r0 = 6 + k * 14, r1 = 22 + k * 38;
      g.strokeStyle = INK; g.lineWidth = 6 - i * i * 2; g.beginPath(); g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0); g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1); g.stroke();
      g.strokeStyle = '#fff'; g.lineWidth = 3 - i * i; g.stroke();
    }
    g.restore();
  } else if (f.type === 'ring') {
    g.save(); g.globalAlpha = a; g.strokeStyle = f.color; g.lineWidth = 4 * a + 1; ellipse(g, f.x, f.y, 10 + k * 90, (10 + k * 90) * (f.flat || 1)); g.stroke(); g.restore();
  }
};

function drawBlade(g, x, y, r, spin, hot) {

  g.fillStyle = RUST.bolt; g.beginPath(); g.arc(0, 0, r * 0.07, 0, 7); g.fill();

Art.mechFront = function (g, t, th) {
  const m = G.mech; if (!m) return;

  for (const c of m.crumbles) {

      const sh = c.state === 'shake' ? 2 + c.t * 5 : 0;
      for (let i = 0; i < c.w; i++) {
        const jx = sh ? rand(-sh, sh) : 0, jy = sh ? rand(-sh * 0.5, sh * 0.5) : 0;

      }

      g.beginPath(); g.moveTo(c.x * TILE + 8, c.y * TILE + 18); g.lineTo(c.x * TILE + 14, c.y * TILE + 30); g.moveTo((c.x + c.w) * TILE - 8, c.y * TILE + 18); g.lineTo((c.x + c.w) * TILE - 14, c.y * TILE + 30); g.stroke();

    fs(g, gr, INK, 3.5);
    g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2;
    for (let k = x + 16; k < x + w - 10; k += 20) { g.beginPath(); g.moveTo(k, y + 4); g.lineTo(k + 10, y + 14); g.moveTo(k + 10, y + 4); g.lineTo(k, y + 14); g.stroke(); }
    g.strokeStyle = 'rgba(255,220,180,0.45)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + 4, y + 2); g.lineTo(x + w - 4, y + 2); g.stroke();
    const lx = x + w / 2, fl = on ? 0.85 + 0.15 * Math.sin(t * 9 + mv.ax) : 0.25;

    if (on) bloom(g, lx, y + 30, 46 * fl, th.glow, 0.45);
    g.beginPath(); g.ellipse(lx, y + 30, 6, 7, 0, 0, 7); fs(g, on ? '#ffe0b0' : '#5a4a3a', INK, 2.5);
    // gear hubs at the ends turn with the motion
    for (const ex of [x + 10, x + w - 10]) {
      g.save(); g.translate(ex, y + 8); g.rotate((mv.x + mv.y) * 0.05);
      g.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; g.lineTo(Math.cos(a) * 7, Math.sin(a) * 7); g.lineTo(Math.cos(a + 0.39) * 5, Math.sin(a + 0.39) * 5); } g.closePath();
      fs(g, '#7a5a42', INK, 2); g.restore();

  }

  for (const l of m.levers) {
    const x = l.x, y = l.y;
    g.beginPath(); g.moveTo(x - 15, y); g.lineTo(x - 11, y - 14); g.lineTo(x + 11, y - 14); g.lineTo(x + 15, y); g.closePath(); fs(g, '#3a2a20', INK, 3);
    g.fillStyle = RUST.bolt; for (const bx of [-7, 7]) { g.beginPath(); g.arc(x + bx, y - 7, 2, 0, 7); g.fill(); }
    const a = lerp(-0.7, 0.7, l.flip), hx = x + Math.sin(a) * 34, hy = y - 12 - Math.cos(a) * 34;
    g.strokeStyle = INK; g.lineWidth = 7; g.beginPath(); g.moveTo(x, y - 12); g.lineTo(hx, hy); g.stroke();
    g.strokeStyle = '#8a8a92'; g.lineWidth = 3.5; g.stroke();
    const col = l.on ? '#9dffc8' : '#ffb070';
    bloom(g, hx, hy, 26, col, 0.45 + 0.15 * Math.sin(t * 4));
    g.beginPath(); g.arc(hx, hy, 6.5, 0, 7); fs(g, col, INK, 2.5);

  }

    g.beginPath(); g.moveTo(d.x - 11 * k + jx, d.y); g.lineTo(d.x - 6 * k + jx, d.y + len * 0.55); g.lineTo(d.x + jx, d.y + len); g.lineTo(d.x + 4 * k + jx, d.y + len * 0.6); g.lineTo(d.x + 11 * k + jx, d.y); g.closePath();
    const gr = g.createLinearGradient(d.x - 10, 0, d.x + 10, 0); gr.addColorStop(0, '#6a5244'); gr.addColorStop(0.5, '#a88a72'); gr.addColorStop(1, '#3a2a22');
    fs(g, gr, INK, 3);
    g.strokeStyle = 'rgba(255,230,200,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(d.x - 4 * k + jx, d.y + 4); g.lineTo(d.x - 1 + jx, d.y + len * 0.8); g.stroke();

  }
};

Art.drawGear = function (g, d, t, th) {
  const x = d.x * TILE + 16, y = d.y * TILE + 16, r = (d.r || 3) * TILE, teeth = Math.round(r / 9), dir = d.dir || 1;
  g.save(); g.translate(x, y); g.rotate(t * 0.25 * dir * (90 / r));
  g.beginPath();

    g.lineTo(Math.cos(a0) * r, Math.sin(a0) * r); g.lineTo(Math.cos(a0 + 0.08) * (r + 12), Math.sin(a0 + 0.08) * (r + 12));

  }
  g.closePath();
  g.globalAlpha = d.a || 0.55;
  fs(g, mix(th.far, '#000000', 0.45), 'rgba(0,0,0,0.5)', 4);
  g.fillStyle = mix(th.far, '#000000', 0.25);
  g.beginPath(); g.arc(0, 0, r * 0.72, 0, 7); g.arc(0, 0, r * 0.32, 0, 7, true); g.fill('evenodd');
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.fillStyle = mix(th.far, '#000000', 0.35); g.beginPath(); g.arc(Math.cos(a) * r * 0.52, Math.sin(a) * r * 0.52, r * 0.13, 0, 7); g.fill(); }
  g.beginPath(); g.arc(0, 0, r * 0.14, 0, 7); fs(g, mix(th.far, th.hi, 0.15), 'rgba(0,0,0,0.5)', 3);
  g.restore();

Art.drawChimney = function (g, d, t, th) {
  const x = d.x * TILE, base = d.y * TILE + TILE, h = (d.h || 8) * TILE, w = 46;
  g.fillStyle = mix(th.far, '#000000', 0.2); g.fillRect(x, base - h, w, h);

  g.fillStyle = mix(th.far, '#000000', 0.4); g.fillRect(x - 6, base - h, w + 12, 14);
  for (let i = 0; i < 4; i++) {                 // the furnace mouth glows and breathes
    const k = 0.6 + 0.4 * Math.sin(t * 2 + i + d.x);
    bloom(g, x + w / 2, base - 40, 70 * k, th.glow, 0.18);

};

<script>
'use strict';
// Pixel-art sprites (from the artist's Aseprite files, see tools/sprites) drawn with real-time 3D
// lighting. When a sheet loads, every frame gets a height map from its silhouette (a pixel stands
// out more the further it is from the edge) and a normal map from that height. Each draw then
// shades every pixel with the scene's lights: a soft key light from the front, Lambert diffuse and
// a specular glint from every nearby lamp, lantern or spell, and a cool rim light from behind. The
// lit frame is scaled up with crisp nearest-neighbour pixels. Contact shadows sit under the feet.
const Pixel = (() => {
  const SCALE = 3;
  const sheets = {};
  let lights = [], ambient = [0.5, 0.52, 0.6];
  let work = null, wg = null;                 // scratch canvas a frame is lit into

  // ---------------------------------------------------------------- loading and normal maps
  function load(name, meta) {
    const s = { meta, ready: false, frames: [], tinted: {} };
    sheets[name] = s;
    const im = new Image();
    im.onload = () => {
      const [cw, ch] = meta.cell, n = Math.round(im.width / cw);
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const g = c.getContext('2d'); g.drawImage(im, 0, 0);
      try {
        for (let i = 0; i < n; i++) s.frames.push(analyse(g.getImageData(i * cw, 0, cw, ch), cw, ch));
        s.img = im; s.ready = true;
      } catch (e) { s.frames = []; }          // pixels unreadable: the game keeps its inked drawings
    };
    im.src = meta.src;
    return s;
  }
  // height from distance to the silhouette edge (a rounded dome), normals from its slope,
  // shininess from brightness: the pale mask gleams, the cloak stays matte
  function analyse(img, w, h) {
    const d = img.data, n = w * h, dist = new Float32Array(n), MAXD = 4;
    for (let i = 0; i < n; i++) dist[i] = d[i * 4 + 3] > 0 ? MAXD : 0;
    for (let pass = 0; pass < MAXD; pass++) {
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const i = y * w + x; if (!dist[i]) continue;
        const nb = Math.min(x > 0 ? dist[i - 1] : 0, x < w - 1 ? dist[i + 1] : 0, y > 0 ? dist[i - w] : 0, y < h - 1 ? dist[i + w] : 0);
        dist[i] = Math.min(dist[i], nb + 1);
      }
    }
    const height = new Float32Array(n);
    for (let i = 0; i < n; i++) { const t = dist[i] / MAXD; height[i] = dist[i] ? (1 - (1 - t) * (1 - t)) * 3 : 0; }
    // a 3x3 blur of the height map turns the stair-stepped dome into smooth slopes
    const sm = new Float32Array(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0, c = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < w && yy < h) { sum += height[yy * w + xx]; c++; } }
      sm[y * w + x] = sum / c;
    }
    const px = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!d[i * 4 + 3]) continue;
      const hl = x > 0 ? sm[i - 1] : 0, hr = x < w - 1 ? sm[i + 1] : 0, hu = y > 0 ? sm[i - w] : 0, hd = y < h - 1 ? sm[i + w] : 0;
      let nx = (hl - hr) * 0.7, ny = (hu - hd) * 0.7, nz = 1;
      const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
      const r = d[i * 4] / 255, g = d[i * 4 + 1] / 255, b = d[i * 4 + 2] / 255;
      const lum = 0.3 * r + 0.59 * g + 0.11 * b;
      px.push({ x, y, r, g, b, a: d[i * 4 + 3] / 255, nx, ny, nz, spec: lum > 0.75 ? 0.75 : lum > 0.45 ? 0.3 : 0.08 });
    }
    return { w, h, px };
  }

  // ---------------------------------------------------------------- scene lights (world space)
  function hexRGB(c) { if (!c) return [1, 0.95, 0.85]; const v = parseInt(c.slice(1), 16); return [(v >> 16 & 255) / 255, (v >> 8 & 255) / 255, (v & 255) / 255]; }
  function setScene(list, camX, camY, theme) {
    lights = list.map(l => ({ x: l.x + camX, y: l.y + camY, r: l.r, a: l.a, c: hexRGB(l.c) }));
    const th = THEMES[theme] || THEMES.cave;
    const f = hexRGB(th.fog);
    ambient = [0.42 + f[0] * 0.14, 0.44 + f[1] * 0.14, 0.5 + f[2] * 0.14];
  }

  // ---------------------------------------------------------------- drawing
  // fx, fy: the feet centre in world space. o: { face, scale, sx, sy, flash, alpha, rot, extraLights }
  function draw(g, name, frame, fx, fy, o) {
    const s = sheets[name]; if (!s || !s.ready) return false;
    o = o || {};
    const F = s.frames[frame % s.frames.length], m = s.meta, k = o.scale || SCALE, face = o.face || 1;
    if (!work || work.width < F.w || work.height < F.h) { work = document.createElement('canvas'); work.width = 64; work.height = 64; wg = work.getContext('2d'); }
    const img = wg.createImageData(F.w, F.h), out = img.data;
    // the strongest few lights at this sprite
    const near = [];
    for (const l of lights.concat(o.extraLights || [])) {
      const dd = Math.hypot(l.x - fx, l.y - (fy - 20));
      if (dd < l.r * 1.4) near.push({ l, w: l.a * (1 - dd / (l.r * 1.4)) });
    }
    near.sort((a, b) => b.w - a.w); near.length = Math.min(near.length, 4);
    const flash = Math.max(0, Math.min(1, o.flash || 0));
    for (const p of F.px) {
      // pixel position in world space, and its normal turned with the facing
      const nx = p.nx * face, wx = fx + (p.x - m.mid + 0.5) * k * face, wy = fy + (p.y - m.feet + 0.5) * k;
      // key light from the front and above keeps the form readable in the dark
      const key = Math.max(0, -0.35 * nx - 0.55 * p.ny + 0.76 * p.nz) * 0.5;
      let r = ambient[0] + key, gg = ambient[1] + key, b = ambient[2] + key, sr = 0, sg = 0, sb = 0;
      for (const { l } of near) {
        let lx = l.x - wx, ly = l.y - wy; const lz = 70, dl = Math.hypot(lx, ly, lz);
        const att = l.a * Math.max(0, 1 - Math.hypot(lx, ly) / l.r);
        if (att <= 0) continue;
        lx /= dl; ly /= dl; const lzn = lz / dl;
        const ndl = Math.max(0, nx * lx + p.ny * ly + p.nz * lzn);
        r += l.c[0] * ndl * att * 1.1; gg += l.c[1] * ndl * att * 1.1; b += l.c[2] * ndl * att * 1.1;
        // Blinn-Phong glint toward the viewer
        const hx = lx, hy = ly, hz = lzn + 1, hl = Math.hypot(hx, hy, hz);
        const sp = Math.pow(Math.max(0, (nx * hx + p.ny * hy + p.nz * hz) / hl), 18) * p.spec * att * 1.6;
        sr += l.c[0] * sp; sg += l.c[1] * sp; sb += l.c[2] * sp;
      }
      // cool rim light from behind the character, on the edges that face away from the viewer
      const rim = Math.pow(1 - p.nz, 1.5) * Math.max(0, -nx * face * 0.7 - p.ny * 0.5) * 0.9;
      let cr = p.r * r + sr + rim * 0.55, cg = p.g * gg + sg + rim * 0.7, cb = p.b * b + sb + rim * 0.95;
      if (flash) { cr += (1 - cr) * flash; cg += (1 - cg) * flash; cb += (1 - cb) * flash; }
      const i = (p.y * F.w + p.x) * 4;
      out[i] = Math.min(255, cr * 255); out[i + 1] = Math.min(255, cg * 255); out[i + 2] = Math.min(255, cb * 255); out[i + 3] = p.a * 255;
    }
    wg.clearRect(0, 0, work.width, work.height);
    wg.putImageData(img, 0, 0);
    g.save();
    g.imageSmoothingEnabled = false;
    if (o.alpha != null) g.globalAlpha *= o.alpha;
    g.translate(fx, fy);
    if (o.rot) g.rotate(o.rot);
    g.scale(face * k * (o.sx || 1), k * (o.sy || 1));
    g.drawImage(work, 0, 0, F.w, F.h, -m.mid, -m.feet, F.w, F.h);
    g.restore();
    return true;
  }

  // a flat coloured silhouette (dash ghosts, the shade)
  function silhouette(g, name, frame, fx, fy, o) {
    const s = sheets[name]; if (!s || !s.ready) return false;
    const key = frame + '|' + o.tint, m = s.meta, k = o.scale || SCALE;
    let c = s.tinted[key];
    if (!c) {
      const [cw, ch] = m.cell;
      c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const cg = c.getContext('2d');
      cg.drawImage(s.img, (frame % s.frames.length) * cw, 0, cw, ch, 0, 0, cw, ch);
      cg.globalCompositeOperation = 'source-in'; cg.fillStyle = o.tint; cg.fillRect(0, 0, cw, ch);
      s.tinted[key] = c;
    }
    g.save(); g.imageSmoothingEnabled = false; g.globalAlpha *= o.alpha == null ? 1 : o.alpha;
    g.translate(fx, fy); g.scale((o.face || 1) * k * (o.sx || 1), k * (o.sy || 1));
    g.drawImage(c, -m.mid, -m.feet);
    g.restore();
    return true;
  }

  // soft contact shadow on the ground under a body; fades and shrinks as it rises
  function shadow(g, cx, feetY, w) {
    const L = G.level; if (!L) return;
    const tx = Math.floor(cx / TILE);
    let ty = Math.floor((feetY + 2) / TILE), lift = 0;
    while (ty < L.h && !L.ground(tx, ty) && lift < 8) { ty++; lift++; }
    if (lift >= 8) return;
    const gy = ty * TILE, h = gy - feetY, k = Math.max(0, 1 - h / 220);
    if (k <= 0) return;
    const rw = w * (0.55 + 0.45 * k);
    const gr = g.createRadialGradient(cx, gy, 1, cx, gy, rw);
    gr.addColorStop(0, 'rgba(0,0,0,' + 0.5 * k + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.save(); g.translate(cx, gy); g.scale(1, 0.22); g.translate(-cx, -gy);
    g.fillStyle = gr; g.beginPath(); g.arc(cx, gy, rw, 0, 7); g.fill(); g.restore();
  }

  function frameOf(name, anim, t) {

<script>
'use strict';
// Physics, the player, regular enemies, projectiles and pickups.
// Everything talks to the running game through the global G (set in game.js).

class Level {
  constructor(def) {
    this.def = def; this.id = def.id; this.w = def.w; this.h = def.h;
    this.t = Uint8Array.from(def.t);
    this.pw = def.w * TILE; this.ph = def.h * TILE;
  }
  get(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= this.w || ty >= this.h) return T_SOLID;
    return this.t[ty * this.w + tx];
  }
  set(tx, ty, v) { if (tx >= 0 && ty >= 0 && tx < this.w && ty < this.h) this.t[ty * this.w + tx] = v; }
  solid(tx, ty) { const v = this.get(tx, ty); return v === T_SOLID || v === T_BREAK || v === T_GATE || v === T_CRACK || v === T_CRUMBLE; }
  hazard(tx, ty) { const v = this.get(tx, ty); return v === T_HAZARD || v === T_ACID; }
  solidAtPx(x, y) { return this.solid(Math.floor(x / TILE), Math.floor(y / TILE)); }
  ground(tx, ty) { const v = this.get(tx, ty); return v === T_SOLID || v === T_BREAK || v === T_GATE || v === T_ONEWAY || v === T_CRACK || v === T_BOUNCE || v === T_CRUMBLE; }

  lineOfSight(x0, y0, x1, y1) {
    const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8);
    for (let i = 1; i < n; i++) { const t = i / n; if (this.solidAtPx(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t)) return false; }
    return true;
  }
}

// Axis separated move with tile collision. Sets onGround / hitL / hitR / hitU.
function moveBody(b, dt, L) {
  b.hitL = b.hitR = b.hitU = false;

  b.x += dx;

  checkSpikes() {

  attackHits() {

    else hb = { x: this.face > 0 ? this.x + this.w - 4 : this.x + 4 - 70 * rk, y: this.y - 8, w: 70 * rk, h: 52 };
    this.atkBox = hb;

    if (connected && this.atkDir === 'down' || spikeHit && !this.hits.has('spike')) {

  castBolt() {

  // Dusk Cry: the Wanderer hangs in the air and a column of light stands above, striking everything in it

      for (const e of G.enemies) if (!e.dead && !e.ghostly && overlap(col, e.hb())) { e.hurt(this.spellDmg(6), e.cx > this.cx ? 1 : -1, 'wail'); this.soul = Math.min(this.maxSoul, this.soul + 1); }

  startDive() {

  }
  updateDive(dt) {
    this.vx = 0; this.vy = 1250;

    if (Math.random() < 0.8) G.burst(this.cx + rand(-8, 8), this.y, 1, { color: '#dff3ff', speed: 20, life: 0.35, size: 3, grav: -200 });

    G.burst(this.cx, this.y + this.h, 24, { color: '#dff3ff', speed: 300, life: 0.5, size: 3, vy: -120 });
    const blast = { x: this.cx - 120, y: this.y + this.h - 80, w: 240, h: 90 };
    for (const e of G.enemies) if (!e.dead && !e.ghostly && overlap(blast, e.hb())) e.hurt(this.spellDmg(18), e.cx > this.cx ? 1 : -1, 'spell');

    this.hp -= dmg; this.invuln = 1.4; this.hurtT = 0.28; this.focusT = 0; this.wailT = 0; this.castDone = true; this.dashT = 0; this.atkT = 0; this.sd = null;

    }
  }
  spikeHurt() {

  // Returns true while the Comet Heart owns the frame (charging or flying).

      }

        this.sliding = false; this.wallDir = 0;

        G.burst(this.cx - s.dir * 10, this.cy, 16, { color: '#ffd890', speed: 260, life: 0.45, size: 3 });
      }
      return true;
    }
    // flying: straight and level until a wall, a jump or a hit stops it
    if (Input.pressed('jump') || Input.pressed('dash') || Input.pressed('superdash') || Input.pressed('cast')) {

    const hb = this.hurtbox();

      Sound.play('slam'); G.shake(9, 0.3); G.hitstop(0.06);

  }
  sit(bench) {
    this.sitting = bench; this.vx = 0; this.vy = 0; this.x = bench.px - this.w / 2; this.y = bench.py - this.h;

}

// ============================== PROJECTILES ==============================
class Proj {
  constructor(o) {
    Object.assign(this, { vx: 0, vy: 0, r: 8, dmg: 1, grav: 0, life: 3, friendly: false, pierce: false, kind: 'orb', color: '#ff9bd6', passWalls: false, t: 0, hitSet: new Set() }, o);
    if (this.kind === 'shock') { this.w = this.w || 44; this.h = this.h || 34; }
  }
  rect() {
    if (this.kind === 'shock') return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
    if (this.kind === 'beam') return { x: this.x - this.bw / 2, y: 0, w: this.bw, h: G.level.ph };
    if (this.kind === 'pillar') return { x: this.x - this.bw / 2, y: this.y - this.ph, w: this.bw, h: this.ph };
    if (this.kind === 'cloud') { const k = clamp(this.t / 0.25, 0.3, 1); return { x: this.x - this.w * k / 2, y: this.y - this.h * k / 2, w: this.w * k, h: this.h * k }; }
    return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 };
  }
  update(dt) {
    const L = G.level;
    this.t += dt; this.life -= dt;
    if (this.life <= 0) { this.dead = true; return; }
    if (this.kind === 'beam' || this.kind === 'pillar') {
      // telegraph, then a short damaging window
      this.active = this.t >= this.tele && this.t < this.tele + this.dur;
      if (this.t >= this.tele + this.dur) this.dead = true;
      if (this.t >= this.tele && !this.fired) { this.fired = true; Sound.play('slam'); G.shake(4, 0.15); }
      if (this.active && !G.player.dead && overlap(G.player.hurtbox(), this.rect())) G.player.hurt(this.dmg, this.x);
      return;
    }
    this.vy += this.grav * dt;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.kind === 'cloud') {
      if (this.life < 0.3) return;      // fading puff no longer hurts
      if (!G.player.dead && overlap(G.player.hurtbox(), this.rect())) G.player.hurt(this.dmg, this.x);
      return;
    }
    if (this.kind === 'rock') {
      if (this.t < this.tele) { this.vy = 0; this.y = this.y0; return; }
      if (L.solidAtPx(this.x, this.y + this.r)) { this.dead = true; G.burst(this.x, this.y + this.r, 12, { color: '#8a94a0', speed: 160, life: 0.5, size: 4, vy: -80 }); G.shake(3, 0.1); return; }
    } else if (this.kind === 'shock') {
      const below = L.ground(Math.floor(this.x / TILE), Math.floor((this.y + 4) / TILE));
      if (!below || L.solidAtPx(this.x + Math.sign(this.vx) * this.w / 2, this.y - 6)) { this.dead = true; return; }
      if (Math.random() < 0.5) G.burst(this.x, this.y, 1, { color: this.color, speed: 40, life: 0.3, size: 3, vy: -60 });
    } else if (!this.passWalls && L.solidAtPx(this.x, this.y)) {
      this.dead = true; G.burst(this.x, this.y, 6, { color: this.color, speed: 100, life: 0.3, size: 2 }); return;
    }
    if (this.x < -80 || this.y < -200 || this.x > L.pw + 80 || this.y > L.ph + 80) { this.dead = true; return; }
    const rc = this.rect();
    if (this.friendly) {
      for (const e of G.enemies) {
        if (e.dead || e.ghostly || this.hitSet.has(e)) continue;
        if (overlap(rc, e.hb())) { this.hitSet.add(e); e.hurt(this.dmg, sign(this.vx) || 1, 'spell'); if (!this.pierce) { this.dead = true; return; } }
      }
    } else if (!G.player.dead && overlap(G.player.hurtbox(), rc)) {
      if (G.player.hurt(this.dmg, this.x) && !this.pierce) this.dead = true;
    }
  }
}

// ============================== PICKUPS ==============================
class Geo {
  constructor(x, y, v) {
    this.x = x; this.y = y; this.v = v; this.w = v >= 25 ? 14 : v >= 5 ? 11 : 8; this.h = this.w;
    this.vx = rand(-140, 140); this.vy = rand(-420, -220); this.age = 0; this.onGround = false; this.noOneway = false;
  }
  update(dt) {
    this.age += dt;
    this.vy = Math.min(this.vy + GRAV * 0.8 * dt, 700);
    if (this.onGround) this.vx *= 0.9;
    if (Charms.has('magnet') && this.age > 0.4 && !G.player.dead) {      // Geo Magnet draws it in
      const mx = G.player.cx - (this.x + this.w / 2), my = G.player.cy - (this.y + this.h / 2), md = Math.hypot(mx, my);
      if (md < 190 && md > 1) { this.vx = mx / md * 520; this.vy = my / md * 520; }
    }
    moveBody(this, dt, G.level);
    if (this.hitL || this.hitR) this.vx = -this.vx * 0.5;
    if (this.onGround && this.vy === 0 && Math.abs(this.vx) > 10 && Math.random() < 0.0) this.vy = -100;
    if (this.age > 0.25) {
      const p = G.player;
      const dx = p.cx - (this.x + this.w / 2), dy = p.cy - (this.y + this.h / 2);
      if (!p.dead && Math.abs(dx) < 26 && Math.abs(dy) < 30) { this.dead = true; p.geo += this.v; Sound.play('geo'); G.burst(this.x, this.y, 3, { color: '#fff1a8', speed: 60, life: 0.3, size: 2 }); G.geoPulse = 1; }
    }
    if (this.age > 60) this.dead = true;
  }
}

class Item {
  // kind: ability | seed | cache
  constructor(def) {
    this.def = def; this.x = def.x * TILE + TILE / 2; this.y = def.y * TILE + TILE / 2; this.t = 0; this.id = def.id; this.kind = def.kind;
  }
