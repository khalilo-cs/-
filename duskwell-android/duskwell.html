  formD(g, ell(-12, -30 - bob, 4, 3.6), [-12, -30 - bob, 4, 4], '#d8506a', { lw: 1.8 }); for (const [x, y] of [[-14, -33], [-11, -34], [-9, -32]]) { g.strokeStyle = '#e8e8f0'; g.lineWidth = 0.9; g.beginPath(); g.moveTo(x, y - bob); g.lineTo(x - 1, y - 4 - bob); g.stroke(); g.fillStyle = '#ffd070'; g.beginPath(); g.arc(x - 1, y - 4.4 - bob, 0.9, 0, 7); g.fill(); }
  g.strokeStyle = INK; g.lineWidth = 5; g.beginPath(); g.moveTo(-7, -47 - bob); g.quadraticCurveTo(0, -40 - bob, 7, -47 - bob); g.stroke(); g.strokeStyle = '#f0e0b0'; g.lineWidth = 3; g.stroke();
  g.strokeStyle = 'rgba(60,40,20,0.6)'; g.lineWidth = 0.8; for (let x = -5; x <= 5; x += 2.2) { g.beginPath(); g.moveTo(x, -45.4 - bob + Math.abs(x) * 0.1); g.lineTo(x, -43.6 - bob + Math.abs(x) * 0.1); g.stroke(); }
  // the head: a soft mask with big green eyes, feathery antennae
  maskD(g, 1, -57 - bob, 9, 9.6, { base: '#efe8f4', glow: '#7fffd8', eyeA: 0.85, brow: 0.3, lean: 1 });
  g.fillStyle = 'rgba(255,150,190,0.4)'; g.beginPath(); g.ellipse(-4, -53 - bob, 2.6, 1.6, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(8, -53 - bob, 2.6, 1.6, 0, 0, 7); g.fill();
  antennaD(g, -3, -65 - bob, -2.2, 15, -0.7, '#b8a8e8', { w: 1.5, segs: 6, knob: '#ffd0ff' }); antennaD(g, 6, -65 - bob, -0.9, 15, 0.7, '#b8a8e8', { w: 1.5, segs: 6, knob: '#ffd0ff' });
  // the sewing hand: a long needle with a trailing thread, and a spool in the other
  const nx = 17, ny = -34 - bob + Math.sin(t * 2.2) * 1.4;
  legD(g, [6, -40 - bob, 11, -36 - bob, nx, ny], 2.6, '#d8c8f0');
  g.strokeStyle = INK; g.lineWidth = 3.2; g.beginPath(); g.moveTo(nx - 2, ny + 1); g.lineTo(nx + 15, ny - 11); g.stroke(); g.strokeStyle = '#eef0f8'; g.lineWidth = 1.6; g.stroke();
  g.strokeStyle = '#ff9bd6'; g.lineWidth = 1; g.beginPath(); g.moveTo(nx + 15, ny - 11); g.quadraticCurveTo(nx + 6, ny - 24 + Math.sin(t * 3) * 3, nx - 8, ny - 14); g.stroke();
  formD(g, pol([-16, -26 - bob, -10, -26 - bob, -10, -18 - bob, -16, -18 - bob]), [-13, -22 - bob, 3, 4], '#d8506a', { lw: 1.6 });
};

// ---- the travelling trader: a hooded walker under a huge pack of goods; the cloak takes its colour from the shop
const TRADER_PAL = {
  frost:  { cloak: '#9fb4d0', trim: '#ffffff', eye: '#9fe6ff', fur: true,  lamp: '#bfe8ff' },
  ember:  { cloak: '#7a2a1c', trim: '#ff9a50', eye: '#ffb040', fur: false, lamp: '#ff9a50' },
  storm:  { cloak: '#3a4a78', trim: '#a8c0ff', eye: '#bfd0ff', fur: false, lamp: '#cfe0ff' },
  mirror: { cloak: '#7a8898', trim: '#e8f0ff', eye: '#ffffff', fur: false, lamp: '#e8f0ff' },
  ossuary: { cloak: '#8a7e66', trim: '#e8dcc0', eye: '#9fe8c0', fur: false, lamp: '#9fe8c0' },
  lunar:  { cloak: '#2a3070', trim: '#ffe6a8', eye: '#e8ecff', fur: false, lamp: '#e8ecff' },
};
NPC_ART.trader = (g, n, t, bob) => {
  const pal = TRADER_PAL[n.shop] || TRADER_PAL.frost;
  groundD(g, 36);
  // the pack: a frame piled with sacks, rolls, a pot and blades sticking out
  g.save(); g.translate(-22, -34 - bob);
  Art.drawWeapon(g, ({ ember: 'cleaver', storm: 'scythe', mirror: 'rapier', ossuary: 'bonesaw', lunar: 'rapier' })[n.shop] || 'fangs', -4, -14, -1.2, 30, t);
  formD(g, ell(0, 4, 17, 21), [0, 4, 17, 21], '#7a5a38', { spec: 0.25, lw: 3 });
  g.save(); g.beginPath(); g.ellipse(0, 4, 17, 21, 0, 0, 7); g.clip();
  stitchD(g, -16, -8, 16, -8, '#e8d098', 12); stitchD(g, -16, 10, 16, 10, '#e8d098', 12);
  hatchD(g, [0, 4, 17, 21], 36, 1.2, '#2a1c10', 0.35, { len: 5, w: 0.9, seed: 8 });
  g.restore();
  formD(g, ell(-5, -20, 11, 7), [-5, -20, 11, 7], '#8a6a40', { lw: 2.4 }); stitchD(g, -14, -20, 4, -20, '#e8d098', 6);                 // a sack on top
  formD(g, c => { c.rect(-14, 10, 28, 7); }, [0, 13, 14, 4], pal.cloak, { lw: 2.2 }); g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1; for (const x of [-8, -2, 4, 10]) { g.beginPath(); g.moveTo(x, 10); g.lineTo(x, 17); g.stroke(); }  // a rolled cloth
  formD(g, ell(12, -14, 6, 6), [12, -14, 6, 6], '#585a66', { spec: 0.6, lw: 2 }); g.fillStyle = INK; g.beginPath(); g.ellipse(12, -19, 4.4, 1.4, 0, 0, 7); g.fill();   // a pot
  g.restore();
  lantern(g, -34, -30 - bob + Math.sin(t * 1.5) * 1.2, t, pal.lamp);
  legD(g, [-4, -16, -5, -8, -6, -1], 3.8, '#2a2a34'); legD(g, [5, -16, 6, -8, 8, -1], 3.8, '#2a2a34');
  // the long cloak
  const cl = c => { c.moveTo(-9, -52 - bob); c.bezierCurveTo(-16, -40, -17, -22, -16, -4); c.lineTo(-9, -9); c.lineTo(-3, -3); c.lineTo(3, -9); c.lineTo(9, -4); c.lineTo(16, -9); c.bezierCurveTo(16, -22, 15, -40, 9, -52 - bob); c.closePath(); };
  formD(g, cl, [0, -28, 16, 26], pal.cloak, { spec: 0.25, lw: 3 });
  g.save(); g.beginPath(); cl(g); g.clip();
  g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1.4; for (const x of [-7, -1, 5, 10]) { g.beginPath(); g.moveTo(x * 0.7, -48 - bob); g.quadraticCurveTo(x * 1.5, -26, x * 1.4, -4); g.stroke(); }
  g.fillStyle = pal.trim; g.globalAlpha = 0.9; g.fillRect(-20, -9, 40, 2.4); g.globalAlpha = 1;
  if (pal.fur) { g.fillStyle = '#ffffff'; for (let x = -18; x < 18; x += 4) { g.beginPath(); g.arc(x, -5, 3.2, 0, 7); g.fill(); } }
  if (n.shop === 'mirror') { g.fillStyle = 'rgba(255,255,255,0.35)'; for (const [x, y] of [[-8, -30], [4, -22], [-2, -40], [9, -34]]) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 4, y + 3); g.lineTo(x + 1, y + 8); g.lineTo(x - 3, y + 4); g.closePath(); g.fill(); } }
  if (n.shop === 'ember') { const eg = g.createLinearGradient(0, -12, 0, -2); eg.addColorStop(0, 'rgba(255,140,50,0)'); eg.addColorStop(1, 'rgba(255,170,70,' + (0.55 + 0.25 * Math.sin(t * 4)) + ')'); g.fillStyle = eg; g.fillRect(-20, -12, 40, 10); }
  hatchD(g, [0, -28, 16, 26], 36, 1.4, '#ffffff', 0.11, { len: 5, w: 0.8, seed: 12 });
  g.restore();
  // the hood: a deep dark opening with two lit eyes
  formD(g, c => { c.moveTo(-11, -48 - bob); c.bezierCurveTo(-12, -64, -4, -70, 3, -69 - bob); c.bezierCurveTo(12, -68, 13, -56, 11, -48 - bob); c.quadraticCurveTo(0, -43 - bob, -11, -48 - bob); c.closePath(); }, [0, -58 - bob, 12, 12], pal.cloak, { spec: 0.35, lw: 3 });
  g.fillStyle = '#07090f'; g.beginPath(); g.ellipse(2.4, -55 - bob, 7.4, 8.6, 0, 0, 7); g.fill();
  for (const dx of [-1.6, 6.2]) { const bl = (t % 4.3) < 0.1; bloom(g, dx, -55 - bob, 8, pal.eye, 0.7); g.fillStyle = pal.eye; g.beginPath(); g.ellipse(dx, -55 - bob, 1.9, bl ? 0.3 : 2.6, 0, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(dx - 0.5, -56 - bob, 0.7, 0, 7); g.fill(); }
  g.strokeStyle = pal.trim; g.lineWidth = 1.4; g.beginPath(); g.moveTo(-10, -49 - bob); g.bezierCurveTo(-11, -62, -4, -68, 3, -68 - bob); g.stroke();
  // the staff and a hand on it
  g.strokeStyle = INK; g.lineWidth = 4.6; g.lineCap = 'round'; g.beginPath(); g.moveTo(20, 0); g.lineTo(20, -56); g.stroke(); g.strokeStyle = '#8a7250'; g.lineWidth = 2.4; g.stroke();
  formD(g, ell(20, -30, 3.4, 3), [20, -30, 3, 3], '#2a2a34', { lw: 1.8 });
  const hk = (x, y, r) => { g.strokeStyle = INK; g.lineWidth = 3.4; g.beginPath(); g.arc(x, y, r, 0.3, 4.4); g.stroke(); g.strokeStyle = '#c8c8d0'; g.lineWidth = 1.6; g.stroke(); };
  hk(20, -58, 5);
};

Art.drawNPC = function (g, n, t) {
  const fn = NPC_ART[n.type] || NPC_ART.merchant;
  const bob = Math.sin(t * 2 + n.px) * 1.2;
  g.save(); g.translate(n.px, n.py); g.lineJoin = 'round'; g.lineCap = 'round';
  fn(g, n, t, bob);
  g.restore();
};

</script>
<script>
'use strict';
// The bestiary: every creature of Duskwell with a large portrait, what it is and how to deal with it. A creature is
// entered when it first comes into view, and the list is kept with the save (G.seen).
const BESTIARY = [
  // ---- creatures
  { k: 'husk', area: 'hushvale', ar: ['الهيكل', 'قشرة فارغة بقي فيها بصيص نور. يجول، ثم يطاردك إذا رآك ويقفز عليك من قرب. اضربه حين يهبط.'], en: ['Husk', 'An empty shell with a spark still in it. It wanders, hunts you on sight and leaps when you are close. Strike it as it lands.'], s: 1.25 },
  { k: 'crawler', area: 'crossroads', ar: ['الزاحف', 'خنفساء مدرّعة بدرع مقطّع ووجه شاحب. تسير ذهاباً وإياباً وتطاردك إن رأتك. اضربها من الجانب فدرعها قاسٍ.'], en: ['Crawler', 'An armoured bug with a banded shell and a pale face. It paces back and forth and chases when it sees you.'] },
  { k: 'flyer', area: 'crossroads', ar: ['الطائر الشاحب', 'يرقة شاحبة بجناحين شفّافين وحلقات على جسمها. تحوم في الهواء وتنقضّ عليك.'], en: ['Pale Flyer', 'A pale larva with clear veined wings and a ringed body. It drifts through the air and dives at you.'] },
  { k: 'hopper', area: 'mossgrove', ar: ['القافز', 'كائن مستدير بقناع وقرون ظهرية وساقين قويتين. ينقبض لحظة ثم يقفز نحوك: تحرّك قبل أن يهبط.'], en: ['Hopper', 'A round masked creature with back spines and strong hind legs. It crouches, then leaps: move before it lands.'] },
  { k: 'spitter', area: 'mossgrove', ar: ['البصّاق', 'زهرة بفم مسنّن ولسان أحمر. تجمع بصاقها ثم تقذفه نحوك؛ ابقَ متحركاً وأسقطها بضربة.'], en: ['Spitter', 'A stalked bloom with a toothed maw. It gathers its spit, then flings it: keep moving.'] },
  { k: 'shard', area: 'crystal', ar: ['برج البلّور', 'عنقود بلّور حيّ بنواة مضيئة. يطلق شظايا ورديّة نحوك بعد وهجٍ قصير.'], en: ['Crystal Turret', 'A living crystal cluster with a glowing core. It fires pink shards after a short flare.'] },
  { k: 'sentinel', area: 'crossroads', ar: ['الحارس', 'حارس بدرع مجزّأ ووشاح ممزّق وسيف. تحمرّ عيناه قبل الضربة: تراجع أو اندفع خلفه.'], en: ['Sentinel', 'A guard in a banded carapace and a tattered tabard, with a sword. Its eyes turn red before it strikes.'] },
  { k: 'diver', area: 'crystal', ar: ['البعوضة', 'بعوضة مقنّعة ببطن مخطّط وخرطوم طويل. تقف لحظة ثم تنقضّ على موضعك.'], en: ['Diver', 'A masked mosquito with a striped abdomen and a long needle. It hovers, then dives where you stood.'] },
  { k: 'spider', area: 'webbed', ar: ['العنكبوت', 'عنكبوت مستدير يتدلّى من خيطه وينزل عليك. ثماني أرجل مفصّلة وفكّان وعيون صغيرة إضافية.'], en: ['Spider', 'A round spider that drops from its thread. Eight jointed legs, two fangs and a row of spare eyes.'] },
  { k: 'shroom', area: 'spore', ar: ['الفطر الماشي', 'فطر بوجه ناعس وقبعة منقّطة. ينتفخ ثم ينفخ أبواغاً سامّة إن اقتربت.'], en: ['Walking Shroom', 'A sleepy-faced toadstool with a spotted cap. It swells, then breathes toxic spores when you come close.'] },
  { k: 'jelly', area: 'aqueduct', ar: ['قنديل البحر', 'قنديل شفّاف بقلب مضيء وأهداب بحبّات متوهّجة. يطفو ببطء ولمسته تؤذي.'], en: ['Jelly', 'A clear bell with a glowing heart and beaded tendrils. It floats slowly and hurts to touch.'] },
  { k: 'warden', area: 'crossroads', ar: ['حارس الدرع', 'يحمل درعاً طويلاً مرصّعاً يصدّ كل ضربة من جهة وجهه. اقفز فوقه واضرب ظهره، أو اضربه من الأعلى.'], en: ['Shield Warden', 'It carries a tall studded shield that turns aside any blow from the front. Leap over it and strike its back.'] },
  { k: 'ram', area: 'crossroads', ar: ['النطّاح', 'وحش مشعّر بقرنين مخطّطين. يحفر الأرض ثم يندفع في خط مستقيم، فإن ارتطم بجدار ترنّح.'], en: ['Ram', 'A shaggy beast with ridged horns. It paws the ground, then charges in a line; it is dazed when it hits a wall.'] },
  { k: 'mole', area: 'frost', ar: ['الخلد', 'خلد مغطّى بالصقيع وله مخالب كالمجارف. يحفر ويظهر تحت قدميك؛ وهو مدفون لا يُصاب ولا يؤذي.'], en: ['Frost Mole', 'A frost-furred mole with spade claws. It tunnels and bursts out under your feet; buried, it cannot be hurt or hurt you.'] },
  { k: 'lavaworm', area: 'ember', ar: ['دودة الحمم', 'دودة متوهّجة الفواصل بفم مسنّن وعين ملتهبة. تخرج من أرض سيندرديب فجأة.'], en: ['Lava Worm', 'A worm with glowing seams, a toothed maw and a burning eye. It erupts from the floor of Cinderdeep.'] },
  { k: 'imp', area: 'ember', ar: ['عفريت القنابل', 'عفريت أحمر بقرنين وذيل مسنّن. يحافظ على مسافته ويقذف قنابل تنفجر حلقة نار.'], en: ['Bomb Imp', 'A red imp with horns and a barbed tail. It keeps its distance and lobs bombs that burst in rings of fire.'] },
  { k: 'veil', area: 'frost', ar: ['الحجاب', 'شبح بعباءة وطبقات من الستائر ويدين نحيلتين. يختفي ويظهر بجانبك، ثم يكشف نفسه لحظة بعد ضربته.'], en: ['Veil', 'A cloaked wraith in layers of drapery. It fades and returns beside you, and is exposed for a moment after it strikes.'] },
  { k: 'roller', area: 'ember', ar: ['المدحرج', 'حيوان مدرّع بحلقات تلتف كالكرة الشائكة. لا تصدّه السيوف وهو ملتفّ: اقفز فوقه.'], en: ['Roller', 'An armoured animal that curls into a spiked ball. Blades glance off it while it rolls: jump over it.'] },
  { k: 'slime', area: 'frost', ar: ['الهلام', 'هلام شفّاف بنواة داكنة وفقاعات. ينقسم إلى هلاميتين صغيرتين عند ضربه.'], en: ['Slime', 'A clear jelly with a dark nucleus and bubbles. It splits into two small ones when struck.'] },
  { k: 'chainman', area: 'frost', ar: ['حامل السلسلة', 'حارس ثقيل بخوذة وشقّ للعينين وسلسلة بحلقات وكرة شائكة. يدوّرها بمدى طويل: ابقَ بعيداً أو تحت الكرة.'], en: ['Chain Bearer', 'A heavy guard in a bucket helm with a linked chain and a spiked ball, whirled in a wide arc.'] },
  { k: 'moth', area: 'frost', ar: ['فراشة الليل', 'فراشة بأجنحة ذات عيون وغبار مضيء. تدور حولك ثم تنقضّ، وتضيء ما حولها.'], en: ['Night Moth', 'A moth with eyespotted wings and glowing dust. It circles you, then dives, and lights up its surroundings.'] },
  { k: 'icicle', area: 'frost', ar: ['الجليدة', 'سنّ جليد معلّق بقطرة على رأسه (أو بازلت متوهّج في سيندرديب). ترتجف ثم تسقط فتتحطم وتنمو من جديد.'], en: ['Icicle', 'A hanging spike of ice with a droplet on its tip (or glowing basalt in Cinderdeep). It trembles, falls, shatters and grows back.'] },
  { k: 'heap', area: 'ossuary', ar: ['الكومة', 'كومة عظام ترقد في الأرض حتى تقترب فتنهض هيكلاً بهراوة من عظمة فخذ. إذا هُزم تبقى جمجمته، ثم يعود مرة واحدة: اضرب الجمجمة قبل أن تلتئم.'], en: ['The Heap', 'A mound of bones that lies still until you come near, then rises as a skeleton with a femur for a club. When beaten its skull remains, and it returns once: strike the skull before it knits.'] },
  { k: 'skullbat', area: 'ossuary', ar: ['خفّاش الجمجمة', 'جمجمة بأجنحة من عظام وغشاء رقيق. تحوم فوقك جانباً لجانب ثم تفتح فكّها وتسقط ثلاث أسنان في مروحة.'], en: ['Skull Bat', 'A skull on wings of bone and thin membrane. It hangs above you, drifting side to side, then opens its jaw and drops three teeth in a fan.'] },
  { k: 'censer', area: 'ossuary', ar: ['المبخرة', 'مبخرة على شكل جمجمة تتدلّى من السقف بسلسلة وتتأرجح. إذا رأتك توهّجت ثم نفثت حلقة من الأشباح الخضراء. اضربها حين تقترب من الأرض.'], en: ['The Censer', 'A skull-shaped thurible swinging on a chain from the ceiling. When it sees you it flares and breathes a ring of green wisps. Strike it as it swings near.'] },
  { k: 'lensling', area: 'lunar', ar: ['العدسة الزاحفة', 'خنفساء بنفسجية بعين من زجاج على رقبة قصيرة. تتتبّعك بعدستها ثم تقفلها وتطلق شعاعاً رفيعاً قاتلاً. اخرج من الخط بعد أن يثبت.'], en: ['Lensling', 'A violet bug with an eye of glass on a short neck. Its lens follows you, then locks, and a thin deadly ray follows. Step off the line once it locks.'] },
  { k: 'orrery', area: 'lunar', ar: ['الفلك المصغّر', 'نواة نحاسية بعين واحدة وحلقتين وثلاث كرات تدور حولها. الكرات تجرح من يلمسها؛ اضرب النواة من بين مداراتها.'], en: ['The Orrery', 'A brass core with one eye, two rings and three orbs circling it. The orbs wound whoever touches them; strike the core between their orbits.'] },
  { k: 'lunarhare', area: 'lunar', ar: ['أرنب القمر', 'أرنب فضّي بأذنين طويلتين وهلال على جبينه. ينقبض ثم يقفز نحوك، وفي الجاذبية الضعيفة تصير قفزته طيراناً طويلاً.'], en: ['Lunar Hare', 'A silver hare with long ears and a crescent on its brow. It crouches and leaps at you, and in weak gravity its leap becomes a long flight.'] },
  // ---- bosses
  { k: 'guardian', boss: true, area: 'crossroads', ar: ['الحارس الحجري', 'خنفساء ضخمة بدرع طحلبي متشقق وفكّين وهراوة من قشرة. ينقضّ ويضرب الأرض ويندفع؛ بعد الاندفاع يترنح.'], en: ['Stone Guardian', 'A giant mossy beetle with jaws and a shell mace. It leaps, slams and charges, and is dazed after a charge.'] },
  { k: 'spore', boss: true, area: 'spore', ar: ['أمّ الفطر', 'عفريتة فطر بقبعة حمراء منقّطة وخياشيم ووجه صارم. تنثر الأبواغ وتستدعي مفرزات سامّة.'], en: ['Sporecap Matriarch', 'A toadstool matriarch with a red spotted cap, gills and a stern face. She scatters spores and calls toxic bursts.'] },

  // the stage

  const sg = g.createRadialGradient(300, 330, 20, 300, 330, 320); sg.addColorStop(0, 'rgba(60,76,110,0.55)'); sg.addColorStop(1, 'rgba(8,12,22,0.2)'); g.fillStyle = sg; g.fillRect(46, 106, 508, 388);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(46, 436, 508, 58);
  if (seen) {

    const s = b.s || clamp(Math.min(400 / (w * 1.9), 300 / (h * 1.7)), 1.2, 5.2);

  } else {

  }

  drawPanel(g, 580, 100, 340, 400);
  setDir(g); g.textAlign = 'center';
  if (seen) {
    g.font = font(28, '700'); textShadow(g, bestiaryName(b), 750, 140, b.boss ? '#ffd98a' : '#eef5ff');
    g.font = font(16, '600'); g.fillStyle = b.boss ? '#e8c070' : '#9db5d6'; g.fillText((b.boss ? tr('boss') + '  ·  ' : '') + tr('area_' + b.area), 750, 172);
    const dm = Art.creatureDummy(b.k, !!b.boss);
    if (dm && dm.maxHp) { g.font = font(16, '600'); g.fillStyle = '#c8d6ec'; g.direction = 'ltr'; g.fillText(tr('hp') + ': ' + dm.maxHp, 750, 198); setDir(g); }
    g.font = font(19, '500'); g.fillStyle = '#e1ecf8';
    wrapText(g, bestiaryDesc(b), 300).forEach((l, k) => g.fillText(l, 750, 244 + k * 27));
  } else {
    g.font = font(26, '700'); g.fillStyle = '#6d7a8c'; g.fillText('؟؟؟', 750, 150); g.font = font(18, '500'); g.fillText(tr('bestiaryUnknown'), 750, 196);

<script>

  { id: 'buy_notch1', name: 'itemNotch', desc: 'itemNotchD', price: 300, icon: 'notch', apply() { /* the notch count reads this flag */ } },
  { id: 'buy_notch2', name: 'itemNotch', desc: 'itemNotchD', price: 550, icon: 'notch', needs: 'buy_notch1', apply() { /* the notch count reads this flag */ } },
  { id: 'buy_wail', name: 'itemWail', desc: 'itemWailD', price: 500, icon: 'soul', apply() { P.ab.wail = true; G.banner = { title: tr('abil_wail'), desc: tr('abil_wail_d'), t: 0 }; G.state = 'banner'; } },
  { id: 'buy_reach', charm: 'reach', price: 120, apply() { Charms.give('reach'); } },
  { id: 'buy_boots', charm: 'boots', price: 100, apply() { Charms.give('boots'); } },
  { id: 'buy_magnet', charm: 'magnet', price: 90, apply() { Charms.give('magnet'); } },
];
const gearItem = (kind, id, price, extra) => Object.assign({ id: kind + '_' + id, gear: [kind, id], price }, extra || {});
const needDash = { req: () => !!P.ab.dash, lock: ['يحتاج اندفاع الظل', 'Needs the Shadow Dash'] };
const needSeals = n => ({ req: () => sealCount() >= n, lock: ['يحتاج ' + n + ' أختام من الحرّاس', 'Needs ' + n + ' guardian seals'] });
const needBoss = (flag, ar, en) => ({ req: () => !!G.flags[flag], lock: ['يحتاج هزيمة ' + ar, 'Defeat ' + en + ' first'] });

const SHOPS = {
  general: { title: ['التاجر الغريب', 'The Strange Merchant'], greet: 'merchant', npc: 'merchant', items: SHOP_ITEMS },
  smith: {

    items: [gearItem('weapon', 'duskblade', 380), gearItem('weapon', 'lance', 520),
      gearItem('art', 'rush', 500, needDash), gearItem('art', 'rend', 650), gearItem('art', 'nova', 1300, needSeals(3))],
  },
  outfitter: {
    title: ['الخيّاطة', 'The Outfitter'], npc: 'outfitter',
    greet: ['الخيّاطة: العباءة تحميك أكثر مما يظن الناس. اختر ما يناسب دربك.', 'Outfitter: A cloak protects more than folk think. Choose one that suits your road.'],
    items: [gearItem('cloak', 'ironhide', 500), gearItem('cloak', 'windweave', 600)],

  frost: {
    title: ['تاجر الصقيع', 'The Frost Trader'], npc: 'trader',
    greet: ['التاجر الجوّال: وصلتُ قبل الثلج ولن أرحل قبل أن أبيع. عندي ما يحتمله البرد.', 'Wandering trader: I came before the snow and I am not leaving before I have sold. Mine is gear the cold cannot beat.'],
    items: [gearItem('weapon', 'fangs', 640), gearItem('cloak', 'frostfur', 700)],
  },
  ember: {
    title: ['تاجر الجمر', 'The Ember Trader'], npc: 'trader',
    greet: ['التاجر الجوّال: الحرارة هنا تذيب الجيب والفولاذ. أما ما أبيعه فقد صُنع ليبقى.', 'Wandering trader: The heat melts purses and steel alike. What I sell was made to last.'],
    items: [gearItem('weapon', 'cleaver', 1100), gearItem('cloak', 'emberweave', 950)],
  },
  storm: {
    title: ['تاجر العاصفة', 'The Storm Trader'], npc: 'trader',
    greet: ['التاجر الجوّال: الريح تحمل بضاعتي إليك قبل أن تطلبها. اشترِ قبل أن تحملها بعيداً.', 'Wandering trader: The wind carries my wares to you before you ask. Buy before it carries them off.'],
    items: [gearItem('weapon', 'scythe', 1700), gearItem('cloak', 'soulveil', 850)],
  },
  mirror: {

    greet: ['التاجر الجوّال: في كل مرآة نسخة منّي تبيع بسعر أقل... لكنها لا تُعطي شيئاً.', 'Wandering trader: In every mirror there is a copy of me selling cheaper... but it never hands anything over.'],

  },
};

SHOPS.ossuary = {
  title: ['تاجر المقبرة', 'The Ossuary Trader'], npc: 'trader',
  greet: ['التاجر الجوّال: بين العظام لا يسأل أحد من أين جاءت البضاعة. اشترِ وارحل قبل أن تنهض الكومة.', 'Wandering trader: Among the bones nobody asks where the goods came from. Buy, and leave before the heap rises.'],
  items: [gearItem('weapon', 'bonesaw', 1500), gearItem('cloak', 'boneward', 900)],
};
SHOPS.lunar = {
  title: ['تاجر المرصد', 'The Observatory Trader'], npc: 'trader',
  greet: ['التاجر الجوّال: النجوم تُسعّر ما أبيع. وهذا النصل أغلاها: سيف رصدوه قبل أن يصنعوه.', 'Wandering trader: The stars set my prices. This blade is the dearest: a sword they foresaw before it was forged.'],
  items: [gearItem('weapon', 'rapier', 2400)],
};

const shopDef = () => SHOPS[G.shopId] || SHOPS.general;
const shopList = () => shopDef().items.filter(it => !it.needs || G.flags[it.needs]);
const shopTitle = () => sx(...shopDef().title);
const shopGreet = def => (typeof def.greet === 'string' ? tr(def.greet) : sx(...def.greet));
const shopName = it => (it.charm ? Charms.name(it.charm) : it.gear ? Gear.name(...it.gear) : tr(it.name));
const shopDesc = it => (it.charm ? Charms.desc(it.charm) : it.gear ? Gear.desc(...it.gear) : tr(it.desc));
const shopSold = it => (it.gear ? Gear.owns(...it.gear) : !!G.flags[it.id]);
const shopLocked = it => !!(it.req && !it.req());
const lockText = it => sx(...it.lock);

function buyItem(it) {
  if (it.gear) {
    const [kind, id] = it.gear;
    Gear.give(kind, id);
    if (kind === 'art') { G.banner = { title: Gear.name(kind, id), desc: Gear.desc(kind, id), t: 0 }; G.state = 'banner'; }

}
function updateShop() {
  const list = shopList(), n = list.length + 1, VIS = 4;
  if (Input.pressed('pause') || Input.pressed('map') || Input.pressed('attack')) { G.state = 'play'; Input.consume('pause'); return; }

    if (G.menuSel === n - 1) { G.state = 'play'; return; }

function gearIcon(g, gear, x, y, size, t, dim) {

// the box under the list: the whole description, the numbers, and how it compares to what is worn
function drawGearDetail(g, kind, id, y0, h, extra) {
  drawPanel(g, 160, y0, VW - 320, h);
  setDir(g); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = font(20, '700'); g.fillStyle = '#ffe9a0'; g.fillText(Gear.name(kind, id), VW / 2, y0 + 24);
  g.font = font(16, '500'); g.fillStyle = '#dfe9f6';

function openGates() {
  const L = G.level;
  for (const gt of G.gates) { L.set(gt.x, gt.y, T_AIR); G.burst(gt.x * TILE + 16, gt.y * TILE + 16, 8, { color: '#8d97a3', speed: 160, life: 0.6, size: 4 }); }
  G.gates = []; Sound.play('door');
}
function snapCamera() {
  const c = cameraTarget(); G.cam.x = c.x; G.cam.y = c.y; G.camV = { x: 0, y: 0 };
}
// Camera bounds of the current room; a room smaller than the view is centred.
function cameraBounds() {
  const L = G.level;
  const cxw = L.pw <= VW ? -(VW - L.pw) / 2 : null, cyh = L.ph <= VH ? -(VH - L.ph) / 2 : null;
  return { x0: cxw ?? 0, x1: cxw ?? L.pw - VW, y0: cyh ?? 0, y1: cyh ?? L.ph - VH };
}
function cameraTarget() {
  const b = cameraBounds();
  return { x: clamp(P.cx - VW / 2 + P.face * 36, b.x0, b.x1), y: clamp(P.cy - VH / 2 - 24 + G.look, b.y0, b.y1) };
}

G.fadeTo = function (fn, out, hold, inn) {
  if (G.state === 'trans') return;
  G.trans = { t: 0, out: out == null ? 0.25 : out, hold: hold || 0, inn: inn == null ? 0.3 : inn, fn, done: false };
  G.afterTrans = 'play'; G.state = 'trans';
};
G.respawnFade = function (x, y) {
  G.fadeTo(() => {
    P.x = x - P.w / 2; P.y = y - P.h; P.vx = 0; P.vy = 0; P.invuln = 1.4; P.hurtT = 0; snapCamera();
  }, 0.2, 0.05, 0.25);
};
G.onPlayerDeath = function () {
  G.slowmo = 1.2; G.shake(10, 0.6); G.flash = 0.5;
  G.burst(P.cx, P.cy, 30, { color: '#e9f3ff', speed: 260, life: 0.9, size: 4 });
  G.state = 'dying'; G.dyingT = 0;
  Sound.boss(false);
};
G.shadeRecovered = function (amount) { G.shade = null; G.toastMsg(tr('shadowKilled') + '  +' + amount, 3); Sound.play('heal'); };
G.collectItem = function (it) {
  const d = it.def;
  if (d.kind === 'cache') {
    P.geo += d.amount; G.flags[d.id] = true; Sound.play('geo'); G.burst(it.x, it.y, 18, { color: '#ffe9a0', speed: 200, life: 0.7, size: 3 });
    G.toastMsg(tr('cache_d') + '  +' + d.amount, 3); return;
  }
  G.flags[d.id] = true;
  if (d.kind === 'seed') { P.maxHp++; P.hp = P.maxHp; G.banner = { title: tr('seed'), desc: tr('seed_d'), t: 0 }; }
  else if (d.kind === 'fang') { P.nail += 3; G.banner = { title: tr('fang'), desc: tr('fang_d'), t: 0, big: true }; }
  else if (d.kind === 'charm') {
    Charms.give(d.charm);
    G.banner = { title: Charms.name(d.charm), desc: Charms.desc(d.charm) + '  ' + tr('charm_found_d'), t: 0, charm: d.charm };
  }
  else if (d.kind === 'ability') {
    P.ab[d.ability] = true;
    G.banner = { title: tr('abil_' + d.ability), desc: tr('abil_' + d.ability + '_d'), t: 0, big: true };
  }
  syncAbilityButtons();
  Sound.play('ability'); G.ring(it.x, it.y, '#ffffff'); G.flash = 0.6;
  G.burst(it.x, it.y, 30, { color: '#e6f3ff', speed: 240, life: 1, size: 3, grav: -60 });
  G.state = 'banner';
};
G.onBossDying = function (b) { G.bossBarShow = true; };
G.onBossDeath = function (b) {
  const a = G.arena; if (!a) return;
  a.state = 'won'; G.flags[a.def.flag] = true; G.boss = null; G.bossBarShow = false;
  for (const e of G.enemies) if (e.kind === 'brood_child') e.dead = true;
  G.dropGeo(b.cx, b.cy, b.geo); G.flash = 0.8; Sound.boss(false);
  G.burst(b.cx, b.cy, 50, { color: '#ffffff', speed: 360, life: 1.2, size: 4, grav: -30 });
  openGates();
  for (const r of [a.def.reward, a.def.reward2]) if (r) G.items.push(new Item(r));
  if (a.def.ending) { G.ending = { t: 0 }; G.fadeTo(() => { G.state = 'ending'; G.afterTrans = 'ending'; Sound.setTheme('ending'); }, 2.2, 0.4, 1.5); saveGame(); }
};

function startGame(useSave) {
  Object.assign(P, new Player());
  G.look = 0; G.lookT = 0; G.lookDir = 0;
  G.flags = {}; G.visited = {}; G.shade = null; G.time = 0; G.deaths = 0; G.lastArea = ''; G.ending = null; Charms.reset(); Gear.reset(); G.seen = {};
  let room = WORLD.startRoom, spawn = { pos: { x: WORLD.startPos.x * TILE + 16, y: (WORLD.startPos.y + 1) * TILE } };
  const s = useSave ? readSave() : null;
  if (s) {
    P.maxHp = s.maxHp; P.hp = s.maxHp; P.ab = Object.assign(P.ab, s.ab); P.geo = s.geo; P.nail = s.nail; P.soulGain = s.soulGain;
    G.flags = s.flags || {}; G.shade = s.shade; G.visited = s.visited || {}; G.time = s.time || 0; G.deaths = s.deaths || 0; Charms.load(s.charms); Gear.load(s.gear); G.seen = s.seen || {};
    room = s.room; spawn = { bench: true };
  } else {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ }
    G.bench = { room: 'town' };
  }
  enterRoom(room, spawn);
  G.afterTrans = 'play';
}

// ---------------------------------------------------------------- interaction
function nearest(list, px, range) {
  let best = null, bd = range;
  for (const o of list) { const d = Math.abs(o.px - P.cx); if (d < bd && Math.abs(o.py - (P.y + P.h)) < 60) { best = o; bd = d; } }
  return best;
}
function interact() {
  const b = nearest(G.benches, P.cx, 54);
  if (b) { P.sit(b); G.bench = { room: G.level.id }; Sound.play('bench'); saveGame(); G.hasSave = true; G.toastMsg(tr('saved'), 1.6); G.burst(b.px, b.py - 40, 16, { color: '#cfe6ff', speed: 90, life: 0.9, size: 3, grav: -90 }); return true; }
  const stn = nearest(G.stations, P.cx, 54);
  if (stn) {
    if (!stationLit(stn.room)) {
      G.flags['station_' + stn.room] = true; Sound.play('bench'); G.toastMsg(tr('stationLit'), 2.2);
      G.burst(stn.px, stn.py - 70, 18, { color: '#ffd98a', speed: 110, life: 0.9, size: 3, grav: -100 }); G.ring(stn.px, stn.py - 70, '#ffd98a', 0.4);
      return true;
    }
    if (!stationList().length) { G.toastMsg(tr('stationNone'), 2.6); return true; }
    G.state = 'travel'; G.menuSel = 0; Sound.play('select'); return true;
  }
  const n = nearest(G.npcs, P.cx, 70);
  if (n) {
    if (n.type === 'elder') G.dialog = { lines: [tr('elder1'), tr('elder2'), tr('elder3')], i: 0, t: 0 };
    else { G.shopId = n.shop || (n.type === 'smith' ? 'smith' : n.type === 'outfitter' ? 'outfitter' : 'general'); G.dialog = { lines: [shopGreet(shopDef())], i: 0, t: 0, shop: true }; }
    G.state = 'dialog'; Sound.play('select'); return true;
  }
  const s = nearest(G.signs, P.cx, 54);
  if (s) {
    const text = s.text === 'seal_gate' ? tr('seal_gate') + '  ' + sealCount() + ' / ' + SEAL_FLAGS.length : tr(s.text);
    G.dialog = { lines: [text], i: 0, t: 0 }; G.state = 'dialog'; Sound.play('select'); return true;
  }
  return false;
}
// ---------------------------------------------------------------- lantern stations (fast travel)
const STATION_FARE = 25;
const stationLit = room => room === 'town' || !!G.flags['station_' + room];
function stationList() {
  return WORLD.order.filter(id => WORLD.rooms[id].stations.length && stationLit(id) && id !== G.level.id)
    .map(id => ({ id, name: tr('area_' + WORLD.rooms[id].area), color: AREA_COLORS[WORLD.rooms[id].area] }));
}
function updateTravel() {
  const list = stationList(), n = list.length + 1;
  if (Input.pressed('pause') || Input.pressed('map') || Input.pressed('attack')) { G.state = 'play'; Input.consume('pause'); Input.consume('map'); return; }
  if (menuNav(n)) {
    if (G.menuSel === n - 1) { G.state = 'play'; return; }
    if (P.geo < STATION_FARE) { Sound.play('hurt'); G.toastMsg(tr('noGeo'), 1.5); return; }
    const dest = list[G.menuSel].id;
    P.geo -= STATION_FARE; Sound.play('confirm');
    G.fadeTo(() => enterRoom(dest, { station: true }), 0.5, 0.2, 0.5);
  }
  G.menuSel = Math.min(G.menuSel, n - 1);
}


// ---------------------------------------------------------------- update
function updateParticles(dt) {
  for (const p of G.parts) { p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.life);
}

function updatePlay(dt) {
  const L = G.level;
  if (Input.pressed('pause')) { G.state = 'pause'; G.menu = 'pause'; G.menuSel = 0; Input.consume('pause'); return; }
  if (Input.pressed('map')) { G.state = 'map'; Input.consume('map'); Sound.play('select'); return; }
  G.time += dt;
  // storm: a flash of lightning every few seconds, the thunder a moment behind it
  if (G.bolt > 0) G.bolt = Math.max(0, G.bolt - dt * 2.6);
  if (L.def.theme === 'storm' && (G.boltCD -= dt) <= 0) { G.bolt = 1; G.boltCD = rand(4.5, 11); setTimeout(() => Sound.play('thunder'), 350); }
  Mech.update(dt);
  P.update(dt);
  if (G.state !== 'play') return;           // hurt() may have changed it
  // a cracked soul vessel: while the shade still holds your Geo, only two thirds of the soul can be kept
  P.maxSoul = G.shade ? 66 : 99; if (P.soul > P.maxSoul) P.soul = P.maxSoul;
  // looking up or down: hold the key while standing still and the camera drifts that way
  const still = P.onGround && !P.sitting && Input.axisX() === 0 && P.atkT <= 0 && P.hurtT <= 0 && !P.diving && !P.sd && !P.wailT;
  const iy = still ? Input.axisY() : 0;
  if (iy !== 0 && iy === G.lookDir) G.lookT += dt; else { G.lookDir = iy; G.lookT = 0; }
  G.look = lerp(G.look, G.lookT > 0.55 ? G.lookDir * 130 : 0, 1 - Math.exp(-dt * 5));
  if (Input.pressed('up') && !P.sitting && P.onGround && P.hurtT <= 0 && P.atkT <= 0) interact();
  if (Input.pressed('mute')) Sound.toggle();

  for (const e of G.enemies) { if (e.frozenT > 0) { e.frozenT -= dt; e.flash = 0; continue; } e.update(dt); }
  for (const p of G.projs) p.update(dt);
  for (const c of G.geos) c.update(dt);
  for (const it of G.items) it.update(dt);
  G.enemies = G.enemies.filter(e => !e.dead); G.projs = G.projs.filter(p => !p.dead);
  G.geos = G.geos.filter(c => !c.dead); G.items = G.items.filter(i => !i.dead);

  // contact damage
  if (!P.dead) {
    const hb = P.hurtbox();
    for (const e of G.enemies) {
      if (e.dead || e.ghostly || e.dmg <= 0 || e.frozenT > 0) continue;
      if (e.isBoss && (e.state === 'intro' || e.state === 'dying')) continue;
      if (e.alpha !== undefined && e.alpha < 0.6) continue;
      if (overlap(hb, e.body())) P.hurt(e.dmg, e.cx);
    }
  }

  // the bestiary: a creature is entered when it first comes into view
  for (const e of G.enemies) {
    if (e.dead || Math.abs(e.cx - P.cx) > 520 || Math.abs(e.cy - P.cy) > 330) continue;
    const key = bestiaryKey(e);
    if (key && !G.seen[key]) { G.seen[key] = true; G.toastMsg(tr('bestiaryNew') + bestiaryName(BESTIARY[BESTIARY_INDEX[key]]), 2.4); }
  }

  // Cinder Edge: a struck enemy smoulders, then takes the burn
  for (const e of G.enemies) {
    if (!(e.burnT > 0) || e.dead) continue;
    e.burnT -= dt;
    if (Math.random() < 0.45) G.burst(e.cx + rand(-10, 10), e.cy + rand(-16, 10), 1, { color: pick(['#ff8a3a', '#ffd070']), speed: 40, life: 0.5, size: 2, vy: -55 });
    if (e.burnT <= 0) e.hurt(3, 0, 'burn');
  }
  // Bone Saw: the wound keeps bleeding a little
  for (const e of G.enemies) {
    if (!(e.bleedT > 0) || e.dead) continue;
    e.bleedT -= dt;
    if (Math.random() < 0.5) G.burst(e.cx + rand(-8, 8), e.cy + rand(-10, 12), 1, { color: '#b8242a', speed: 30, life: 0.5, size: 2, vy: 30, grav: 260 });
    if ((e.bleedTick = (e.bleedTick || 0) + dt) >= 0.35) { e.bleedTick = 0; e.hurt(1, 0, 'burn'); }
  }

  // arena trigger
  const a = G.arena;
  if (a && a.state === 'idle' && ((a.def.triggerDir || 1) > 0 ? P.cx > a.def.trigger * TILE : P.cx < a.def.trigger * TILE) && P.onGround) {
    a.state = 'fight';
    for (const gt of a.def.gates) if (gt.close === 'start') closeGate(gt);
    const B = BOSS_TYPES[a.def.boss];
    const boss = new B({ x: a.def.spawn.x, y: a.def.spawn.y });
    G.enemies.push(boss); G.boss = boss;
    Sound.boss(true, a.def.boss);
  }

  // doors
  if (G.doorLock) {
    let inside = false;
    for (const d of L.def.doors) if (P.cx > d.x * TILE && P.cx < (d.x + d.w) * TILE && P.cy > d.y * TILE && P.cy < (d.y + d.h) * TILE) inside = true;
    if (!inside) G.doorLock = false;
  } else if (!P.dead) {
    for (const d of L.def.doors) {
      if (P.cx > d.x * TILE && P.cx < (d.x + d.w) * TILE && P.cy > d.y * TILE && P.cy < (d.y + d.h) * TILE) {
        if (L.get(d.x, d.y) === T_GATE) continue;
        const target = { room: d.to, door: d.toDoor };
        G.fadeTo(() => enterRoom(target.room, { door: target.door }), 0.22, 0.05, 0.28);
        break;
      }
    }
  }
  // keep inside the room
  if (P.x < 0) { P.x = 0; P.vx = Math.max(0, P.vx); }
  if (P.x + P.w > L.pw) { P.x = L.pw - P.w; P.vx = Math.min(0, P.vx); }
  if (P.y > L.ph + 200) { P.spikeHurt(); }

  // camera: SmoothDamp toward the target, then clamp to the room bounds
  const c = cameraTarget();
  [G.cam.x, G.camV.x] = smoothDamp(G.cam.x, c.x, G.camV.x, 0.16, dt);
  [G.cam.y, G.camV.y] = smoothDamp(G.cam.y, c.y, G.camV.y, P.vy > 400 ? 0.1 : 0.24, dt);
  const b = cameraBounds();
  G.cam.x = clamp(G.cam.x, b.x0, b.x1); G.cam.y = clamp(G.cam.y, b.y0, b.y1);
}

function updateTrans(dt) {
  const tr_ = G.trans; tr_.t += dt;
  if (tr_.t < tr_.out) G.fadeA = tr_.t / tr_.out;
  else {
    if (!tr_.done) { tr_.done = true; G.fadeA = 1; tr_.fn(); }
    const u = tr_.t - tr_.out - tr_.hold;
    if (u < 0) G.fadeA = 1;
    else if (u < tr_.inn) G.fadeA = 1 - u / tr_.inn;
    else { G.fadeA = 0; G.trans = null; if (G.state === 'trans') G.state = G.afterTrans || 'play'; }
  }
}

function updateDying(dt) {
  G.dyingT += dt;
  if (G.dyingT > 1.3 && !G.trans) {
    G.fadeTo(() => {
      G.deaths++;
      const dropGeo = P.geo;
      G.shade = dropGeo > 0 ? { room: G.level.id, x: clamp(P.cx, 40, G.level.pw - 40), y: clamp(P.cy, 40, G.level.ph - 60), geo: dropGeo } : (G.shade && G.shade.room ? G.shade : null);
      if (dropGeo > 0) P.geo = 0;
      P.hp = P.maxHp; P.soul = 0; P.dead = false;
      enterRoom(G.bench.room, { bench: true });
      G.deathText = 3;
      G.afterTrans = 'play';
    }, 0.6, 0.6, 0.6);
  }
}

function menuNav(n) {
  if (Input.pressed('up')) { G.menuSel = (G.menuSel + n - 1) % n; Sound.play('select'); }
  if (Input.pressed('down')) { G.menuSel = (G.menuSel + 1) % n; Sound.play('select'); }
  return Input.pressed('confirm');
}

function updateTitle() {
  const items = titleItems();
  if (G.confirmNew) {
    if (Input.pressed('left') || Input.pressed('right') || Input.pressed('up') || Input.pressed('down')) { G.menuSel ^= 1; Sound.play('select'); }
    if (Input.pressed('confirm')) { Sound.play('confirm'); if (G.menuSel === 0) { G.confirmNew = false; G.fadeTo(() => startGame(false), 0.5, 0.2, 0.6); } else G.confirmNew = false; G.menuSel = 0; }
    if (Input.pressed('pause')) { G.confirmNew = false; G.menuSel = 0; }
    return;
  }
  if (menuNav(items.length)) {
    Sound.play('confirm');
    const it = items[G.menuSel].id;
    if (it === 'cont') G.fadeTo(() => startGame(true), 0.5, 0.2, 0.6);
    else if (it === 'new') { if (G.hasSave) { G.confirmNew = true; G.menuSel = 1; } else G.fadeTo(() => startGame(false), 0.5, 0.2, 0.6); }
    else if (it === 'lang') { setLang(LANG.cur === 'ar' ? 'en' : 'ar'); }
  }
}
function titleItems() {
  const a = [];
  if (G.hasSave) a.push({ id: 'cont', label: tr('cont') });
  a.push({ id: 'new', label: tr('newgame') });
  a.push({ id: 'lang', label: tr('lang') });
  return a;
}
function gfxLabel() {
  const m = Lumen.mode(), ar = LANG.cur === 'ar';
  if (!Lumen.ready()) return ar ? 'قديمة (WebGL غير متاح)' : 'Classic (no WebGL)';
  return m === 'auto' ? (ar ? 'تلقائي' : 'Auto') : m === 2 ? (ar ? 'عالية' : 'High') : m === 1 ? (ar ? 'عادية' : 'Normal') : (ar ? 'قديمة' : 'Classic');
}
function pauseItems() {
  return [{ id: 'resume', label: tr('resume') }, { id: 'map', label: tr('map') }, { id: 'charms', label: tr('charms') }, { id: 'gear', label: sx('المعدات', 'Equipment') }, { id: 'bestiary', label: tr('bestiary') },
    { id: 'sound', label: tr('sound') + ': ' + (Sound.isOn() ? tr('on') : tr('off')) },
    { id: 'lang', label: tr('lang') }, { id: 'look', label: (LANG.cur === 'ar' ? 'شكل البطل: ' : 'Hero look: ') + HeroStyle.label() }, { id: 'gfx', label: tr('gfx') + ': ' + gfxLabel() }, { id: 'skins', label: LANG.cur === 'ar' ? 'صورك الخاصة' : 'Your images' }, { id: 'quit', label: tr('quit') }];
}
function updatePause() {
  const items = pauseItems();
  if (Skins.isOpen()) return;
  if (Input.pressed('pause')) { G.state = 'play'; Input.consume('pause'); return; }
  if (menuNav(items.length)) {
    Sound.play('confirm');
    const id = items[G.menuSel].id;
    if (id === 'resume') G.state = 'play';
    else if (id === 'map') G.state = 'map';
    else if (id === 'charms') { G.state = 'charms'; G.charmSel = 0; G.charmNote = null; }
    else if (id === 'gear') { G.state = 'gear'; G.gearSel = 0; G.gearT = 0; }
    else if (id === 'bestiary') { G.state = 'bestiary'; G.bestT = 0; }
    else if (id === 'sound') Sound.toggle();
    else if (id === 'lang') setLang(LANG.cur === 'ar' ? 'en' : 'ar');
    else if (id === 'skins') Skins.open();
    else if (id === 'look') HeroStyle.next();
    else if (id === 'gfx' && Lumen.ready()) Lumen.setMode({ auto: 2, 2: 1, 1: 0, 0: 'auto' }[Lumen.mode()]);
    else if (id === 'quit') { G.fadeTo(() => { G.state = 'title'; G.afterTrans = 'title'; G.menuSel = 0; Sound.boss(false); Sound.setTheme('title'); G.hasSave = readSave() !== null; }, 0.4, 0.1, 0.4); }
  }
}

function updateDialog(dt) {
  const d = G.dialog; d.t += dt;
  if (Input.pressed('confirm') || Input.pressed('attack') || Input.pressed('up')) {
    Sound.play('select');
    if (d.i < d.lines.length - 1) { d.i++; d.t = 0; }
    else if (d.shop) { G.dialog = null; G.state = 'shop'; G.menuSel = 0; G.shopTop = 0; }
    else { G.dialog = null; G.state = 'play'; }
  }
}
// ---------------------------------------------------------------- the charm screen
const CHARM_COLS = 7;
function updateCharms(dt) {
  const list = Charms.ownedList(), n = list.length;
  if (G.charmNote) { G.charmNote.t += dt; if (G.charmNote.t > 3) G.charmNote = null; }
  if (Input.pressed('pause') || Input.pressed('map') || Input.pressed('attack')) { G.state = 'pause'; Input.consume('pause'); Input.consume('map'); Sound.play('select'); return; }
  if (!n) return;
  G.charmSel = clamp(G.charmSel, 0, n - 1);
  const move = d => { G.charmSel = clamp(G.charmSel + d, 0, n - 1); Sound.play('select'); };
  if (Input.pressed('left')) move(-1);
  if (Input.pressed('right')) move(1);
  if (Input.pressed('up')) move(-CHARM_COLS);
  if (Input.pressed('down')) move(CHARM_COLS);
  if (Input.pressed('confirm')) {
    if (!P.sitting) { Sound.play('hurt'); G.charmNote = { text: tr('charmsBench'), t: 0, bad: true }; return; }
    const r = Charms.toggle(list[G.charmSel]);
    if (r === 'full') { Sound.play('hurt'); G.charmNote = { text: tr('charmsFull'), t: 0, bad: true }; }
    else {
      Sound.play(r === 'off' ? 'select' : 'confirm');
      G.charmNote = r === 'over' ? { text: tr('overcharm'), t: 0, bad: true } : null;
    }
  }
}
function updateBanner(dt) {
  const b = G.banner; b.t += dt;
  if (b.t > 1.4 && (Input.pressed('confirm') || Input.pressed('attack')) || b.t > 7) { G.banner = null; G.state = 'play'; }
}

function update(dt) {
  G.t += dt;
  if (G.toast) { G.toast.t += dt; if (G.toast.t > G.toast.dur) G.toast = null; }

    case 'gear': updateGear(dt); break;
    case 'trans': updateTrans(dt); break;
    case 'pause': updatePause(); break;
    case 'map': if (Input.pressed('map') || Input.pressed('pause') || Input.pressed('confirm') || Input.pressed('attack')) { G.state = 'play'; Input.consume('map'); Input.consume('pause'); } break;
    case 'dialog': updateDialog(dt); updateParticles(dt); break;
    case 'shop': updateShop(); break;
    case 'charms': updateCharms(dt); break;
    case 'travel': updateTravel(); break;
    case 'banner': updateBanner(dt); updateParticles(dt); for (const it of G.items) it.t += dt; break;
    case 'ending': G.ending.t += dt; if (G.ending.t > 4 && Input.pressed('confirm')) { G.fadeTo(() => { G.state = 'title'; G.afterTrans = 'title'; G.hasSave = readSave() !== null; G.menuSel = 0; Sound.setTheme('title'); }, 0.6, 0.2, 0.6); } break;

// light sources in screen space for the darkness map
function collectLights(cx, cy, skipPlayer) {
  const L = G.level, th = THEMES[L.def.theme], out = [];
  const add = (x, y, r, a, c) => out.push({ x: x - cx, y: y - cy, r, a, c });
  if (!P.dead && !skipPlayer) add(P.cx, P.cy - 6, (P.focusT > 0 ? 300 : 250) * (Charms.has('wick') ? 1.4 : 1), 1, '#cfe8ff');
  if (P.wailT > 0) add(P.cx, (P.wailTop + P.y) / 2, 320, 1, '#dff3ff');
  for (const d of L.def.deco) {
    if (d.type === 'lamp') add(d.x * TILE + 16, d.y * TILE - 70, 280, 0.95, th.glow);
    else if (d.type === 'light') add(d.x * TILE + 16, d.y * TILE + 16, d.r || 220, d.a || 0.8, d.c || th.glow);
  }
  for (const b of G.benches) add(b.px, b.py - 40, 200, 0.85, '#ffe2a8');
  for (const n of G.npcs) add(n.px, n.py - 40, 170, 0.8, '#ffd98a');
  for (const s of G.stations) if (stationLit(s.room)) add(s.px, s.py - 70, 230, 0.9, '#ffd98a');
  for (const it of G.items) add(it.x, it.y, 190, 0.9, '#e6f3ff');
  for (const c of G.geos) add(c.x, c.y, 50, 0.5, null);
  for (const p of G.projs) {
    if (p.kind === 'beam' || p.kind === 'pillar') { if (p.t >= p.tele) add(p.x, p.kind === 'beam' ? cy + VH / 2 : p.y - 100, 260, 0.9, p.color); }
    else add(p.x, p.y, p.friendly ? 190 : 110, p.friendly ? 1 : 0.75, p.color);
  }
  for (const e of G.enemies) {
    if (e.isBoss) add(e.cx, e.cy, e.bossKey === 'wraith' || e.bossKey === 'king' ? 300 : 230, 0.7, e.blood);
    else if (e.glowR) add(e.cx, e.cy, e.glowR, 0.7, e.blood);
  }
  for (const d of L.def.doors) add((d.x + d.w / 2) * TILE, (d.y + d.h / 2) * TILE, 170, 0.55, th.fog);

    const x0 = Math.max(0, Math.floor(cx / TILE)), x1 = Math.min(L.w - 1, Math.floor((cx + VW) / TILE)), y0 = Math.max(0, Math.floor(cy / TILE) - 1), y1 = Math.min(L.h - 1, Math.floor((cy + VH) / TILE));

function drawCharms(g) {

function drawBanner(g) {

function draw() {
  const g = G.g;
  g.setTransform(G.k, 0, 0, G.k, 0, 0);
  g.fillStyle = '#000'; g.fillRect(0, 0, VW, VH);
  g.lineJoin = 'round';
  switch (G.state) {
    case 'title': drawTitle(g); break;
    case 'ending': drawEnding(g); break;
    default:
      if (G.level) {
        drawWorld(g); drawHUD(g);
        if (G.state === 'map') drawMap(g);
        if (G.state === 'pause') { g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, VW, VH); setDir(g); g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = font(40, '700'); textShadow(g, tr('pause'), VW / 2, 62, '#eef5ff'); drawMenu(g, pauseItems(), G.menuSel, 112, 36); g.font = font(15, '500'); g.fillStyle = 'rgba(200,215,240,0.6)'; g.fillText(tr('ctl'), VW / 2, VH - 24); }
        if (G.state === 'dialog') drawDialog(g);
        if (G.state === 'shop') drawShop(g);
        if (G.state === 'charms') drawCharms(g);
        if (G.state === 'bestiary') drawBestiary(g);
        if (G.state === 'gear') drawGear(g);
        if (G.state === 'travel') drawTravel(g);
        if (G.state === 'banner') drawBanner(g);
      }
  }
  if (G.fadeA > 0) { g.fillStyle = 'rgba(0,0,0,' + G.fadeA + ')'; g.fillRect(0, 0, VW, VH); }
}

// ---------------------------------------------------------------- boot
function resize() {
  const c = G.canvas, r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.max(320, Math.round(r.width * dpr)); c.height = Math.round(c.width * 9 / 16);
  G.k = c.width / VW; G.tileCanvas = null;
}
function boot() {
  G.canvas = document.getElementById('c'); G.g = G.canvas.getContext('2d');
  Lumen.init(); Input.init(); resize(); window.addEventListener('resize', resize); refreshTouchLabels();
  const wake = () => Sound.init();
  // tapping the picture focuses it for the keyboard and works as "confirm" on menus
  G.canvas.addEventListener('pointerdown', () => {
    try { G.canvas.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
    if (G.state === 'title' || G.state === 'ending' || G.state === 'dialog' || G.state === 'banner') window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Enter' })), window.dispatchEvent(new KeyboardEvent('keyup', { code: 'Enter' }));
  });
  window.addEventListener('keydown', wake); window.addEventListener('pointerdown', wake);
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') { G.state = 'pause'; G.menu = 'pause'; G.menuSel = 0; } });
  Art.ambientInit();
  let last = performance.now(), acc = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - last) / 1000); last = now; acc += dt;
    Input.poll();
    let guard = 0;
    if (G.manual) { acc = 0; return; }     // bots step the game themselves and ask for a picture with DW.draw()
    Lumen.adapt(dt * 1000);
    while (acc >= STEP && guard++ < 6) { update(STEP); acc -= STEP; Input.endStep(); }
    if (guard >= 6) acc = 0;
    draw();
  }
  requestAnimationFrame(frame);
  const fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  fontsReady.then(() => { /* canvas text uses fallbacks until web fonts arrive, which is fine */ });
}
// the Comet Heart button only appears once the ability is found

  const b = document.querySelector('[data-act=superdash]');
  if (b) b.hidden = !P.ab.superdash;
}
function refreshTouchLabels() {
  const caps = { cast: ['روح', 'Soul'], dash: ['اندفاع', 'Dash'], attack: ['ضرب', 'Strike'], jump: ['قفز', 'Jump'], superdash: ['شهاب', 'Comet'] };
  document.querySelectorAll('[data-cap]').forEach(el => { el.textContent = caps[el.dataset.cap][LANG.cur === 'ar' ? 0 : 1]; });
}
window.refreshTouchLabels = refreshTouchLabels;
window.DW = { G, P, Charms, Gear, SHOPS, shopList, shopSold, shopLocked, buyItem, sealCount, Lumen, draw: () => draw(), enterRoom, startGame, WORLD, Input, step(n) { for (let i = 0; i < n; i++) { update(STEP); Input.endStep(); } } };
window.addEventListener('DOMContentLoaded', boot);
